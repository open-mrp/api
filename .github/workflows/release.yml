name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Existing release tag to run the pipeline for (e.g. v0.23.1). Only
          valid for the MOST RECENT release: change detection diffs against
          the newest other tag.
        required: true
        type: string
      all_services:
        description: >-
          Rebuild and redeploy every service, ignoring change detection. Needed
          when the fix is to the pipeline itself — such a commit touches no
          service code, so detection selects nothing and images that failed to
          push are never rebuilt.
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.resolve.outputs.release_created }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push'
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Satisfy Detect Changes on the release PR
        if: github.event_name == 'push' && steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          pr_number="$(echo "$PR_JSON" | jq -r '.number')"
          head_sha="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
          gh api --method POST "repos/${{ github.repository }}/statuses/${head_sha}" \
            -f state=success \
            -f context='Detect Changes' \
            -f description='Skipped: release PR touches no Go or migration paths'

      - name: Validate dispatched tag
        if: github.event_name == 'workflow_dispatch'
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          release_tag="$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          latest_tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          if [[ "$release_tag" != "$latest_tag" ]]; then
            echo "Manual release resume is only allowed for the latest release tag: $latest_tag" >&2
            exit 1
          fi

          git fetch --force --tags origin refs/heads/main:refs/remotes/origin/main
          tag_sha="$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/main; then
            echo "Release tag $release_tag does not point to a commit on main." >&2
            exit 1
          fi

          echo "tag_name=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Resolve release outputs
        id: resolve
        env:
          VALIDATED_TAG_NAME: ${{ steps.validate.outputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${VALIDATED_TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=${{ steps.release.outputs.release_created }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

  detect-changes:
    name: Detect Release Changes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.detect.outputs.previous_tag }}
      current_ref: ${{ steps.detect.outputs.current_ref }}
      services_json: ${{ steps.detect.outputs.services_json }}
      services_csv: ${{ steps.detect.outputs.services_csv }}
      matrix_json: ${{ steps.detect.outputs.matrix_json }}
      has_services: ${{ steps.detect.outputs.has_services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect release changes since last release
        id: detect
        run: go run ./cmd/detect-release-changes --current-tag "${{ needs.release-please.outputs.tag_name }}" ${{ inputs.all_services && '--all-services' || '' }}

      - name: Summarize release selection
        run: |
          PREVIOUS_TAG="${{ steps.detect.outputs.previous_tag }}"
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="(none)"
          fi

          {
            echo "## Release selection"
            echo ""
            echo "- Previous tag: ${PREVIOUS_TAG}"
            echo "- Current ref: ${{ steps.detect.outputs.current_ref }}"
            echo "- Services: ${{ steps.detect.outputs.services_json }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-push:
    name: Build and Push
    needs: [release-please, detect-changes]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      needs.detect-changes.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix_json) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_PUSH }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/production/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:${{ needs.release-please.outputs.tag_name }}
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: [release-please, detect-changes, build-push]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.detect-changes.result == 'success' &&
      (needs.build-push.result == 'success' || needs.build-push.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Deploy via open-mrp/infra
        run: ./scripts/dispatch-infra-deploy.sh
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ needs.release-please.outputs.tag_name }}
          DEPLOY_SERVICES: ${{ needs.detect-changes.outputs.services_csv }}

  publish-openapi-specs:
    name: Publish OpenAPI Specs
    env:
      PUBLIC_SPEC_BUCKET: ${{ vars.PUBLIC_SPEC_BUCKET }}
      INTERNAL_SPEC_BUCKET: ${{ vars.INTERNAL_SPEC_BUCKET }}
    needs: [release-please, deploy]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      internal_spec_changed: ${{ steps.compare-internal.outputs.changed }}
      public_spec_changed: ${{ steps.compare-public.outputs.changed }}
      api_version: ${{ steps.api-version.outputs.api_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_OPENAPI_WRITER }}
          aws-region: us-east-2

      - name: Install Modules
        run: |
          go mod tidy
          cd tools && go mod tidy

      - name: Resolve API version
        id: api-version
        run: echo "api_version=$(go run ./cmd/print-version)" >> "$GITHUB_OUTPUT"

      - name: Snapshot current OpenAPI specs from S3 (pre-upload baseline)
        run: |
          mkdir -p specs/sdk-baseline
          aws s3 cp "s3://${PUBLIC_SPEC_BUCKET}/openapi.json" specs/sdk-baseline/public_openapi_spec.json 2>/dev/null || true
          aws s3 cp "s3://${INTERNAL_SPEC_BUCKET}/openapi.json" specs/sdk-baseline/internal_openapi_spec.json 2>/dev/null || true

      - name: Generate OpenAPI Specs and Stainless configs
        run: make openapi-stainless

      - name: Compare internal OpenAPI spec to S3 baseline
        id: compare-internal
        run: ./scripts/sdk-openapi-spec-changed.sh internal

      - name: Compare public OpenAPI spec to S3 baseline
        id: compare-public
        run: ./scripts/sdk-openapi-spec-changed.sh public

      - name: Upload Public Release Artifacts to S3
        run: |
          api_version="${{ steps.api-version.outputs.api_version }}"
          aws s3 cp specs/public_openapi_spec.json "s3://${PUBLIC_SPEC_BUCKET}/openapi.json"
          aws s3 cp specs/public_openapi_spec.json "s3://${PUBLIC_SPEC_BUCKET}/${api_version}.json"
          aws s3 cp stainless/public/stainless.yml "s3://${PUBLIC_SPEC_BUCKET}/stainless.yml"
          aws s3 cp stainless/public/stainless.yml "s3://${PUBLIC_SPEC_BUCKET}/${api_version}-stainless.yml"

      - name: Upload Private Release Artifacts to S3
        run: |
          api_version="${{ steps.api-version.outputs.api_version }}"
          aws s3 cp specs/internal_openapi_spec.json "s3://${INTERNAL_SPEC_BUCKET}/openapi.json"
          aws s3 cp specs/internal_openapi_spec.json "s3://${INTERNAL_SPEC_BUCKET}/${api_version}.json"
          aws s3 cp stainless/internal/stainless.yml "s3://${INTERNAL_SPEC_BUCKET}/stainless.yml"
          aws s3 cp stainless/internal/stainless.yml "s3://${INTERNAL_SPEC_BUCKET}/${api_version}-stainless.yml"

  generate-sdks:
    name: Generate SDKs with stlc
    needs: [release-please, deploy, publish-openapi-specs]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success' &&
      needs.publish-openapi-specs.result == 'success'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/stlc-generate-reusable.yml
    with:
      api_version: ${{ needs.release-please.outputs.tag_name }}
      push_branch: main
      openapi_specs_source: s3
      openapi_internal_gate: ${{ needs.publish-openapi-specs.outputs.internal_spec_changed }}
      openapi_public_gate: ${{ needs.publish-openapi-specs.outputs.public_spec_changed }}
    secrets:
      STLC_READ_TOKEN: ${{ secrets.STLC_READ_TOKEN }}
      SDK_WRITE_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}

  build-deploy-mcp:
    name: Build and Deploy MCP Server
    needs: [release-please, deploy, publish-openapi-specs, generate-sdks]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success' &&
      needs.generate-sdks.result == 'success' &&
      needs.publish-openapi-specs.outputs.public_spec_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout API repo (deploy dispatch script)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Checkout typescript-sdk (MCP build context)
        uses: actions/checkout@v7
        with:
          repository: open-mrp/typescript-sdk
          ref: main
          token: ${{ secrets.SDK_WRITE_TOKEN }}
          persist-credentials: false
          path: typescript-sdk-src

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_MCP_ECR_PUSH }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push MCP Server image
        uses: docker/build-push-action@v7
        with:
          context: typescript-sdk-src
          file: typescript-sdk-src/packages/mcp-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/mcp-server:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/augno/mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy MCP Server via open-mrp/infra
        run: ./scripts/dispatch-infra-deploy.sh
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_SERVICES: ""
          MCP_IMAGE_TAG: ${{ env.IMAGE_TAG }}

  notify-consumers:
    name: Notify ${{ matrix.consumer }}
    needs: [release-please, deploy, publish-openapi-specs]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success' &&
      needs.publish-openapi-specs.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - open-mrp/public-docs
          - open-mrp/openapi-spec
    steps:
      - name: Dispatch api-release
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: ${{ matrix.consumer }}
          event-type: api-release
          client-payload: '{"api_version": "${{ needs.publish-openapi-specs.outputs.api_version }}", "release_version": "${{ needs.release-please.outputs.tag_name }}"}'
