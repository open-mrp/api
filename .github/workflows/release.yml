name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Existing release tag to run the pipeline for (e.g. v0.23.1). Only
          valid for the MOST RECENT release: change detection diffs against
          the newest other tag.
        required: true
        type: string
      all_services:
        description: >-
          Rebuild and redeploy every service, ignoring change detection. Needed
          when the fix is to the pipeline itself — such a commit touches no
          service code, so detection selects nothing and images that failed to
          push are never rebuilt.
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.resolve.outputs.release_created }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      tag_ref: ${{ steps.resolve.outputs.tag_ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_head_ref: ${{ steps.resolve.outputs.pr_head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push'
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Satisfy Detect Changes on the release PR
        if: github.event_name == 'push' && steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          pr_number="$(echo "$PR_JSON" | jq -r '.number')"
          head_sha="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
          gh api --method POST "repos/${{ github.repository }}/statuses/${head_sha}" \
            -f state=success \
            -f context='Detect Changes' \
            -f description='Skipped: release PR touches no Go or migration paths'

      - name: Validate dispatched tag
        if: github.event_name == 'workflow_dispatch'
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          release_tag="$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          latest_tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          if [[ "$release_tag" != "$latest_tag" ]]; then
            echo "Manual release resume is only allowed for the latest release tag: $latest_tag" >&2
            exit 1
          fi

          git fetch --force --tags origin refs/heads/main:refs/remotes/origin/main
          tag_sha="$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/main; then
            echo "Release tag $release_tag does not point to a commit on main." >&2
            exit 1
          fi

          echo "tag_name=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "tag_ref=refs/tags/${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Resolve release outputs
        id: resolve
        env:
          VALIDATED_TAG_NAME: ${{ steps.validate.outputs.tag_name }}
          VALIDATED_TAG_REF: ${{ steps.validate.outputs.tag_ref }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${VALIDATED_TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag_ref=${VALIDATED_TAG_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=${{ steps.release.outputs.release_created }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "tag_ref=refs/tags/${{ steps.release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${RELEASE_PR:-}" ] && [ "${RELEASE_PR}" != "null" ]; then
            echo "pr_number=$(echo "$RELEASE_PR" | jq -r '.number // empty')" >> "$GITHUB_OUTPUT"
            echo "pr_head_ref=$(echo "$RELEASE_PR" | jq -r '.headBranchName // empty')" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${RELEASE_CREATED:-}" != "true" ]; then
            # release-please reports the release PR only when it rewrites it, and it leaves it alone for
            # commits it does not release (chore, test, docs). Such a commit can still change migrations,
            # so the open release PR is looked up here and its deploy request recut on every push.
            open_pr="$(gh pr list --repo "${{ github.repository }}" --state open --label "autorelease: pending" \
              --json number,headRefName --jq 'first // empty')"
            if [ -n "$open_pr" ]; then
              echo "pr_number=$(echo "$open_pr" | jq -r '.number')" >> "$GITHUB_OUTPUT"
              echo "pr_head_ref=$(echo "$open_pr" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
            fi
          fi

  prepare-migrations:
    name: Prepare Database Migrations
    needs: release-please
    if: |
      needs.release-please.outputs.release_created != 'true' &&
      needs.release-please.outputs.pr_number != ''
    runs-on: ubuntu-latest
    # Holds a PlanetScale token scoped to dev branches and opening deploy requests — deliberately not
    # one that can deploy them. This job runs on every push to main while a release PR is open, so it
    # is the more exposed of the two; a stolen token here can open a deploy request for review but
    # cannot put anything on prod.
    environment: database-preparation
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version being released
        id: version
        env:
          PR_HEAD_REF: ${{ needs.release-please.outputs.pr_head_ref }}
        run: |
          set -euo pipefail
          # The version lives on the release PR's head — that commit is release-please bumping the
          # manifest. main does not carry it until the PR merges.
          git fetch --depth=1 origin "$PR_HEAD_REF"
          version="$(git show "FETCH_HEAD:.release-please-manifest.json" | jq -r '.["."]')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not read the release version from .release-please-manifest.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing schema for release $version"

      - name: Install goose, pscale and the MySQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

          mkdir -p /usr/local/bin/ci-tools

          GOOSE_V=$(awk '/goose/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)
          curl -sSL "https://github.com/pressly/goose/releases/download/v${GOOSE_V}/goose_linux_x86_64" -o /usr/local/bin/ci-tools/goose
          chmod +x /usr/local/bin/ci-tools/goose

          PSCALE_V=$(awk '/planetscale/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)
          curl -sSL "https://github.com/planetscale/cli/releases/download/v${PSCALE_V}/pscale_${PSCALE_V}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin/ci-tools pscale
          chmod +x /usr/local/bin/ci-tools/pscale

          echo "/usr/local/bin/ci-tools" >> "$GITHUB_PATH"

      # schemasplit splits a release that changes more tables than one deploy request allows.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Build schemasplit
        run: |
          set -euo pipefail
          cd tools && go build -o /usr/local/bin/ci-tools/schemasplit ./schemasplit

      - name: Cut branch, apply migrations, open deploy request(s)
        id: planetscale
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BASE_REF: ${{ github.sha }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        run: ./scripts/planetscale-release-branch.sh

      # The MySQL schema half gets a reviewable deploy request; the Postgres schema and both sets of
      # backfills do not, so the manifest is their review surface.
      - name: Build the migration manifest
        id: manifest
        env:
          BASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/release-migration-manifest.sh > /tmp/migration-manifest.md
          if grep -q '^No database migrations' /tmp/migration-manifest.md; then
            echo "has_any=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_any=true" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/migration-manifest.md

      - name: Comment the migration plan on the release PR
        if: steps.manifest.outputs.has_any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.release-please.outputs.pr_number }}
          DR_URL: ${{ steps.planetscale.outputs.deploy_request_url }}
          DR_NUMBER: ${{ steps.planetscale.outputs.deploy_request }}
          DR_COUNT: ${{ steps.planetscale.outputs.deploy_request_count }}
          DR_LIST: ${{ steps.planetscale.outputs.deploy_requests_md }}
          BRANCH: ${{ steps.planetscale.outputs.branch }}
          HAS_DR: ${{ steps.planetscale.outputs.has_migrations }}
        run: |
          set -euo pipefail
          {
            echo "### Database changes in this release"
            echo
            cat /tmp/migration-manifest.md
            if [ "${HAS_DR:-false}" = "true" ] && [ "${DR_COUNT:-1}" -gt 1 ]; then
              echo "This release changes more tables than one deploy request allows, so the schema is split into ${DR_COUNT} deploy requests. They deploy in this order — review each diff there:"
              echo
              echo "${DR_LIST}"
            elif [ "${HAS_DR:-false}" = "true" ]; then
              echo "Schema deploy request: [#${DR_NUMBER}](${DR_URL}) on PlanetScale branch \`${BRANCH}\` — review the diff there."
              echo
            fi
            echo "Merging deploys all of the above to production before any service image rolls."
            echo "If any of it fails, the rollout is skipped."
          } > /tmp/pr-comment.md

          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file /tmp/pr-comment.md

      - name: Summary
        if: always()
        run: |
          if [ -f /tmp/migration-manifest.md ]; then
            cat /tmp/migration-manifest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Migration manifest was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  detect-changes:
    name: Detect Release Changes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.detect.outputs.previous_tag }}
      current_ref: ${{ steps.detect.outputs.current_ref }}
      services_json: ${{ steps.detect.outputs.services_json }}
      services_csv: ${{ steps.detect.outputs.services_csv }}
      matrix_json: ${{ steps.detect.outputs.matrix_json }}
      has_services: ${{ steps.detect.outputs.has_services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect release changes since last release
        id: detect
        run: go run ./cmd/detect-release-changes --current-tag "${{ needs.release-please.outputs.tag_name }}" ${{ inputs.all_services && '--all-services' || '' }}

      - name: Summarize release selection
        run: |
          PREVIOUS_TAG="${{ steps.detect.outputs.previous_tag }}"
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="(none)"
          fi

          {
            echo "## Release selection"
            echo ""
            echo "- Previous tag: ${PREVIOUS_TAG}"
            echo "- Current ref: ${{ steps.detect.outputs.current_ref }}"
            echo "- Services: ${{ steps.detect.outputs.services_json }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-push:
    name: Build and Push
    needs: [release-please, detect-changes]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      needs.detect-changes.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix_json) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_ref }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_PUSH }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The nodes are Graviton (arm64). Go cross-compiles natively; QEMU only runs the final stage's
      # small RUN steps for arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/production/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:${{ needs.release-please.outputs.tag_name }}
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-migrations:
    name: Deploy Migrations
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Holds the token that can actually deploy a deploy request and run DDL/DML on prod. Kept separate
    # from `production` so it does not also carry CROSS_REPO_PAT, and from the preparation environment
    # so a compromise of the more frequently-run job cannot reach prod.
    environment: database-production
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_ref }}
          # Full history and tags so the change detection below can diff this release against the
          # previous tag.
          fetch-depth: 0

      # Which databases this release actually touches. Each deploy step is gated on its own flag, so a
      # release with no migrations — the common case — never opens a connection to PlanetScale. This is
      # computed here in the workflow rather than in the scripts on purpose: a manual resume of an
      # already-tagged release runs this file from the default branch while the job checks out the tag,
      # and only a workflow-level gate is guaranteed to be the fixed one.
      - name: Detect database changes in this release
        id: changes
        env:
          CURRENT_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v*' --sort=-v:refname --merged HEAD | grep -vxF "$CURRENT_TAG" | head -1 || true)"
          if [ -n "$previous_tag" ]; then
            echo "Comparing migrations against previous release tag: $previous_tag"
          else
            echo "No previous release tag; treating every migration as new."
          fi

          changed_in() {
            local dir="$1" files
            if [ -n "$previous_tag" ]; then
              files="$(git diff --name-only "$previous_tag" HEAD -- "$dir" 2>/dev/null || true)"
            else
              files="$(git ls-tree -r --name-only HEAD -- "$dir" 2>/dev/null || true)"
            fi
            if echo "$files" | grep -q '\.sql$'; then echo true; else echo false; fi
          }

          {
            echo "core_schema=$(changed_in shared/db/migrations)"
            echo "core_data=$(changed_in shared/db/data-migrations)"
            echo "agent_schema=$(changed_in services/agent-service/db/migrations)"
            echo "agent_data=$(changed_in services/agent-service/db/data-migrations)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Install goose, pscale and the MySQL client
        if: |
          steps.changes.outputs.core_schema == 'true' ||
          steps.changes.outputs.core_data == 'true' ||
          steps.changes.outputs.agent_schema == 'true' ||
          steps.changes.outputs.agent_data == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

          mkdir -p /usr/local/bin/ci-tools

          GOOSE_V=$(awk '/goose/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)
          curl -sSL "https://github.com/pressly/goose/releases/download/v${GOOSE_V}/goose_linux_x86_64" -o /usr/local/bin/ci-tools/goose
          chmod +x /usr/local/bin/ci-tools/goose

          PSCALE_V=$(awk '/planetscale/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)
          curl -sSL "https://github.com/planetscale/cli/releases/download/v${PSCALE_V}/pscale_${PSCALE_V}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin/ci-tools pscale
          chmod +x /usr/local/bin/ci-tools/pscale

          echo "/usr/local/bin/ci-tools" >> "$GITHUB_PATH"

      # The four steps below are ordered, and the order is the point: schema first so the new code
      # never meets a column that does not exist, then backfills so it never meets an empty one. Each
      # step failing fails the job, and `deploy` requires this job to succeed.

      # 1. MySQL schema — deploys the request(s) the release PR opened and reviewed, one at a time.
      - name: Deploy the core schema to prod (MySQL)
        if: steps.changes.outputs.core_schema == 'true'
        run: ./scripts/planetscale-deploy-release.sh
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.tag_name }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}

      # 2. Postgres schema — applied directly. Postgres has no deploy requests; PlanetScale's guidance
      # is that Postgres branches apply DDL directly, and the branch has safe migrations off.
      - name: Deploy the agent-service schema to prod (Postgres)
        if: steps.changes.outputs.agent_schema == 'true'
        run: ./scripts/planetscale-postgres-migrate.sh
        env:
          MIGRATIONS: schema
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}

      # 3 & 4. Backfills, once both schemas are live and before any image rolls.
      - name: Run core data migrations (MySQL)
        if: steps.changes.outputs.core_data == 'true'
        run: ./scripts/planetscale-data-migrations.sh
        env:
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}

      - name: Run agent-service data migrations (Postgres)
        if: steps.changes.outputs.agent_data == 'true'
        run: ./scripts/planetscale-postgres-migrate.sh
        env:
          MIGRATIONS: data
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}

  deploy:
    name: Deploy to EKS
    needs: [release-please, detect-changes, build-push, deploy-migrations]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.detect-changes.result == 'success' &&
      needs.deploy-migrations.result == 'success' &&
      (needs.build-push.result == 'success' || needs.build-push.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_ref }}

      - name: Deploy via open-mrp/infra
        run: ./scripts/dispatch-infra-deploy.sh
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ needs.release-please.outputs.tag_name }}
          DEPLOY_SERVICES: ${{ needs.detect-changes.outputs.services_csv }}

  dispatch-publish:
    name: Dispatch Post-Deploy Publishing
    needs: [release-please, deploy]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release-publish.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run release-publish.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f tag_name="$TAG_NAME"
