<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow-up Ready for Review</title>
</head>
<body style="margin: 0; padding: 0; width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <table role="presentation" cellPadding="0" cellSpacing="0" width="100%" bgcolor="#F4F5F7" style="width: 100%; background-color: #F4F5F7; padding-top: 24px; padding-bottom: 24px;">
        <tbody>
            <tr>
                <td>
                    <table role="presentation" cellPadding="0" cellSpacing="0" style="width: 100%; max-width: 600px; margin-left: auto; margin-right: auto; background-color: #FFFFFF; border-radius: 12px; border: 1px solid #E5E7EB; border-top: 4px solid #2563EB;" width="100%" bgcolor="#FFFFFF">
                        <tbody>
                            <tr>
                                <td style="background-color: #FFFFFF; padding: 24px;">
                                    <h1 style="margin: 0 0 16px; font-size: 22px; line-height: 28px; font-weight: 700; color: #0F172A;">Follow-up ready for review</h1>
                                    {{template "account_followup_context" .}}
                                    <h2 style="margin: 24px 0 8px; font-size: 16px; color: #0F172A;">Draft</h2>
                                    <div style="border: 1px solid #E5E7EB; border-radius: 8px; padding: 16px; background-color: #F8FAFC;">
                                        <p style="margin: 0 0 12px; font-size: 14px; color: #0F172A;"><strong>Subject:</strong> {{.DraftSubject}}</p>
                                        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #0F172A; white-space: pre-wrap;">{{.DraftBody}}</p>
                                    </div>
                                    <p style="margin: 24px 0 8px; text-align: center;">
                                        <a href="{{.ReviewURL}}" style="display: inline-block; padding: 12px 24px; background-color: #2563EB; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 8px;">Review, edit &amp; send</a>
                                    </p>
                                    <p style="margin: 0; font-size: 12px; color: #6B7280; text-align: center;">Nothing is sent until you approve. The link expires {{.ExpiresAt}}.</p>
                                </td>
                            </tr>
                            <tr>
                                <td style="height: 1px; background-color: #E5E7EB;"></td>
                            </tr>
                            <tr>
                                <td style="background-color: #FFFFFF; padding: 16px; text-align: center; font-size: 12px; color: #9CA3AF;">
                                    This is an internal notification from OpenMRP.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
