name: Post-Merge Validation

on:
  workflow_dispatch:
    inputs:
      run_gosec:
        description: Run gosec full scan
        type: boolean
        default: true
      run_smoke:
        description: Run SQL prepare smoke tests
        type: boolean
        default: true
      run_e2e:
        description: Run E2E tests
        type: boolean
        default: true
      e2e_full_suite:
        description: Run full E2E suite (vs. tests selected from diff vs. main)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gosec-full:
    name: Gosec (Full Scan)
    if: inputs.run_gosec
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache gosec
        uses: actions/cache@v6
        id: cache-gosec
        with:
          path: ~/go/bin/gosec
          key: ${{ runner.os }}-gosec-${{ hashFiles('tools/tool-versions') }}

      - name: Install gosec
        if: steps.cache-gosec.outputs.cache-hit != 'true'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v$(awk '/gosec/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)

      - name: Run gosec (all rules)
        run: |
          gosec -exclude-generated \
            -exclude-dir=sqlc -exclude-dir=proto -exclude-dir=tools \
            -concurrency=$(nproc) \
            ./...

  smoke-test:
    name: SQL Prepare Smoke Tests
    if: inputs.run_smoke
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: "Testing123!"
          MYSQL_DATABASE: openmrp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pTesting123!"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openmrp_agents
          POSTGRES_USER: openmrp
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openmrp -d openmrp_agents"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache test tools
        uses: actions/cache@v6
        id: cache-test-tools
        with:
          path: /usr/local/bin/ci-tools
          key: ${{ runner.os }}-test-tools-${{ hashFiles('tools/tool-versions') }}

      - name: Install test tools
        if: steps.cache-test-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p /usr/local/bin/ci-tools
          SQLC_V=$(awk '/sqlc/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)
          curl -sSL "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_V}/sqlc_${SQLC_V}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin/ci-tools sqlc
          GOOSE_V=$(awk '/goose/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)
          curl -sSL "https://github.com/pressly/goose/releases/download/v${GOOSE_V}/goose_linux_x86_64" -o /usr/local/bin/ci-tools/goose
          chmod +x /usr/local/bin/ci-tools/goose

      - name: Add tools to PATH
        run: echo "/usr/local/bin/ci-tools" >> $GITHUB_PATH

      - name: Generate sqlc
        run: make sqlc

      - name: Apply MySQL migrations
        run: |
          GOOSE_DRIVER=mysql \
          GOOSE_DBSTRING="root:Testing123!@tcp(localhost:3306)/openmrp?parseTime=true" \
            goose -dir shared/db/migrations up

      - name: Apply PostgreSQL migrations
        run: |
          GOOSE_DRIVER=postgres \
          GOOSE_DBSTRING="postgres://openmrp@localhost:5432/openmrp_agents?sslmode=disable" \
            goose -dir services/agent-service/db/migrations up

      - name: Run SQL Prepare Smoke Tests
        run: make test-sql-prepare-smoke
        env:
          DB_URL: "root:Testing123!@tcp(localhost:3306)/openmrp?parseTime=true"
          AGENT_DB_URL: "postgres://openmrp@localhost:5432/openmrp_agents?sslmode=disable"

      # These hold locks and assert on performance_schema.data_locks, so two of them at once would see
      # each other's waits. make test-ledger runs -p 1 -parallel 1, which is a correctness requirement
      # rather than a tuning choice, and is why they cannot live in `make test` alongside everything
      # else.
      #
      # Schema only, no data migrations: the inventory_item_lock backfill is a warm-up rather than a
      # correctness requirement (the acquisition creates the row on first use), `item` is empty here so
      # it would insert nothing, and running it needs scripts/migrate.sh to seed goose's own
      # bookkeeping row first — a failure mode for no benefit. The tests seed the lock rows they need.
      #
      # Until this existed, nothing in this repository could run two allocation transactions against a
      # real database, and three inventory locking fixes in a row shipped incomplete because every
      # claim about lock order was an argument from InnoDB semantics rather than a measurement.
      - name: Run inventory ledger concurrency tests
        run: make test-ledger
        env:
          LEDGER_TEST_DSN: "root:Testing123!@tcp(127.0.0.1:3306)/openmrp?parseTime=true&loc=UTC&interpolateParams=false"

  e2e:
    name: E2E
    if: inputs.run_e2e
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Modules
        run: |
          go mod tidy
          cd tools && go mod tidy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build E2E images with cache
        run: |
          pids=()
          for svc in platform-service core-service notification-service auth-service billing-service agent-service api-gateway; do
            (
              echo "Building $svc..."
              docker buildx build \
                --build-arg SERVICE_NAME=$svc \
                --cache-from type=gha,scope=e2e-$svc \
                --cache-to type=gha,scope=e2e-$svc,mode=max \
                --load \
                -t openmrp-e2e-$svc \
                -f infra/production/docker/Dockerfile .
              echo "$svc done."
            ) &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -eq 1 ]; then
            echo "One or more image builds failed."
            exit 1
          fi

      - name: Start E2E stack
        run: make e2e-up-ci

      - name: Cache e2e tools
        uses: actions/cache@v6
        id: cache-e2e-tools
        with:
          path: /usr/local/bin/ci-tools
          key: ${{ runner.os }}-e2e-tools-${{ hashFiles('tools/tool-versions') }}

      - name: Install e2e tools
        if: steps.cache-e2e-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p /usr/local/bin/ci-tools
          GOTESTSUM_V=$(awk '/gotestsum/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)
          curl -sSL "https://github.com/gotestyourself/gotestsum/releases/download/v${GOTESTSUM_V}/gotestsum_${GOTESTSUM_V}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin/ci-tools gotestsum

      - name: Add tools to PATH
        run: echo "/usr/local/bin/ci-tools" >> $GITHUB_PATH

      - name: Select E2E tests
        id: e2e_select
        run: |
          if [[ "${{ inputs.e2e_full_suite }}" == "true" ]]; then
            echo "run_regex=.*" >> "$GITHUB_OUTPUT"
          else
            RUN_REGEX=$(./scripts/select-e2e-tests.sh origin/main HEAD)
            echo "run_regex=${RUN_REGEX}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E tests
        run: ./scripts/run-e2e-tests.sh 300s "${{ steps.e2e_select.outputs.run_regex }}"

      - name: Tear down E2E stack
        if: always()
        run: make e2e-down
