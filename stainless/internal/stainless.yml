edition: "2026-02-23"
organization:
  name: augno
  contact: support@augno.com
targets:
  typescript:
    edition: typescript.2025-10-10
    package_name: "@augno/internal-sdk"
    staging_repo: augno/internal-sdk
    production_repo: augno/internal-sdk
    publish:
      npm: true
environments:
  production: https://api.augno.com
  local: http://localhost:8081
client_settings:
  send_openapi_info_version_as_header: Augno-Version
  bearer_token_refresh:
    method: PUT
    path: "/v1/auth/access-tokens"
    credentials: include
    retry_signal_header: X-Retry
    skip_request_paths:
      - "/v1/auth/access-tokens"
      - "/v1/auth/actions/login"
    expose_on_auth_failure_callback: true
  omit_stainless_headers: true
  opts:
    bearer_token:
      type: string
      nullable: true
      read_env: AUGNO_API_KEY
      auth:
        security_scheme: BearerAuth
        role: value
      description: "API key sent as a Bearer token. Omit for cookie-based user sessions (dashboard)."
    augno_account_id:
      type: string
      nullable: true
      description: "Current account UUID (Augno-Account). Update when switching accounts."
      send_in_header: Augno-Account
readme:
  include_stainless_attribution: false
  example_requests:
    default:
      type: request
      endpoint: get /healthz
      params: {}
    headline:
      type: request
      endpoint: get /healthz
      params: {}
resources:
  healthz:
    methods:
      list: get /healthz
    models:
      healthcheck: '#/components/schemas/Healthcheck'
  auth:
    methods:
      users: post /v1/auth/users
      update_access_tokens: put /v1/auth/access-tokens
      delete_refresh_tokens: delete /v1/auth/refresh-tokens
      scanner_passwords: post /v1/auth/scanner-passwords
    subresources:
      actions:
        methods:
          login: post /v1/auth/actions/login
          magic_login: post /v1/auth/actions/magic-login
        models:
          login_request: '#/components/schemas/LoginRequest'
          magic_login_request: '#/components/schemas/MagicLoginRequest'
          user: '#/components/schemas/User'
      passwords:
        methods:
          create: post /v1/auth/passwords
        subresources:
          actions:
            methods:
              request_reset: post /v1/auth/passwords/actions/request-reset
              reset: post /v1/auth/passwords/actions/reset
            models:
              request_password_reset_request: '#/components/schemas/RequestPasswordResetRequest'
              reset_password_request: '#/components/schemas/ResetPasswordRequest'
        models:
          update_password_request: '#/components/schemas/UpdatePasswordRequest'
      api_keys:
        methods:
          retrieve: get /v1/auth/api-keys/{id}
          list: get /v1/auth/api-keys
          create: post /v1/auth/api-keys
          delete: delete /v1/auth/api-keys/{id}
        subresources:
          actions:
            methods:
              rotate: post /v1/auth/api-keys/{id}/actions/rotate
              fetch_doc_api_key: post /v1/auth/api-keys/actions/fetch-doc-api-key
            models:
              account: '#/components/schemas/Account'
              account_branding: '#/components/schemas/AccountBranding'
              account_portal: '#/components/schemas/AccountPortal'
              address: '#/components/schemas/Address'
              api_key: '#/components/schemas/APIKey'
              created_api_key: '#/components/schemas/CreatedAPIKey'
              geolocation: '#/components/schemas/Geolocation'
              owner: '#/components/schemas/Owner'
              role: '#/components/schemas/Role'
              rotate_api_key_request: '#/components/schemas/RotateAPIKeyRequest'
        models:
          account: '#/components/schemas/Account'
          account_branding: '#/components/schemas/AccountBranding'
          account_portal: '#/components/schemas/AccountPortal'
          address: '#/components/schemas/Address'
          api_key: '#/components/schemas/APIKey'
          create_api_key_request: '#/components/schemas/CreateAPIKeyRequest'
          created_api_key: '#/components/schemas/CreatedAPIKey'
