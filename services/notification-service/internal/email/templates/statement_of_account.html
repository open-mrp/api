<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statement of Account</title>
</head>
<body style="margin: 0; padding: 24px 12px; background-color: #f5f6f8; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1a2233;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 640px; margin: 0 auto;">
        <tr><td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border: 1px solid #e6e8eb; border-radius: 10px;">
                <tr><td style="padding: 32px;">

                    {{template "merchant_logo" .}}

                    <h1 style="margin: 0 0 12px; text-align: center; font-size: 1.7rem; font-weight: 700; letter-spacing: 0.06em; color: #1a2233;">Statement of Account</h1>
                    <p style="margin: 0 auto 8px; max-width: 460px; text-align: center; font-size: 1rem; font-weight: 500; line-height: 1.6; color: #6b7280;">
                        {{.body}}
                    </p>
                    <p style="margin: 0 auto 28px; max-width: 460px; text-align: center; font-size: 0.85rem; line-height: 1.6; color: #8a94a6;">
                        The statement is attached as a spreadsheet.
                    </p>

                    <hr style="border: none; border-top: 1px solid #eef1f5; margin: 0 0 20px;">

                    <p style="margin: 0; font-size: 0.85rem; line-height: 1.6; color: #6b7280;">If any line on the statement looks wrong, reply to this email and we will look into it.</p>

                </td></tr>
            </table>

            {{template "merchant_footer" .}}
        </td></tr>
    </table>
</body>
</html>
