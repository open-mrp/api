version: "2"
sql:
  - schema: "../../shared/db/migrations"
    queries: "internal/infrastructure/queries"
    engine: "mysql"
    gen:
      go:
        out: "internal/infrastructure/sqlc"
        package: "sqlc"
        emit_prepared_queries: false
        overrides:
          - column: "service_idempotency_key.response_body"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true

