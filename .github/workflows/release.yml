name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  terraform-changes:
    name: Detect Terraform Changes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect terraform changes since last release
        id: detect
        run: ./scripts/terraform-release-changed.sh "${{ needs.release-please.outputs.tag_name }}"

  terraform:
    name: Terraform Apply
    needs: [release-please, terraform-changes]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      needs.terraform-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/production/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Cache Terraform Providers
        uses: actions/cache@v5
        with:
          path: |
            .terraform/providers
            .terraform.lock.hcl
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  build-push:
    name: Build and Push
    needs: [release-please, terraform-changes, terraform]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            api-gateway,
            auth-service,
            core-service,
            platform-service,
            notification-service,
            billing-service,
            agent-service,
          ]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/production/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:${{ needs.release-please.outputs.tag_name }}
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: [release-please, terraform-changes, terraform, build-push]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Deploy to EKS
        run: ./scripts/deploy.sh
        env:
          AWS_REGION: "us-east-2"
          CLUSTER_NAME: "augno-prod"
          IMAGE_TAG: ${{ needs.release-please.outputs.tag_name }}

  publish-openapi-specs:
    name: Publish OpenAPI Specs
    needs: [release-please, deploy]
    if: needs.release-please.outputs.release_created == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Read API Version
        id: api-version
        run: |
          API_VERSION=$(go run ./cmd/print-version)
          echo "api_version=$API_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Modules
        run: |
          go mod tidy
          cd tools && go mod tidy

      - name: Snapshot OpenAPI specs on S3 (SDK baseline)
        run: |
          mkdir -p specs/.sdk-baseline
          aws s3 cp s3://augno-public-openapi-specs/openapi.json specs/.sdk-baseline/public_openapi_spec.json 2>/dev/null || true
          aws s3 cp s3://augno-private-openapi-specs/openapi.json specs/.sdk-baseline/internal_openapi_spec.json 2>/dev/null || true

      - name: Generate OpenAPI Specs
        run: make openapi

      - name: Upload Public Spec to S3
        run: |
          aws s3 cp specs/public_openapi_spec.json s3://augno-public-openapi-specs/openapi.json
          aws s3 cp specs/public_openapi_spec.json s3://augno-public-openapi-specs/${{ steps.api-version.outputs.api_version }}.json

      - name: Upload Private Spec to S3
        run: |
          aws s3 cp specs/internal_openapi_spec.json s3://augno-private-openapi-specs/openapi.json
          aws s3 cp specs/internal_openapi_spec.json s3://augno-private-openapi-specs/${{ steps.api-version.outputs.api_version }}.json

      - name: Upload OpenAPI specs for SDK generation
        uses: actions/upload-artifact@v4
        with:
          name: release-openapi-specs
          path: specs
          if-no-files-found: error

  generate-sdks:
    name: Generate SDKs with stlc
    needs: [release-please, deploy, publish-openapi-specs]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success' &&
      needs.publish-openapi-specs.result == 'success'
    uses: ./.github/workflows/stlc-generate-reusable.yml
    with:
      api_version: ${{ needs.release-please.outputs.tag_name }}
      sdk_branch: bot/sdk-sync-${{ needs.release-please.outputs.tag_name }}
      openapi_specs_artifact: release-openapi-specs
      open_pr: true
      pr_base_branch: main
    secrets:
      STLC_READ_TOKEN: ${{ secrets.STLC_READ_TOKEN }}
      SDK_WRITE_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}

  notify-consumers:
    name: Notify ${{ matrix.consumer }}
    # Runs in parallel with generate-sdks; consumers sync from deployed API / S3 specs, not from SDK PRs.
    needs: [release-please, deploy, publish-openapi-specs]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success' &&
      needs.publish-openapi-specs.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - Augno/public-docs
          - Augno/openapi-spec
          - Augno/dashboard
    steps:
      - name: Dispatch api-release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: ${{ matrix.consumer }}
          event-type: api-release
          client-payload: '{"api_version": "${{ needs.release-please.outputs.tag_name }}"}'
