# https://buf.build/docs/lint/overview
# Run `buf lint` from the api/ directory (see ../buf.work.yaml). Do not lint only `proto/` without the workspace.
version: v1
lint:
  use:
    - STANDARD
  except:
    # Stable gRPC paths (/core.CoreService/...) — versioning deferred.
    - PACKAGE_VERSION_SUFFIX
    # CoreService re-exports shard protos via `import public` so satellites can `import "core/core.proto"` only.
    - IMPORT_NO_PUBLIC
    # Existing RPC/message names; aligning with buf would be a breaking API change.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    # platform.proto idempotency enum uses short value names by design.
    - ENUM_VALUE_PREFIX
