syntax = "proto3";

// Package core defines the gRPC contract for the core-service. It manages
// accounts, account-user relationships, roles, permissions, and cross-account
// business relationships (customer/supplier). The auth-service and api-gateway
// call these RPCs during credential validation to resolve the caller's
// authorization context.
package core;

import "google/protobuf/empty.proto";
import public "core/core_patch.proto";
import public "core/core_identity_context.proto";
import public "core/core_analytics.proto";
import public "core/core_account_groups.proto";
import public "core/core_accounts_carriers.proto";
import public "core/core_portal.proto";
import public "core/core_items.proto";
import public "core/core_consumption.proto";
import public "core/core_users_territories.proto";
import public "core/core_invoices.proto";
import public "core/core_lookups.proto";

option go_package = "shared/proto/core;core";

service CoreService {
  // Returns account metadata (sandbox status, parent account, mode) for identity resolution.
  rpc GetAccountContext(GetAccountContextRequest) returns (GetAccountContextResponse);

  // Returns accounts by ID for the api-gateway include resolver. Authorization
  // follows the same affiliation check as GetAccount. Internal — not exposed
  // to clients.
  rpc BatchGetAccountsByIDs(BatchGetAccountsByIDsRequest) returns (BatchGetAccountsByIDsResponse);

  // Checks user access to an account and returns their role/permissions.
  rpc GetUserAccountAccess(GetUserAccountAccessRequest) returns (GetUserAccountAccessResponse);

  // Returns the full permission set for a role (used for API key resolution).
  rpc GetRolePermissions(GetRolePermissionsRequest) returns (GetRolePermissionsResponse);

  // Returns a role's name and type code.
  rpc GetRoleInfo(GetRoleInfoRequest) returns (GetRoleInfoResponse);

  // Checks cross-account business relationship (customer/supplier) during credential validation.
  rpc GetAccountRelation(GetAccountRelationRequest) returns (GetAccountRelationResponse);

  // Updates last_used_at on an account-user record after successful auth.
  rpc MarkAccountUserUsed(MarkAccountUserUsedRequest) returns (google.protobuf.Empty);

  // Returns all accounts a user can access, with their role in each.
  rpc ListUserAccountAffiliations(ListUserAccountAffiliationsRequest) returns (ListUserAccountAffiliationsResponse);

  // Returns the sandbox account ID for a given production account.
  rpc GetSandboxAccountByOwner(GetSandboxAccountByOwnerRequest) returns (GetSandboxAccountByOwnerResponse);

  // Returns the admin role ID (used by doc API key flow).
  rpc GetAdminRole(google.protobuf.Empty) returns (GetAdminRoleResponse);

  // Returns a paginated list of sandbox accounts owned by a production account.
  rpc ListSandboxAccounts(ListSandboxAccountsRequest) returns (ListSandboxAccountsResponse);

  // Creates a new sandbox account; enforces per-account sandbox limit.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // Returns a single sandbox account by ID.
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);

  // Deletes a sandbox and purges account-scoped data asynchronously.
  rpc DeleteSandbox(DeleteSandboxRequest) returns (google.protobuf.Empty);

  // Returns sandboxes by ID for the api-gateway include resolver.
  rpc BatchGetSandboxesByIDs(BatchGetSandboxesByIDsRequest) returns (BatchGetSandboxesByIDsResponse);

  // Updates subscription fields (plan, status, Stripe ID, period end) from billing webhooks.
  rpc UpdateAccountSubscription(UpdateAccountSubscriptionRequest) returns (google.protobuf.Empty);

  // Removes all Stripe-related fields from an account.
  rpc ClearAccountStripeCustomer(ClearAccountStripeCustomerRequest) returns (google.protobuf.Empty);

  // Sets or removes the monthly agent LLM spending cap.
  rpc UpdateAgentSpendingCap(UpdateAgentSpendingCapRequest) returns (UpdateAgentSpendingCapResponse);

  // Resolves an account from a Stripe customer ID.
  rpc GetAccountByStripeCustomerID(GetAccountByStripeCustomerIDRequest) returns (GetAccountByStripeCustomerIDResponse);

  // Creates production account, sandbox, roles, permissions, and account-user for a new registration.
  rpc CompleteRegistration(CompleteRegistrationRequest) returns (CompleteRegistrationResponse);

  // Returns a paginated list of units (account-specific and system) with filtering support.
  rpc ListUnits(ListUnitsRequest) returns (ListUnitsResponse);

  // Returns a single unit by ID (account-owned or system).
  rpc GetUnit(GetUnitRequest) returns (GetUnitResponse);

  // Creates a new account-owned unit.
  rpc CreateUnit(CreateUnitRequest) returns (CreateUnitResponse);

  // Partially updates an account-owned unit; system units cannot be updated.
  rpc UpdateUnit(UpdateUnitRequest) returns (UpdateUnitResponse);

  // Deletes an account-owned unit and cascades to unit_group_unit associations.
  rpc DeleteUnit(DeleteUnitRequest) returns (google.protobuf.Empty);

  // Returns units by ID for the api-gateway include resolver.
  rpc BatchGetUnitsByIDs(BatchGetUnitsByIDsRequest) returns (BatchGetUnitsByIDsResponse);

  // Searches sale-type products by SKU pattern (used by agent-service).
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);

  // Returns all sale-type products for an account (used by agent-service).
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);

  // Resolves an email to a customer account_relation (used by agent-service).
  rpc GetCustomerByEmail(GetCustomerByEmailRequest) returns (GetCustomerByEmailResponse);

  // Resolves an email to the contacts (account users) on accounts the caller has a relationship with — its customers, suppliers, or its own account. Owner is taken from the request identity.
  rpc FindContactsByEmail(FindContactsByEmailRequest) returns (FindContactsByEmailResponse);

  // Returns a paginated list of payment terms (account-specific and default).
  rpc ListPaymentTerms(ListPaymentTermsRequest) returns (ListPaymentTermsResponse);

  // Returns a single payment term by ID.
  rpc GetPaymentTerm(GetPaymentTermRequest) returns (GetPaymentTermResponse);

  // Creates a new account-owned payment term.
  rpc CreatePaymentTerm(CreatePaymentTermRequest) returns (CreatePaymentTermResponse);

  // Partially updates an account-owned payment term; default terms cannot be updated.
  rpc UpdatePaymentTerm(UpdatePaymentTermRequest) returns (UpdatePaymentTermResponse);

  // Deletes an account-owned payment term; default terms cannot be deleted.
  rpc DeletePaymentTerm(DeletePaymentTermRequest) returns (google.protobuf.Empty);

  // Returns payment terms by ID for the api-gateway include resolver.
  rpc BatchGetPaymentTermsByIDs(BatchGetPaymentTermsByIDsRequest) returns (BatchGetPaymentTermsByIDsResponse);

  // Returns a paginated list of shipping terms (account-specific and default).
  rpc ListShippingTerms(ListShippingTermsRequest) returns (ListShippingTermsResponse);

  // Returns a single shipping term by ID.
  rpc GetShippingTerm(GetShippingTermRequest) returns (GetShippingTermResponse);

  // Creates a new account-owned shipping term.
  rpc CreateShippingTerm(CreateShippingTermRequest) returns (CreateShippingTermResponse);

  // Partially updates an account-owned shipping term; default terms cannot be updated.
  rpc UpdateShippingTerm(UpdateShippingTermRequest) returns (UpdateShippingTermResponse);

  // Deletes an account-owned shipping term; default terms cannot be deleted.
  rpc DeleteShippingTerm(DeleteShippingTermRequest) returns (google.protobuf.Empty);

  // Returns shipping terms by ID for the api-gateway include resolver.
  rpc BatchGetShippingTermsByIDs(BatchGetShippingTermsByIDsRequest) returns (BatchGetShippingTermsByIDsResponse);

  // Returns a single address by ID within an account.
  rpc GetAddress(GetAddressRequest) returns (GetAddressResponse);

  // Returns a paginated list of addresses for an account.
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);

  // Creates a new address linked to an account.
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);

  // Partially updates an address within an account.
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);

  // Deletes an address from an account.
  rpc DeleteAddress(DeleteAddressRequest) returns (google.protobuf.Empty);

  // Returns addresses by ID for the api-gateway include resolver.
  rpc BatchGetAddressesByIDs(BatchGetAddressesByIDsRequest) returns (BatchGetAddressesByIDsResponse);

  // Returns address autocomplete suggestions from Google Places.
  rpc AutocompleteAddress(AutocompleteAddressRequest) returns (AutocompleteAddressResponse);

  // Returns parsed address components from a Google Places ID.
  rpc GetAddressDetails(GetAddressDetailsRequest) returns (GetAddressDetailsResponse);

  // Validates an address using Google Address Validation API.
  rpc ValidateAddress(ValidateAddressRequest) returns (ValidateAddressResponse);

  // Returns a paginated list of account statuses (global lookup values).
  rpc ListAccountStatuses(ListAccountStatusesRequest) returns (ListAccountStatusesResponse);

  // Returns a single account status by ID.
  rpc GetAccountStatus(GetAccountStatusRequest) returns (GetAccountStatusResponse);

  // Returns account statuses by ID for the api-gateway include resolver.
  rpc BatchGetAccountStatusesByIDs(BatchGetAccountStatusesByIDsRequest) returns (BatchGetAccountStatusesByIDsResponse);

  // Returns a paginated list of account groups with filtering by type and search.
  rpc ListAccountGroups(ListAccountGroupsRequest) returns (ListAccountGroupsResponse);

  // Returns a single account group by ID.
  rpc GetAccountGroup(GetAccountGroupRequest) returns (GetAccountGroupResponse);

  // Creates a new account group.
  rpc CreateAccountGroup(CreateAccountGroupRequest) returns (CreateAccountGroupResponse);

  // Partially updates an account group.
  rpc UpdateAccountGroup(UpdateAccountGroupRequest) returns (UpdateAccountGroupResponse);

  // Deletes an account group.
  rpc DeleteAccountGroup(DeleteAccountGroupRequest) returns (google.protobuf.Empty);

  // Returns account groups by ID for the api-gateway include resolver.
  rpc BatchGetAccountGroupsByIDs(BatchGetAccountGroupsByIDsRequest) returns (BatchGetAccountGroupsByIDsResponse);

  // Returns product line access records grouped by account group.
  rpc ListAccountGroupProductLineAccess(ListAccountGroupProductLineAccessRequest) returns (ListAccountGroupProductLineAccessResponse);

  // Returns the product line access for a single account group.
  rpc GetAccountGroupProductLineAccess(GetAccountGroupProductLineAccessRequest) returns (GetAccountGroupProductLineAccessResponse);

  // Creates product line access for an account group.
  rpc CreateAccountGroupProductLineAccess(CreateAccountGroupProductLineAccessRequest) returns (CreateAccountGroupProductLineAccessResponse);

  // Replaces all product lines for an account group.
  rpc UpdateAccountGroupProductLineAccess(UpdateAccountGroupProductLineAccessRequest) returns (UpdateAccountGroupProductLineAccessResponse);

  // Removes all product line access for an account group.
  rpc DeleteAccountGroupProductLineAccess(DeleteAccountGroupProductLineAccessRequest) returns (google.protobuf.Empty);

  // Returns account-group → product-line access records by account_group_id for the api-gateway include resolver.
  rpc BatchGetAccountGroupProductLineAccessByIDs(BatchGetAccountGroupProductLineAccessByIDsRequest) returns (BatchGetAccountGroupProductLineAccessByIDsResponse);

  // Returns product line access records grouped by customer.
  rpc ListCustomerProductLineAccess(ListCustomerProductLineAccessRequest) returns (ListCustomerProductLineAccessResponse);

  // Returns the product line access for a single customer.
  rpc GetCustomerProductLineAccess(GetCustomerProductLineAccessRequest) returns (GetCustomerProductLineAccessResponse);

  // Creates product line access for a customer.
  rpc CreateCustomerProductLineAccess(CreateCustomerProductLineAccessRequest) returns (CreateCustomerProductLineAccessResponse);

  // Replaces all product lines for a customer.
  rpc UpdateCustomerProductLineAccess(UpdateCustomerProductLineAccessRequest) returns (UpdateCustomerProductLineAccessResponse);

  // Removes all product line access for a customer.
  rpc DeleteCustomerProductLineAccess(DeleteCustomerProductLineAccessRequest) returns (google.protobuf.Empty);

  // Returns customer → product-line access records by customer_id for the api-gateway include resolver.
  rpc BatchGetCustomerProductLineAccessByIDs(BatchGetCustomerProductLineAccessByIDsRequest) returns (BatchGetCustomerProductLineAccessByIDsResponse);

  // Returns a paginated list of account users for the target account.
  rpc ListAccountUsers(ListAccountUsersRequest) returns (ListAccountUsersResponse);

  // Returns a single account user by user ID within the target account.
  rpc GetAccountUser(GetAccountUserRequest) returns (GetAccountUserResponse);

  // Creates a new account user.
  rpc CreateAccountUser(CreateAccountUserRequest) returns (CreateAccountUserResponse);

  // Partially updates an account user.
  rpc UpdateAccountUser(UpdateAccountUserRequest) returns (UpdateAccountUserResponse);

  // Transitions an account user to the target status (active, disabled, or removed).
  rpc UpdateAccountUserStatus(UpdateAccountUserStatusRequest) returns (google.protobuf.Empty);

  // Updates the password for an account user (scanner-role targets only).
  rpc UpdateAccountUserPassword(UpdateAccountUserPasswordRequest) returns (google.protobuf.Empty);

  // Batched read for the api-gateway resourcekit resolver.
  rpc BatchGetAccountUsersByIDs(BatchGetAccountUsersByIDsRequest) returns (BatchGetAccountUsersByIDsResponse);

  // Returns a paginated list of sales targets for an account user.
  rpc ListSalesTargets(ListSalesTargetsRequest) returns (ListSalesTargetsResponse);

  // Creates a new sales target for an account user.
  rpc CreateSalesTarget(CreateSalesTargetRequest) returns (CreateSalesTargetResponse);

  // Creates or updates a sales target by ID.
  rpc UpsertSalesTarget(UpsertSalesTargetRequest) returns (UpsertSalesTargetResponse);

  // Returns a paginated list of account prices with search and filtering support.
  rpc ListAccountPrices(ListAccountPricesRequest) returns (ListAccountPricesResponse);

  // Returns a single account price by ID.
  rpc GetAccountPrice(GetAccountPriceRequest) returns (GetAccountPriceResponse);

  // Creates a new account price with rate, category, and attribute associations.
  rpc CreateAccountPrice(CreateAccountPriceRequest) returns (CreateAccountPriceResponse);

  // Partially updates an account price; categories/attributes are replaced entirely if provided.
  rpc UpdateAccountPrice(UpdateAccountPriceRequest) returns (UpdateAccountPriceResponse);

  // Deletes an account price and its associated rate, categories, and attributes.
  rpc DeleteAccountPrice(DeleteAccountPriceRequest) returns (google.protobuf.Empty);

  // Returns a paginated list of account integrations (credentials excluded).
  rpc ListAccountIntegrations(ListAccountIntegrationsRequest) returns (ListAccountIntegrationsResponse);

  // Creates or upserts an integration; updates existing if same code exists.
  rpc CreateAccountIntegration(CreateAccountIntegrationRequest) returns (CreateAccountIntegrationResponse);

  // Updates name and/or is_active on an integration; credentials cannot be changed.
  rpc UpdateAccountIntegration(UpdateAccountIntegrationRequest) returns (UpdateAccountIntegrationResponse);

  // Deletes an account integration and returns the deleted resource.
  rpc DeleteAccountIntegration(DeleteAccountIntegrationRequest) returns (DeleteAccountIntegrationResponse);

  // Returns account integrations by ID for the api-gateway include resolver.
  rpc BatchGetAccountIntegrationsByIDs(BatchGetAccountIntegrationsByIDsRequest) returns (BatchGetAccountIntegrationsByIDsResponse);

  // Returns the Stripe publishable key for the caller's account.
  rpc GetStripePublishableKey(GetStripePublishableKeyRequest) returns (GetStripePublishableKeyResponse);

  // Returns whether the caller's account has a Stripe integration configured.
  rpc GetStripeStatus(GetStripeStatusRequest) returns (GetStripeStatusResponse);

  // Returns a paginated list of adjustment types.
  rpc ListAdjustmentTypes(ListAdjustmentTypesRequest) returns (ListAdjustmentTypesResponse);

  // Returns adjustment types matching the given IDs.
  rpc BatchGetAdjustmentTypesByIDs(BatchGetAdjustmentTypesByIDsRequest) returns (BatchGetAdjustmentTypesByIDsResponse);

  // Returns full account details including branding and portal sub-resources.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);

  // Returns a public account by its portal slug (unauthenticated).
  rpc GetAccountBySlug(GetAccountBySlugRequest) returns (GetAccountBySlugResponse);

  // Returns the authenticated seller portal profile (identity + letterhead address) by portal slug.
  rpc GetPortalProfileBySlug(GetPortalProfileBySlugRequest) returns (GetPortalProfileBySlugResponse);

  // Buyer customer-portal registration sessions.
  rpc CreateOrResumePortalRegistrationSession(CreateOrResumePortalRegistrationSessionRequest) returns (PortalRegistrationSessionResponse);
  rpc GetPortalRegistrationSession(GetPortalRegistrationSessionRequest) returns (PortalRegistrationSessionResponse);
  rpc UpdatePortalRegistrationSession(UpdatePortalRegistrationSessionRequest) returns (PortalRegistrationSessionResponse);
  rpc CompletePortalRegistrationSession(CompletePortalRegistrationSessionRequest) returns (PortalRegistrationSessionResponse);
  rpc AbandonPortalRegistrationSession(AbandonPortalRegistrationSessionRequest) returns (PortalRegistrationSessionResponse);

  // Partially updates an account's name, branding, and portal fields.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);

  // Uploads a logo image for an account to S3.
  rpc UploadAccountPhoto(UploadAccountPhotoRequest) returns (UploadAccountPhotoResponse);

  // Returns a presigned S3 URL for the account's logo.
  rpc GetAccountLogoURL(GetAccountLogoURLRequest) returns (GetAccountLogoURLResponse);

  // Returns a paginated list of properties for the caller's account.
  rpc ListProperties(ListPropertiesRequest) returns (ListPropertiesResponse);

  // Returns a single property by ID.
  rpc GetProperty(GetPropertyRequest) returns (GetPropertyResponse);

  // Creates a new property.
  rpc CreateProperty(CreatePropertyRequest) returns (CreatePropertyResponse);

  // Partially updates a property.
  rpc UpdateProperty(UpdatePropertyRequest) returns (UpdatePropertyResponse);

  // Deletes a property and cascades to its attributes.
  rpc DeleteProperty(DeletePropertyRequest) returns (google.protobuf.Empty);

  // Returns a paginated list of attributes for a property.
  rpc ListAttributes(ListAttributesRequest) returns (ListAttributesResponse);

  // Returns a single attribute by ID.
  rpc GetAttribute(GetAttributeRequest) returns (GetAttributeResponse);

  // Creates a new attribute under a property.
  rpc CreateAttribute(CreateAttributeRequest) returns (CreateAttributeResponse);

  // Partially updates an attribute.
  rpc UpdateAttribute(UpdateAttributeRequest) returns (UpdateAttributeResponse);

  // Deletes an attribute.
  rpc DeleteAttribute(DeleteAttributeRequest) returns (google.protobuf.Empty);

  // Returns attributes by ID for the api-gateway include resolver. Authorization
  // follows the same account scope as GetAttribute. Internal — not exposed to clients.
  rpc BatchGetAttributesByIDs(BatchGetAttributesByIDsRequest) returns (BatchGetAttributesByIDsResponse);

  // Returns properties by ID for the api-gateway include resolver. Always
  // populates attributes on each property. Internal — not exposed to clients.
  rpc BatchGetPropertiesByIDs(BatchGetPropertiesByIDsRequest) returns (BatchGetPropertiesByIDsResponse);

  // Returns item categories by ID for the api-gateway include resolver. Always
  // populates properties and unit group (with base unit and associated units).
  // Internal — not exposed to clients.
  rpc BatchGetItemCategoriesByIDs(BatchGetItemCategoriesByIDsRequest) returns (BatchGetItemCategoriesByIDsResponse);

  // Returns items by ID for the api-gateway include resolver. Always
  // populates rates and attributes. Internal — not exposed to clients.
  rpc BatchGetItemsByIDs(BatchGetItemsByIDsRequest) returns (BatchGetItemsByIDsResponse);

  // Returns a paginated list of carriers visible to the caller's account.
  rpc ListCarriers(ListCarriersRequest) returns (ListCarriersResponse);

  // Returns a single carrier by ID.
  rpc GetCarrier(GetCarrierRequest) returns (GetCarrierResponse);

  // Returns carriers by ID for the api-gateway include resolver. Authorization
  // follows the same account scope as GetCarrier. Internal — not exposed to clients.
  rpc BatchGetCarriersByIDs(BatchGetCarriersByIDsRequest) returns (BatchGetCarriersByIDsResponse);

  // Creates a new carrier, optionally registering with Shippo.
  rpc CreateCarrier(CreateCarrierRequest) returns (CreateCarrierResponse);

  // Partially updates a carrier.
  rpc UpdateCarrier(UpdateCarrierRequest) returns (UpdateCarrierResponse);

  // Soft-deletes a carrier and cascades to options.
  rpc DeleteCarrier(DeleteCarrierRequest) returns (google.protobuf.Empty);

  // Starts the OAuth flow for a Shippo-managed carrier.
  rpc InitiateCarrierOAuth(InitiateCarrierOAuthRequest) returns (InitiateCarrierOAuthResponse);

  // Returns the OAuth connection status for a carrier.
  rpc GetCarrierOAuthStatus(GetCarrierOAuthStatusRequest) returns (GetCarrierOAuthStatusResponse);

  // Syncs service levels from Shippo service levels.
  rpc SyncServiceLevels(SyncServiceLevelsRequest) returns (SyncServiceLevelsResponse);

  // Returns a paginated list of service levels for a carrier.
  rpc ListServiceLevels(ListServiceLevelsRequest) returns (ListServiceLevelsResponse);

  // Returns a single service level by ID.
  rpc GetServiceLevel(GetServiceLevelRequest) returns (GetServiceLevelResponse);

  // Returns service levels by ID for the api-gateway include resolver.
  // Authorization follows the parent carrier's account scope.
  rpc BatchGetServiceLevelsByIDs(BatchGetServiceLevelsByIDsRequest) returns (BatchGetServiceLevelsByIDsResponse);

  // Creates a new service level.
  rpc CreateServiceLevel(CreateServiceLevelRequest) returns (CreateServiceLevelResponse);

  // Partially updates a service level.
  rpc UpdateServiceLevel(UpdateServiceLevelRequest) returns (UpdateServiceLevelResponse);

  // Deletes a service level.
  rpc DeleteServiceLevel(DeleteServiceLevelRequest) returns (google.protobuf.Empty);

  // Returns a paginated list of items with filtering by type, category, attribute, supplier, date, and search.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);

  // Returns a single item by ID.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);

  // Returns inventory quantities (on-hand, reserved, ATP, short) for an item.
  rpc GetItemInventory(GetItemInventoryRequest) returns (GetItemInventoryResponse);

  // Returns production cost breakdown for an item.
  rpc GetItemCosts(GetItemCostsRequest) returns (GetItemCostsResponse);

  // Returns historical trend data for an item.
  rpc GetItemTrends(GetItemTrendsRequest) returns (GetItemTrendsResponse);

  // Returns all items with on-hand inventory for export.
  rpc ExportItems(ExportItemsRequest) returns (ExportItemsResponse);
  // Partially updates an item (sku, description, notes).
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  // Adds an attribute to an item.
  rpc AddItemAttribute(AddItemAttributeRequest) returns (AddItemAttributeResponse);
  // Removes an attribute from an item.
  rpc RemoveItemAttribute(RemoveItemAttributeRequest) returns (RemoveItemAttributeResponse);
  // Changes an item's category and updates rate units accordingly.
  rpc ChangeItemCategory(ChangeItemCategoryRequest) returns (ChangeItemCategoryResponse);
  // Adjusts or reconciles inventory for an item.
  rpc UpdateItemInventory(UpdateItemInventoryRequest) returns (UpdateItemInventoryResponse);
  // Creates multiple items in a single operation.
  rpc BulkCreateItems(BulkCreateItemsRequest) returns (BulkCreateItemsResponse);
  // Reconciles inventory for multiple items by SKU.
  rpc BulkReconcileItems(BulkReconcileItemsRequest) returns (BulkReconcileItemsResponse);

  // Returns all items with their on-hand inventory quantities.
  rpc ListInventories(ListInventoriesRequest) returns (ListInventoriesResponse);
  // Returns weeks-of-sales metrics by product line.
  rpc AnalyzeWeeksOfSales(AnalyzeWeeksOfSalesRequest) returns (AnalyzeWeeksOfSalesResponse);

  // Returns child accounts for the target (parent) account.
  rpc ListChildAccounts(ListChildAccountsRequest) returns (ListChildAccountsResponse);
  // Adds a child account to the target (parent) account.
  rpc AddChildAccount(AddChildAccountRequest) returns (AddChildAccountResponse);
  // Removes a child account from the target (parent) account.
  rpc RemoveChildAccount(RemoveChildAccountRequest) returns (google.protobuf.Empty);

  // Returns child accounts by relation ID for the api-gateway include resolver.
  rpc BatchGetChildAccountsByIDs(BatchGetChildAccountsByIDsRequest) returns (BatchGetChildAccountsByIDsResponse);

  // Returns the production flow graph for a batch.
  rpc GetBatchFlow(GetBatchFlowRequest) returns (GetBatchFlowResponse);
  // Returns batches for a scanning station.
  rpc ListBatchesByScanningStation(ListBatchesByScanningStationRequest) returns (ListBatchesByScanningStationResponse);
  // Returns possible next production steps for a batch at a scanning station.
  rpc GetBatchPossibleNextSteps(GetBatchPossibleNextStepsRequest) returns (GetBatchPossibleNextStepsResponse);
  // Returns aggregated open batch summaries for analytics.
  rpc AnalyzeOpenBatches(AnalyzeOpenBatchesRequest) returns (AnalyzeOpenBatchesResponse);
  // Initializes a batch at a scanning station.
  rpc InitializeBatch(InitializeBatchRequest) returns (InitializeBatchResponse);
  // Moves one or more batches to a new production step.
  rpc MoveBatches(MoveBatchesRequest) returns (MoveBatchesResponse);
  // Merges multiple batches into a single batch.
  rpc MergeBatches(MergeBatchesRequest) returns (MergeBatchesResponse);
  // Splits a batch into firsts, seconds, and waste.
  rpc SplitBatch(SplitBatchRequest) returns (SplitBatchResponse);
  // Returns the remaining quantity available to split from a batch flow.
  rpc GetRemainingQuantityToSplit(GetRemainingQuantityToSplitRequest) returns (GetRemainingQuantityToSplitResponse);
  // Returns consumption demand for a scanning station.
  rpc GetScanningStationConsumption(GetScanningStationConsumptionRequest) returns (GetScanningStationConsumptionResponse);
  // Closes a batch.
  rpc CloseBatch(CloseBatchRequest) returns (CloseBatchResponse);
  // Deletes a single batch.
  rpc DeleteBatch(DeleteBatchRequest) returns (DeleteBatchResponse);
  // Deletes multiple batches.
  rpc DeleteManyBatches(DeleteManyBatchesRequest) returns (google.protobuf.Empty);

  rpc ListItemCategories(ListItemCategoriesRequest) returns (ListItemCategoriesResponse);
  rpc GetItemCategory(GetItemCategoryRequest) returns (GetItemCategoryResponse);
  rpc CreateItemCategory(CreateItemCategoryRequest) returns (CreateItemCategoryResponse);
  rpc UpdateItemCategory(UpdateItemCategoryRequest) returns (UpdateItemCategoryResponse);
  rpc DeleteItemCategory(DeleteItemCategoryRequest) returns (google.protobuf.Empty);
  rpc AddItemCategoryProperty(AddItemCategoryPropertyRequest) returns (google.protobuf.Empty);
  rpc RemoveItemCategoryProperty(RemoveItemCategoryPropertyRequest) returns (google.protobuf.Empty);
  // Changes the unit group of an item category and updates related rate units.
  rpc ChangeItemCategoryUnitGroup(ChangeItemCategoryUnitGroupRequest) returns (google.protobuf.Empty);

  // Returns products with full item data.
  rpc ListProductsFull(ListProductsFullRequest) returns (ListProductsFullResponse);
  // Returns all matching products (no pagination) for export.
  rpc ExportProducts(ExportProductsRequest) returns (ExportProductsResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  // Soft-deletes a product.
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc ChangeProductProductLine(ChangeProductProductLineRequest) returns (ChangeProductProductLineResponse);
  // Validates SKUs and returns matching products.
  rpc ValidateProducts(ValidateProductsRequest) returns (ValidateProductsResponse);
  rpc BatchGetProductsByIDs(BatchGetProductsByIDsRequest) returns (BatchGetProductsByIDsResponse);

  rpc ListProductLines(ListProductLinesRequest) returns (ListProductLinesResponse);
  rpc GetProductLine(GetProductLineRequest) returns (GetProductLineResponse);
  rpc CreateProductLine(CreateProductLineRequest) returns (CreateProductLineResponse);
  rpc UpdateProductLine(UpdateProductLineRequest) returns (UpdateProductLineResponse);
  rpc DeleteProductLine(DeleteProductLineRequest) returns (google.protobuf.Empty);
  // Returns product lines by ID for the api-gateway include resolver.
  rpc BatchGetProductLinesByIDs(BatchGetProductLinesByIDsRequest) returns (BatchGetProductLinesByIDsResponse);

  rpc GetConsumption(GetConsumptionRequest) returns (GetConsumptionResponse);
  rpc CreateConsumption(CreateConsumptionRequest) returns (CreateConsumptionResponse);
  rpc UpdateConsumption(UpdateConsumptionRequest) returns (UpdateConsumptionResponse);
  rpc DeleteConsumption(DeleteConsumptionRequest) returns (DeleteConsumptionResponse);

  // Returns the production flow graph for a given item.
  rpc GetProductionFlow(GetProductionFlowRequest) returns (GetProductionFlowResponse);
  // Links two production steps in the flow DAG.
  rpc ConnectProductionSteps(ConnectProductionStepsRequest) returns (google.protobuf.Empty);

  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  // Returns customers by ID for the api-gateway include resolver.
  rpc BatchGetCustomersByIDs(BatchGetCustomersByIDsRequest) returns (BatchGetCustomersByIDsResponse);
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
  // Deletes a customer and its associated relations.
  rpc DeleteCustomer(DeleteCustomerRequest) returns (google.protobuf.Empty);
  rpc BulkDeleteCustomers(BulkDeleteCustomersRequest) returns (google.protobuf.Empty);
  // Returns the most frequently ordered products for a customer.
  rpc GetFrequentlyOrderedProducts(GetFrequentlyOrderedProductsRequest) returns (GetFrequentlyOrderedProductsResponse);
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse);
  // Merges source customers into a target customer.
  rpc MergeCustomers(MergeCustomersRequest) returns (MergeCustomersResponse);

  // --- Analytics RPCs ---

  rpc AnalyzeSales(AnalyzeSalesRequest) returns (AnalyzeSalesResponse);
  rpc AnalyzeProductionCosts(AnalyzeProductionCostsRequest) returns (AnalyzeProductionCostsResponse);
  rpc AnalyzeDeliveries(AnalyzeDeliveriesRequest) returns (AnalyzeDeliveriesResponse);
  rpc AnalyzeManufacturing(AnalyzeManufacturingRequest) returns (AnalyzeManufacturingResponse);
  // Returns all manufacturing metrics for two date ranges.
  rpc AnalyzeManufacturingBatch(AnalyzeManufacturingBatchRequest) returns (AnalyzeManufacturingBatchResponse);
  rpc AnalyzeOrders(AnalyzeOrdersRequest) returns (AnalyzeOrdersResponse);
  rpc AnalyzeQuarterlyOrders(AnalyzeQuarterlyOrdersRequest) returns (AnalyzeQuarterlyOrdersResponse);
  rpc AnalyzeMaterials(AnalyzeMaterialsRequest) returns (AnalyzeMaterialsResponse);
