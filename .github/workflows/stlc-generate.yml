name: Generate SDKs with stlc (manual)

# Release-driven SDK generation runs from release.yml (specs from S3 after publish-openapi-specs).
# This workflow is for ad-hoc / emergency runs; it regenerates specs and Stainless configs in the job with make openapi-stainless-quiet.
on:
  workflow_dispatch:
    inputs:
      api_version:
        description: Optional API version label for commit/PR messages (e.g. v0.17.10). Defaults to v<.release-please-manifest.json>.
        required: false
      push_branch:
        description: Branch to push on each SDK repo (and PR head if open_pr is true)
        required: false
        default: main
      open_pr:
        description: Open PRs from push_branch into main instead of pushing directly
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STLC_GITHUB_ORG: sdk-gen
  STLC_TARGETS: typescript

jobs:
  resolve:
    name: Resolve API version
    runs-on: ubuntu-latest
    outputs:
      api_version: ${{ steps.msg.outputs.api_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve API version for SDK commit
        id: msg
        env:
          API_VERSION_INPUT: ${{ github.event.inputs.api_version || '' }}
        run: |
          if [ -n "$API_VERSION_INPUT" ]; then
            api_version="$API_VERSION_INPUT"
          else
            manifest_version=$(jq -r '."."' .release-please-manifest.json)
            api_version="v${manifest_version}"
          fi
          case "$api_version" in
            v*) ;;
            *) api_version="v${api_version}" ;;
          esac
          echo "api_version=${api_version}" >> "$GITHUB_OUTPUT"

  generate:
    name: Generate SDKs
    needs: resolve
    # The reusable workflow declares `id-token: write` (AWS OIDC on the s3 path);
    # a called workflow can't be granted more than its caller, so this job must
    # grant it too or the run fails at startup. Mirrors release.yml's generate-sdks.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/stlc-generate-reusable.yml
    with:
      api_version: ${{ needs.resolve.outputs.api_version }}
      push_branch: ${{ inputs.push_branch }}
      openapi_specs_source: generate
      open_pr: ${{ inputs.open_pr }}
      pr_base_branch: main
    secrets:
      STLC_READ_TOKEN: ${{ secrets.STLC_READ_TOKEN }}
      SDK_WRITE_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}
