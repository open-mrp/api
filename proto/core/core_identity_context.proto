syntax = "proto3";

// CoreService message types (imported by core.proto).
package core;

import "google/protobuf/timestamp.proto";
option go_package = "shared/proto/core;core";

message GetAccountContextRequest {
  string account_id = 1;
}
message GetAccountContextResponse {
  bool is_sandbox = 1;
  // Parent production account ID for sandbox accounts; absent for production.
  optional string owner_account_id = 2;
  AccountMode account_mode = 3;
  // Stripe subscription status; absent for free-tier accounts.
  optional string subscription_status = 4;
  // For sandbox accounts, this is the owner account's plan code.
  string plan_code = 5;
  // Monthly spending cap for agent LLM usage in cents. Absent means unlimited.
  // For sandbox accounts, this is the owner account's cap.
  optional int64 agent_monthly_spending_cap_cents = 6;
}
enum AccountMode {
  ACCOUNT_MODE_UNSPECIFIED = 0;
  ACCOUNT_MODE_PRODUCTION = 1;
  ACCOUNT_MODE_SANDBOX = 2;
}
message GetUserAccountAccessRequest {
  string user_id = 1;
  string account_id = 2;
}
message GetUserAccountAccessResponse {
  bool has_access = 1;
  // Present only when has_access is true.
  optional AccountUserAccess access = 2;
}
message AccountUserAccess {
  string account_user_id = 1;
  string account_id = 2;
  optional string role_id = 3;
  optional string role_type_code = 4;
  // Keys are permission codes (e.g. "invoices.create"), values are always true.
  map<string, bool> permissions = 5;
  optional google.protobuf.Timestamp last_used_at = 6;
}
message GetAccountRelationRequest {
  string owner_account_id = 1;
  oneof lookup {
    string user_id = 2;
    // Database row ID, not prefixed type ID.
    int64 api_key_id = 3;
  }
}
message GetAccountRelationResponse {
  bool has_relation = 1;
  // Present only when has_relation is true.
  optional AccountRelation relation = 2;
}
message AccountRelation {
  string id = 1;
  // The account on the other side of the relationship (the entity's "home" account).
  string counterparty_account_id = 2;
  // Relationship type: "customer" or "supplier".
  string role_code = 3;
  // True when the caller's account is the owner of the relation (e.g. merchant targeting customer).
  bool is_owner_side = 4;
}
message GetRolePermissionsRequest {
  string role_id = 1;
}
message GetRolePermissionsResponse {
  // Keys are permission codes (e.g. "invoices.create"), values are always true.
  map<string, bool> permissions = 1;
}
message GetRoleInfoRequest {
  string role_id = 1;
}
message GetRoleInfoResponse {
  string role_id = 1;
  string name = 2;
  string role_type_code = 3;
}
message MarkAccountUserUsedRequest {
  string account_user_id = 1;
}
message ListUserAccountAffiliationsRequest {
  string user_id = 1;
}
message ListUserAccountAffiliationsResponse {
  repeated AccountAffiliation affiliations = 1;
  // Used as default selection in account switching UI. Absent if never accessed.
  optional string last_used_account_id = 2;
}
message AccountAffiliation {
  string account_id = 1;
  string account_name = 2;
  string role_id = 3;
  string role_name = 4;
  string role_type_code = 5;
  optional google.protobuf.Timestamp last_used_at = 6;
}
message CompleteRegistrationRequest {
  string user_id = 1;
  string plan_code = 2;
  string stripe_customer_id = 3;
  // Absent for free-tier plans that don't create a subscription.
  optional string stripe_subscription_id = 4;
  RegistrationAccountData account_data = 5;
}
message RegistrationAccountData {
  string account_name = 1;
  optional RegistrationAddress business_address = 2;
}
message RegistrationAddress {
  optional string line1 = 1;
  optional string line2 = 2;
  optional string city = 3;
  optional string state = 4;
  optional string postal_code = 5;
  optional string country = 6;
}
message CompleteRegistrationResponse {
  string account_id = 1;
  string sandbox_id = 2;
}
message GetSandboxAccountByOwnerRequest {
  string owner_account_id = 1;
}
message GetSandboxAccountByOwnerResponse {
  string sandbox_account_id = 1;
}
message GetAdminRoleResponse {
  string role_id = 1;
}
message RolePermissionDetail {
  string id = 1;
  string permission_code = 2;
  bool create = 3;
  bool read = 4;
  bool update = 5;
  bool delete = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}
message RoleDetail {
  string id = 1;
  string name = 2;
  string role_type_code = 3;
  string account_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  repeated RolePermissionDetail permissions = 7;
}
message ListRolesRequest {
  string cursor = 1;
  int32 limit = 2;
  string query = 3;
  repeated string role_type_codes = 4;
}
message ListRolesResponse {
  repeated RoleDetail roles = 1;
  PageInfo page_info = 2;
}
message GetRoleRequest {
  string id = 1;
}
message GetRoleResponse {
  RoleDetail role = 1;
}
message CreateRolePermissionInput {
  string permission_code = 1;
  bool create = 2;
  bool read = 3;
  bool update = 4;
  bool delete = 5;
}
message CreateRoleRequest {
  string name = 1;
  repeated CreateRolePermissionInput permissions = 2;
}
message CreateRoleResponse {
  RoleDetail role = 1;
}
message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  // When false, existing permissions are left unchanged.
  bool has_permissions = 3;
  // Only applied when has_permissions is true.
  repeated CreateRolePermissionInput permissions = 4;
}
message UpdateRoleResponse {
  RoleDetail role = 1;
}
message DeleteRoleRequest {
  string id = 1;
}
message ListSandboxAccountsRequest {
  optional string cursor = 1;
  int32 limit = 2;
  repeated string includes = 3;
  optional string query = 4;
}
message PageInfo {
  optional string next_cursor = 1;
  optional string prev_cursor = 2;
  bool has_next_page = 3;
  bool has_prev_page = 4;
}
message ListSandboxAccountsResponse {
  repeated SandboxInfo sandboxes = 1;
  PageInfo page_info = 2;
}
enum SandboxMode {
  SANDBOX_MODE_UNSPECIFIED = 0; // defaults to blank
  SANDBOX_MODE_BLANK = 1;
  SANDBOX_MODE_SEEDED = 2;
}
message CreateSandboxRequest {
  string name = 1;
  SandboxMode mode = 2;
  repeated string includes = 3;
}
message CreateSandboxResponse {
  SandboxInfo sandbox = 1;
}
message GetSandboxRequest {
  string id = 1;
  repeated string includes = 2;
}
message GetSandboxResponse {
  SandboxInfo sandbox = 1;
}
message DeleteSandboxRequest {
  string id = 1;
}
message SandboxInfo {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  optional string owner_account_id = 5;
  optional string owner_account_name = 6;
}
message UpdateAccountSubscriptionRequest {
  string account_id = 1;
  optional string subscription_status = 2;
  string plan_code = 3;
  optional string stripe_subscription_id = 4;
  optional google.protobuf.Timestamp current_period_end = 5;
  // Optional Stripe customer ID to persist when upgrading a free account.
  optional string stripe_customer_id = 6;
  // V2 billing fields
  optional string billing_profile_id = 7;
  optional string billing_cadence_id = 8;
  optional string pricing_plan_subscription_id = 9;
  optional string servicing_status = 10;
  optional string collection_status = 11;
}
message ClearAccountStripeCustomerRequest {
  string account_id = 1;
}
message GetAccountByStripeCustomerIDRequest {
  string stripe_customer_id = 1;
}
message GetAccountByStripeCustomerIDResponse {
  string account_id = 1;
  string plan_code = 2;
}
message ListUnitsRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
  optional string type = 4;
  // Only units belonging to at least one of these groups are returned.
  repeated string unit_group_ids = 5;
}
message ListUnitsResponse {
  repeated UnitInfo units = 1;
  PageInfo page_info = 2;
}
message UnitInfo {
  string id = 1;
  string name = 2;
  string abbreviation = 3;
  string type = 4;
  // Conversion ratios and offsets are decimal strings relative to the base unit.
  string ratio_numerator = 5;
  string ratio_denominator = 6;
  string offset_numerator = 7;
  string offset_denominator = 8;
  bool is_base_unit = 9;
  // True if owned by the requesting account, false for system/global units.
  bool is_internal = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Null for system units.
  optional string account_id = 13;
}
message GetUnitRequest {
  string id = 1;
}
message GetUnitResponse {
  UnitInfo unit = 1;
}
message CreateUnitRequest {
  string name = 1;
  string abbreviation = 2;
  string type = 3;
  string ratio_numerator = 4;
  string ratio_denominator = 5;
  string offset_numerator = 6;
  string offset_denominator = 7;
  bool is_base_unit = 8;
}
message CreateUnitResponse {
  UnitInfo unit = 1;
}
message UpdateUnitRequest {
  string id = 1;
  optional string name = 2;
  optional string abbreviation = 3;
  optional string ratio_numerator = 4;
  optional string ratio_denominator = 5;
  optional string offset_numerator = 6;
  optional string offset_denominator = 7;
}
message UpdateUnitResponse {
  UnitInfo unit = 1;
}
message DeleteUnitRequest {
  string id = 1;
}
message UpdateAgentSpendingCapRequest {
  optional int64 cap_cents = 1;
}
message UpdateAgentSpendingCapResponse {
  optional int64 cap_cents = 1;
}
message ProductInfo {
  string product_id = 1;
  string item_id = 2;
  string sku = 3;
  string description = 4;
  string unit_price = 5;
}
message SearchProductsRequest {
  string account_id = 1;
