name: Prepare Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[a-z]*" # Stable: v1.2.forge
      - "v[0-9]+.[0-9]+.[a-z]*-preview.[0-9]+" # Preview: v1.2.forge-preview.1

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      is_preview: ${{ steps.parse.outputs.is_preview }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Parse and Validate Version
        id: parse
        run: |
          source ./scripts/version.sh

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(tag_to_version "$TAG")

          echo "Tag: $TAG"
          echo "Version: $VERSION"

          if ! validate_version "$VERSION"; then
              echo "Error: Invalid version format: $VERSION"
              exit 1
          fi

          # Check Go source version matches tag
          SOURCE_VERSION=$(get_current_version)
          if [[ "$VERSION" != "$SOURCE_VERSION" ]]; then
              echo "Error: Tag version ($VERSION) does not match source version ($SOURCE_VERSION)"
              exit 1
          fi

          if is_preview "$VERSION"; then
              echo "Release type: preview"
              echo "is_preview=true" >> "$GITHUB_OUTPUT"
          else
              echo "Release type: stable"
              echo "is_preview=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform Apply
    needs: validate
    if: needs.validate.outputs.is_preview == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/production/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: |
            .terraform/providers
            .terraform.lock.hcl
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  build-push:
    name: Build and Push
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [api-gateway, auth-service, platform-service, notification-service]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Docker Tags
        id: tags
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          SERVICE="${{ matrix.service }}"
          TAG="${{ needs.validate.outputs.tag }}"
          IS_PREVIEW="${{ needs.validate.outputs.is_preview }}"

          TAGS="${REGISTRY}/augno/${SERVICE}:${TAG}"

          # Only add :latest for stable releases
          if [[ "$IS_PREVIEW" == "false" ]]; then
              TAGS="${TAGS},${REGISTRY}/augno/${SERVICE}:latest"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/production/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: [validate, terraform, build-push]
    if: |
      needs.validate.outputs.is_preview == 'false' &&
      needs.terraform.result == 'success' &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Deploy to EKS
        run: ./scripts/deploy.sh
        env:
          AWS_REGION: "us-east-2"
          CLUSTER_NAME: "augno-prod"
          IMAGE_TAG: ${{ needs.validate.outputs.tag }}

  publish-openapi-specs:
    name: Publish OpenAPI Specs
    needs: [validate, deploy]
    if: needs.validate.outputs.is_preview == 'false' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Generate OpenAPI Specs
        run: |
          make install-cd-tools
          make gen-openapi-specs

      - name: Upload Public Spec to S3
        run: |
          aws s3 cp specs/public_openapi_spec.json s3://augno-public-openapi-specs/openapi.json
          aws s3 cp specs/public_openapi_spec.json s3://augno-public-openapi-specs/${{ needs.validate.outputs.tag }}.json

      - name: Upload Private Spec to S3
        run: |
          aws s3 cp specs/internal_openapi_spec.json s3://augno-private-openapi-specs/openapi.json
          aws s3 cp specs/internal_openapi_spec.json s3://augno-private-openapi-specs/${{ needs.validate.outputs.tag }}.json

      - name: Upload to Stainless
        uses: stainless-api/upload-openapi-spec-action@v1
        with:
          input_path: specs/public_openapi_spec.json
          project_name: augno
          stainless_api_key: ${{ secrets.STAINLESS_API_KEY }}

  create-github-release:
    name: Create GitHub Release
    needs: [validate, build-push]
    if: always() && needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          CHANGELOG=$(./scripts/generate-changelog.sh)
          # Use GitHub's delimiter syntax for multiline output
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ needs.validate.outputs.is_preview == 'true' }}
          generate_release_notes: false
