name: Deploy MCP Server (manual)

# On-demand build + deploy of the MCP server.
#
# The MCP server source lives in augno/typescript-sdk/packages/mcp-server and is
# (re)generated by the SDK-generation jobs. release.yml's build-mcp job only
# runs on a release that *changes the public spec* (and after generate-sdks
# succeeds), so it can't (re)deploy an already-released version. This workflow is
# the manual / first-time path: it builds the image from typescript-sdk's
# generated Dockerfile and rolls it out on prod EKS.
#
# Mirrors the "Build and Deploy MCP Server" job in release.yml. The
# github-actions-mcp-deploy OIDC role only trusts refs/heads/main, so this must
# be dispatched from the main branch.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build/deploy (e.g. v0.23.4). Defaults to v<.release-please-manifest.json>.
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-mcp:
    name: Build and Deploy MCP Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout API repo (k8s manifest)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(jq -r '."."' .release-please-manifest.json)"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          if [[ ! "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "image_tag must be a semantic release tag such as v0.23.4" >&2
            exit 1
          fi
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "MCP image tag: ${tag}"

      - name: Checkout typescript-sdk (MCP build context)
        uses: actions/checkout@v5
        with:
          repository: augno/typescript-sdk
          # Pin the SDK checkout to the release tag being deployed, never a
          # caller-supplied ref. CROSS_REPO_PAT is a read-scoped cross-repo
          # token, available here because this job runs in the `production`
          # environment.
          ref: ${{ steps.tag.outputs.image_tag }}
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: typescript-sdk-src
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-actions-mcp-deploy
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push MCP Server image
        uses: docker/build-push-action@v7
        with:
          # The generated Dockerfile builds the whole pnpm workspace; context is
          # the typescript-sdk repo root, Dockerfile is the generated one.
          context: typescript-sdk-src
          file: typescript-sdk-src/packages/mcp-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/mcp-server:${{ steps.tag.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/augno/mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy MCP Server to EKS
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region us-east-2 --name augno-prod
          registry="${{ steps.login-ecr.outputs.registry }}"
          image="${registry}/augno/mcp-server:${{ steps.tag.outputs.image_tag }}"
          manifest=infra/production/kubernetes/apps/mcp-server.yaml
          # Pin the rolled-out image to the resolved tag (mirrors deploy.sh).
          sed -E "s#^([[:space:]]*image: ).*#\1${image}#" "$manifest" > /tmp/mcp-server.yaml
          kubectl apply -f /tmp/mcp-server.yaml
          kubectl rollout status deployment/mcp-server --timeout=5m
