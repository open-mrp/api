name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/tool-versions'
              - 'shared/db/migrations/**'
            e2e:
              - 'services/**'
              - 'shared/**'
              - 'tests/e2e/**'
              - 'docker-compose.e2e.yml'
              - 'infra/production/docker/Dockerfile'
              - 'tools/apidocs/**'

  setup:
    name: Setup Tools
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache CI Tools
        uses: actions/cache@v4
        id: cache-ci-tools
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-ci-tools-${{ hashFiles('tools/tool-versions') }}

      - name: Install CI Tools
        if: steps.cache-ci-tools.outputs.cache-hit != 'true'
        run: make install-ci-tools

      - name: Upload CI Tools
        uses: actions/upload-artifact@v4
        with:
          name: ci-tools
          path: ~/go/bin
          retention-days: 1

  lint:
    name: Lint
    needs: [changes, setup]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download CI Tools
        uses: actions/download-artifact@v4
        with:
          name: ci-tools
          path: ~/go/bin

      - name: Fix tool permissions
        run: chmod +x ~/go/bin/*

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Validate version
        run: |
          source ./scripts/version.sh
          validate_version "$(go run ./cmd/print-version)" || exit 1

      - name: Run Gosec and Static Check
        run: |
          make gosec &
          PID_GOSEC=$!
          make static-check &
          PID_STATIC=$!
          wait $PID_GOSEC || exit 1
          wait $PID_STATIC || exit 1

      - name: Generate and Validate OpenAPI Specs
        run: |
          make openapi
          make validate-openapi-specs

  test:
    name: Test
    needs: [changes, setup]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: "Testing123!"
          MYSQL_DATABASE: augno
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pTesting123!"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: augno_agents
          POSTGRES_USER: augno
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U augno -d augno_agents"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Display Go version
        run: go version

      - name: Download CI Tools
        uses: actions/download-artifact@v4
        with:
          name: ci-tools
          path: ~/go/bin

      - name: Fix tool permissions
        run: chmod +x ~/go/bin/*

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Generate sqlc
        run: make sqlc

      - name: Apply MySQL migrations
        run: |
          GOOSE_DRIVER=mysql \
          GOOSE_DBSTRING="root:Testing123!@tcp(localhost:3306)/augno?parseTime=true" \
            goose -dir shared/db/migrations up

      - name: Apply PostgreSQL migrations
        run: |
          GOOSE_DRIVER=postgres \
          GOOSE_DBSTRING="postgres://augno@localhost:5432/augno_agents?sslmode=disable" \
            goose -dir services/agent-service/db/migrations up

      - name: Run SQL Prepare Smoke Tests
        run: make test-sql-prepare-smoke
        env:
          DB_URL: "root:Testing123!@tcp(localhost:3306)/augno?parseTime=true"
          AGENT_DB_URL: "postgres://augno@localhost:5432/augno_agents?sslmode=disable"

      - name: Run Tests
        run: make test

  e2e:
    name: E2E
    needs: [changes, setup]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate OpenAPI spec
        run: make openapi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build E2E images with cache
        run: |
          pids=()
          for svc in platform-service core-service notification-service auth-service billing-service agent-service api-gateway; do
            (
              echo "Building $svc..."
              docker buildx build \
                --build-arg SERVICE_NAME=$svc \
                --cache-from type=gha,scope=e2e-$svc \
                --cache-to type=gha,scope=e2e-$svc,mode=max \
                --load \
                -t augno-e2e-$svc \
                -f infra/production/docker/Dockerfile .
              echo "$svc done."
            ) &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -eq 1 ]; then
            echo "One or more image builds failed."
            exit 1
          fi

      - name: Start E2E stack
        run: make e2e-up-ci

      - name: Download CI Tools
        uses: actions/download-artifact@v4
        with:
          name: ci-tools
          path: ~/go/bin

      - name: Fix tool permissions
        run: chmod +x ~/go/bin/*

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run E2E tests
        run: ./scripts/run-e2e-tests.sh 300s

      - name: Tear down E2E stack
        if: always()
        run: make e2e-down
