services:
  # An S3-compatible store so the upload and export paths run for real in e2e. Without it the
  # only way to exercise a photo upload is to point at AWS, so those endpoints went untested.
  minio-e2e:
    image: minio/minio:latest
    container_name: augno-minio-e2e
    command: server /data
    environment:
      MINIO_ROOT_USER: e2eaccesskey
      MINIO_ROOT_PASSWORD: e2esecretkey
      # Uploads request SSE-S3, which MinIO refuses unless it has a key to encrypt with.
      # Supplying one keeps the production upload path unchanged rather than making the code
      # skip encryption when it happens to be talking to a test server.
      MINIO_KMS_SECRET_KEY: "e2e-key:eEVCcnhtcWZ5bHpaU2hEdWJRUEhzS3RWd05qWGFHZEM="
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - e2e

  # Creates the buckets the services expect and exits. Services wait on it completing.
  minio-e2e-init:
    image: minio/mc:latest
    container_name: augno-minio-init-e2e
    depends_on:
      minio-e2e:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set e2e http://minio-e2e:9000 e2eaccesskey e2esecretkey &&
      for b in augno-account-photos augno-user-photos augno-shipping-labels augno-exports augno-chat-attachments augno-inbound-email; do
        mc mb --ignore-existing e2e/$$b;
      done
      "
    networks:
      - e2e

  mysql-e2e:
    image: mysql:8
    container_name: augno-mysql-e2e
    environment:
      MYSQL_ROOT_PASSWORD: "Testing123!"
      MYSQL_DATABASE: augno
    # Long-running e2e stacks accumulate thousands of rows in message_outbox
    # and request_log. The outbox poller's `ORDER BY next_run_at LIMIT N` under
    # an UPDATE resorts to filesort, which exceeds the 256K default
    # sort_buffer_size and breaks outbox delivery (audit events, etc.).
    # Bumping both sort and the connection cap keeps long sessions stable.
    command:
      - --sort-buffer-size=8M
      - --max-connections=500
    # Published on 3307 (3306 is the local dev MySQL) so host-side e2e tests can
    # read backend state directly — e.g. the registration verification token,
    # which is intentionally never exposed through the API.
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pTesting123!"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      # On the isolated backend net for service traffic, plus `edge` solely so
      # the host-side e2e harness can reach the published 3307 port. (Docker
      # Desktop can't publish a host port from an `internal` network.)
      - e2e
      - edge

  postgres-e2e:
    image: postgres:16
    container_name: augno-postgres-e2e
    environment:
      POSTGRES_DB: augno_agents
      POSTGRES_USER: augno
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U augno -d augno_agents"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e

  rabbitmq:
    image: rabbitmq:3-management
    container_name: augno-rabbitmq-e2e
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e

  platform-service:
    image: augno-e2e-platform-service
    build:
      context: .
      dockerfile: infra/production/docker/Dockerfile
      args:
        SERVICE_NAME: platform-service
    container_name: augno-platform-service-e2e
    environment:
      PLATFORM: test
      PORT: "9092"
      DB_URL: root:Testing123!@tcp(mysql-e2e:3306)/augno?parseTime=true
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      CURSOR_HMAC_KEY: b073b04358fbd77eaf3ce224de1ba3c7d8f91fa5bdea440dc5a37c9e1627197d
    depends_on:
      mysql-e2e:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - e2e

  core-service:
    image: augno-e2e-core-service
    build:
      context: .
      dockerfile: infra/production/docker/Dockerfile
      args:
        SERVICE_NAME: core-service
    container_name: augno-core-service-e2e
    environment:
      PLATFORM: test
      PORT: "9092"
      DB_URL: root:Testing123!@tcp(mysql-e2e:3306)/augno?parseTime=true
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      CURSOR_HMAC_KEY: b073b04358fbd77eaf3ce224de1ba3c7d8f91fa5bdea440dc5a37c9e1627197d
      INTEGRATION_ENCRYPTION_KEY: "4815cd74058e6ce82216c9b89dac44dbd171371243342f96fa7a6d8c81c1a491"
      INTEGRATION_ENCRYPTION_KEY_ID: dev-key-1
      FRONTEND_URL: http://localhost:4200
      AUTH_SERVICE_URL: auth-service:9092
      S3_ENDPOINT_URL: http://minio-e2e:9000
      AWS_REGION: us-east-2
      AWS_ACCESS_KEY_ID: e2eaccesskey
      AWS_SECRET_ACCESS_KEY: e2esecretkey
      ACCOUNT_PHOTOS_BUCKET: augno-account-photos
      USER_PHOTOS_BUCKET: augno-user-photos
      SHIPPING_LABELS_BUCKET: augno-shipping-labels
      EXPORTS_BUCKET: augno-exports
    depends_on:
      mysql-e2e:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-e2e-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - e2e

  auth-service:
    image: augno-e2e-auth-service
    build:
      context: .
      dockerfile: infra/production/docker/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: augno-auth-service-e2e
    environment:
      PLATFORM: test
      PORT: "9092"
      DB_URL: root:Testing123!@tcp(mysql-e2e:3306)/augno?parseTime=true
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: test-token-secret
      PEPPER: pepper
      CURSOR_HMAC_KEY: b073b04358fbd77eaf3ce224de1ba3c7d8f91fa5bdea440dc5a37c9e1627197d
      DOC_API_KEY_ENCRYPTION_KEY: "4815cd74058e6ce82216c9b89dac44dbd171371243342f96fa7a6d8c81c1a491"
      CORE_SERVICE_URL: core-service:9092
      BILLING_SERVICE_URL: billing-service:9092
      PLATFORM_SERVICE_URL: platform-service:9092
      FRONTEND_URL: http://localhost:4200
    depends_on:
      mysql-e2e:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      core-service:
        condition: service_healthy
      platform-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - e2e

  notification-service:
    image: augno-e2e-notification-service
    build:
      context: .
      dockerfile: infra/production/docker/Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: augno-notification-service-e2e
    environment:
      PLATFORM: test
      PORT: "9092"
      DB_URL: root:Testing123!@tcp(mysql-e2e:3306)/augno?parseTime=true
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mysql-e2e:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - e2e

  billing-service:
    image: augno-e2e-billing-service
    build:
      context: .
      dockerfile: infra/production/docker/Dockerfile
      args:
        SERVICE_NAME: billing-service
    container_name: augno-billing-service-e2e
    environment:
      # Handed to the browser so Stripe.js can mount the card form. Not a credential — a
      # publishable key is public by design — but the setup-billing response declares it
      # required, so leaving it unset makes that response violate its own contract.
      STRIPE_PUBLISHABLE_KEY: pk_test_e2e_stub
      PLATFORM: test
      PORT: "9092"
      DB_URL: root:Testing123!@tcp(mysql-e2e:3306)/augno?parseTime=true
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      CURSOR_HMAC_KEY: b073b04358fbd77eaf3ce224de1ba3c7d8f91fa5bdea440dc5a37c9e1627197d
      CORE_SERVICE_URL: core-service:9092
      NOTIFICATION_SERVICE_URL: notification-service:9092
      FRONTEND_URL: http://localhost:4200
    depends_on:
      mysql-e2e:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      core-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - e2e

  agent-service:
    image: augno-e2e-agent-service
    build:
      context: .
      dockerfile: infra/production/docker/Dockerfile
      args:
        SERVICE_NAME: agent-service
    container_name: augno-agent-service-e2e
    environment:
      PLATFORM: test
      PORT: "9092"
      DB_URL: postgres://augno@postgres-e2e:5432/augno_agents?sslmode=disable
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      CURSOR_HMAC_KEY: b073b04358fbd77eaf3ce224de1ba3c7d8f91fa5bdea440dc5a37c9e1627197d
      CORE_SERVICE_URL: core-service:9092
      BILLING_SERVICE_URL: billing-service:9092
    depends_on:
      postgres-e2e:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - e2e

  api-gateway:
    image: augno-e2e-api-gateway
    build:
      context: .
      dockerfile: infra/production/docker/Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: augno-api-gateway-e2e
    environment:
      PLATFORM: test
      PORT: "8081"
      DB_URL: root:Testing123!@tcp(mysql-e2e:3306)/augno?parseTime=true
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      AUTH_SERVICE_URL: auth-service:9092
      CORE_SERVICE_URL: core-service:9092
      BILLING_SERVICE_URL: billing-service:9092
      PLATFORM_SERVICE_URL: platform-service:9092
      AGENT_SERVICE_URL: agent-service:9092
      FRONTEND_URL: http://localhost:4200
    ports:
      - "8082:8081"
    depends_on:
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      platform-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8081/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      # Backend net for proxying to services, plus `edge` so the host harness
      # can reach the published 8082 port.
      - e2e
      - edge

networks:
  # Backend network for all inter-service and DB traffic. `internal: true` means
  # Docker adds no route to the outside world, so e2e services CANNOT reach the
  # public internet — no real Stripe charges, emails, webhooks, or calls to
  # production can escape the stack. Keep this internal.
  e2e:
    driver: bridge
    internal: true
  # Minimal non-internal bridge used ONLY to publish host-facing ports for the
  # two containers the e2e test runner connects to from the host (mysql-e2e:3307
  # and api-gateway:8082). These two retain outbound connectivity as a side
  # effect of port publishing, but neither makes external integration calls
  # (mysql is passive; the gateway only routes to internal services). Do not
  # attach billing/notification/agent/etc. here — they must stay fully isolated.
  edge:
    driver: bridge
