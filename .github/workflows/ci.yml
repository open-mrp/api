name: CI

on:
  pull_request:
    branches: [main]

# paths-filter reads the PR's changed files from the API, which the default token
# is not granted.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/tool-versions'
              - 'shared/db/migrations/**'

  validate-version:
    name: Validate Version
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate version
        run: |
          source ./scripts/version.sh
          validate_version "$(go run ./cmd/print-version)" || exit 1

  gosec:
    name: Gosec
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache gosec
        uses: actions/cache@v6
        id: cache-gosec
        with:
          path: ~/go/bin/gosec
          key: ${{ runner.os }}-gosec-${{ hashFiles('tools/tool-versions') }}

      - name: Install gosec
        if: steps.cache-gosec.outputs.cache-hit != 'true'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v$(awk '/gosec/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)

      - name: Get changed packages
        id: pkgs
        run: |
          PKGS=$(./scripts/select-changed-packages.sh origin/main)
          echo "pkgs=${PKGS:-}" >> "$GITHUB_OUTPUT"

      - name: Run gosec (fast rules)
        if: steps.pkgs.outputs.pkgs != ''
        run: |
          gosec -include=G101,G102,G103,G104,G401,G402,G404 \
            -exclude-generated -concurrency=$(nproc) \
            ${{ steps.pkgs.outputs.pkgs }}

  staticcheck:
    name: Staticcheck
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache staticcheck
        uses: actions/cache@v6
        id: cache-staticcheck
        with:
          path: ~/go/bin/staticcheck
          key: ${{ runner.os }}-staticcheck-${{ hashFiles('tools/tool-versions') }}

      - name: Install staticcheck
        if: steps.cache-staticcheck.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@v$(awk '/honnef.co\/go\/tools/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)

      - name: Get changed packages
        id: pkgs
        run: |
          PKGS=$(./scripts/select-changed-packages.sh origin/main)
          echo "pkgs=${PKGS:-}" >> "$GITHUB_OUTPUT"

      - name: Run staticcheck
        if: steps.pkgs.outputs.pkgs != ''
        run: staticcheck ${{ steps.pkgs.outputs.pkgs }}

  govet:
    name: Govet
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Get changed packages
        id: pkgs
        run: |
          PKGS=$(./scripts/select-changed-packages.sh origin/main)
          echo "pkgs=${PKGS:-}" >> "$GITHUB_OUTPUT"

      - name: Run govet
        if: steps.pkgs.outputs.pkgs != ''
        run: go vet ${{ steps.pkgs.outputs.pkgs }}

  tx-audit:
    name: Transaction Audit
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Static analysis over every WithTx closure: no database, no service container, seconds to run.
      # It gates the PR rather than running post-merge because the effects it finds — a slice appended
      # to from inside a callback that re-runs on a deadlock, a broker publish the rollback cannot
      # undo — are silent until a retry happens in production, which is where they were being found.
      - name: Run transaction audit
        run: make tx-audit

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache Go build/test results
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-test-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-test-

      - name: Download modules
        run: go mod download

      - name: Select affected test packages
        id: select
        run: |
          PKGS=$(./scripts/select-tests.sh origin/main)
          echo "pkgs=${PKGS}" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        if: steps.select.outputs.pkgs != ''
        run: |
          if [ "${{ steps.select.outputs.pkgs }}" = "./..." ]; then
            make test
          else
            time go test ${{ steps.select.outputs.pkgs }}
          fi
