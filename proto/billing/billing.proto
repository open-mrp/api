syntax = "proto3";

package billing;

import "google/protobuf/timestamp.proto";

option go_package = "shared/proto/billing;billing";

service BillingService {
  // ListPricingPlans returns a paginated list of currently active pricing plans.
  rpc ListPricingPlans(ListPricingPlansRequest) returns (ListPricingPlansResponse);

  // GetPlanByCode returns a single pricing plan by its plan type code.
  rpc GetPlanByCode(GetPlanByCodeRequest) returns (GetPlanByCodeResponse);

  // ProcessWebhookEvent verifies and processes an incoming Stripe webhook event.
  rpc ProcessWebhookEvent(ProcessWebhookEventRequest) returns (ProcessWebhookEventResponse);

  // CreateCustomer creates a Stripe customer for a registration session.
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);

  // GetAccountUsage returns current resource usage for an account with plan
  // limits and subscription info.
  rpc GetAccountUsage(GetAccountUsageRequest) returns (GetAccountUsageResponse);

  // CreateBillingPortalSession creates a Stripe billing portal session for
  // managing subscriptions.
  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse);

  // PreviewPlanChange returns a cost preview for switching to a different plan
  // using the billing intent reserve+void pattern.
  rpc PreviewPlanChange(PreviewPlanChangeRequest) returns (PreviewPlanChangeResponse);

  // RequestEnterpriseUpgrade sends an enterprise plan inquiry to the sales
  // team on behalf of the requesting admin.
  rpc RequestEnterpriseUpgrade(RequestEnterpriseUpgradeRequest) returns (RequestEnterpriseUpgradeResponse);

  // EnsureBillingCustomer links or fetches a Stripe customer for an account.
  // If the account already has a Stripe customer ID it is returned; otherwise
  // a new Stripe customer is created and linked.
  rpc EnsureBillingCustomer(EnsureBillingCustomerRequest) returns (EnsureBillingCustomerResponse);

  // GetAgentSpend returns the marked-up token spend an account has accrued in
  // the current billing period, as it will be billed in Stripe. Used by
  // agent-service to enforce the spending cap against the same figure the
  // dashboard displays.
  rpc GetAgentSpend(GetAgentSpendRequest) returns (GetAgentSpendResponse);

  // SwitchPlan initiates a plan switch using v2 billing intents.
  rpc SwitchPlan(SwitchPlanRequest) returns (SwitchPlanResponse);

  // SetupBillingProfile creates a billing profile and cadence for an account.
  rpc SetupBillingProfile(SetupBillingProfileRequest) returns (SetupBillingProfileResponse);

  // SubscribeToPricingPlan creates a v2 pricing plan subscription for an account.
  rpc SubscribeToPricingPlan(SubscribeToPricingPlanRequest) returns (SubscribeToPricingPlanResponse);

  // CreateSetupIntent creates a Stripe Setup Intent for collecting a payment
  // method during registration.
  rpc CreateSetupIntent(CreateSetupIntentRequest) returns (CreateSetupIntentResponse);

  // GetSetupIntentStatus returns the current status of a Stripe Setup Intent.
  rpc GetSetupIntentStatus(GetSetupIntentStatusRequest) returns (GetSetupIntentStatusResponse);

  // ValidateStripePricingPlan checks whether the Stripe pricing plan for a
  // given plan code is accessible before account creation.
  rpc ValidateStripePricingPlan(ValidateStripePricingPlanRequest) returns (ValidateStripePricingPlanResponse);

}

message PricingPlan {
  string id = 1;
  string name = 2;
  string plan_type_code = 3;
  double price_per_seat = 4;
  optional double price_per_month = 5;
  optional int32 seat_minimum = 6;
  repeated PlanLimit limits = 7;
  repeated string display_features = 8;
  int32 display_order = 9;
  bool is_highlighted = 10;
  string button_text = 11;
  optional string includes_previous_plan = 12;
}

message PlanLimit {
  string key = 1;
  optional int32 value = 2;
}

message ListPricingPlansRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
}

message PageInfo {
  optional string next_cursor = 1;
  optional string prev_cursor = 2;
  bool has_next_page = 3;
  bool has_prev_page = 4;
}

message ListPricingPlansResponse {
  repeated PricingPlan plans = 1;
  PageInfo page_info = 2;
}

message GetPlanByCodeRequest {
  string plan_code = 1;
}

message GetPlanByCodeResponse {
  PricingPlan plan = 1;
}

message ProcessWebhookEventRequest {
  bytes raw_payload = 1;
  string stripe_signature = 2;
}

message ProcessWebhookEventResponse {
  bool success = 1;
  bool is_duplicate = 2;
}

message CreateCustomerRequest {
  string email = 1;
  string name = 2;
  string idempotency_key = 3;
  map<string, string> metadata = 4;
}

message CreateCustomerResponse {
  string customer_id = 1;
}

// Intentionally empty; account is identified by the caller's identity metadata.
message GetAccountUsageRequest {}

message UsageItem {
  int32 current = 1;
  optional int32 limit = 2;
}

message SubscriptionInfo {
  string servicing_status = 1;
  string collection_status = 2;
  optional google.protobuf.Timestamp current_period_end = 3;
}

message GetAccountUsageResponse {
  UsageItem seats = 1;
  UsageItem invoices = 2;
  UsageItem batches = 3;
  UsageItem sandboxes = 4;
  optional SubscriptionInfo subscription = 5;
  UsageItem agent_tokens = 6;
  reserved 7; // was agent_token_detail; token counts are never surfaced
  reserved "agent_token_detail";
  int64 estimated_agent_spend_cents = 8;
  // Plan display name resolved live from Stripe (e.g. the pricing plan's display_name). Empty when the account has no Stripe pricing plan.
  string plan_name = 9;
  // Flat base fee in cents charged per base_fee_interval, resolved from the pricing plan's license fee component. 0 when the plan has no base fee (e.g. per-seat pricing).
  int64 base_fee_cents = 10;
  // Billing interval the base fee is charged on (e.g. "month", "year"). Empty when there is no base fee.
  string base_fee_interval = 11;
}

// Intentionally empty; account is identified by the caller's identity metadata.
message CreateBillingPortalSessionRequest {}

message CreateBillingPortalSessionResponse {
  string url = 1;
}

message PreviewPlanChangeRequest {
  string plan_id = 1;
}

message PlanChangePreviewLineItem {
  string description = 1;
  int64 amount = 2;
}

message PlanChangePreview {
  int64 net_amount = 1;
  string formatted_net_amount = 2;
  int64 monthly_bill_amount = 3;
  string formatted_monthly_bill_amount = 4;
  repeated PlanChangePreviewLineItem line_items = 5;
  // True when the preview is a local estimate rather than a Stripe billing intent calculation.
  bool is_estimate = 6;
}

message PreviewPlanChangeResponse {
  PlanChangePreview preview = 1;
}

// Intentionally empty.
message RequestEnterpriseUpgradeRequest {}

message RequestEnterpriseUpgradeResponse {
  bool success = 1;
}

message GetAgentSpendRequest {
  optional string account_id = 1;
}

// A marked-up per-token price from the account's plan rate card, used to price a run's usage against the cap with the same rates Stripe bills.
message TokenRate {
  // Gateway model name the rate applies to (e.g. "anthropic/claude-sonnet-4.6").
  string model = 1;
  // Token type the rate applies to: input, output, cached_input, or cached_output.
  string token_type = 2;
  // Price in cents per token, markup included.
  double unit_amount_cents = 3;
}

message GetAgentSpendResponse {
  int64 estimated_spend_cents = 1;
  // Marked-up per-token rates from the account's plan rate card. Empty when the plan has no rate card. Lets the caller price in-flight usage against the cap without a per-turn round trip.
  repeated TokenRate token_rates = 2;
}

message EnsureBillingCustomerRequest {
  optional string account_id = 1;
}

message EnsureBillingCustomerResponse {
  string stripe_customer_id = 1;
  bool created = 2;
  // The billing profile ID, present if a billing profile was created or already exists.
  optional string billing_profile_id = 3;
}

message SwitchPlanRequest {
  string plan_id = 1;
}

message SwitchPlanResponse {
  bool success = 1;
  optional string intent_id = 2;
}

message SetupBillingProfileRequest {
  optional string account_id = 1;
}

message SetupBillingProfileResponse {
  string billing_profile_id = 1;
  string billing_cadence_id = 2;
}

message SubscribeToPricingPlanRequest {
  string stripe_customer_id = 1;
  string plan_code = 2;
}

// Intentionally empty; success is indicated by a nil error.
message SubscribeToPricingPlanResponse {}

message CreateSetupIntentRequest {
  string customer_id = 1;
  string idempotency_key = 2;
}

message CreateSetupIntentResponse {
  string setup_intent_id = 1;
  string client_secret = 2;
  string publishable_key = 3;
}

message GetSetupIntentStatusRequest {
  string setup_intent_id = 1;
}

message GetSetupIntentStatusResponse {
  string status = 1;
  optional string payment_method_id = 2;
}

message ValidateStripePricingPlanRequest {
  string plan_code = 1;
}

message ValidateStripePricingPlanResponse {
  bool valid = 1;
}
