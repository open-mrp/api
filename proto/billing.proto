syntax = "proto3";

package billing;

import "google/protobuf/timestamp.proto";

option go_package = "shared/proto/billing;billing";

service BillingService {
  // ListPricingPlans returns a paginated list of currently active pricing plans.
  rpc ListPricingPlans(ListPricingPlansRequest) returns (ListPricingPlansResponse);

  // GetPlanByCode returns a single pricing plan by its plan type code.
  rpc GetPlanByCode(GetPlanByCodeRequest) returns (GetPlanByCodeResponse);

  // ProcessWebhookEvent verifies and processes an incoming Stripe webhook event.
  rpc ProcessWebhookEvent(ProcessWebhookEventRequest) returns (ProcessWebhookEventResponse);

  // CreateCustomer creates a Stripe customer for a registration session.
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);

  // CreateCheckoutSession creates a Stripe checkout session for the given plan
  // and customer.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);

  // GetCheckoutSessionStatus retrieves the current status of a Stripe checkout
  // session, including the subscription and customer IDs if the session is
  // complete.
  rpc GetCheckoutSessionStatus(GetCheckoutSessionStatusRequest) returns (GetCheckoutSessionStatusResponse);

  // GetAccountUsage returns current resource usage for an account with plan
  // limits and subscription info.
  rpc GetAccountUsage(GetAccountUsageRequest) returns (GetAccountUsageResponse);

  // CreateBillingPortalSession creates a Stripe billing portal session for
  // managing subscriptions.
  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse);

  // GetProrationPreview previews the cost impact of switching to a different
  // pricing plan, including proration credits and charges.
  rpc GetProrationPreview(GetProrationPreviewRequest) returns (GetProrationPreviewResponse);

  // RequestEnterpriseUpgrade sends an enterprise plan inquiry to the sales
  // team on behalf of the requesting admin.
  rpc RequestEnterpriseUpgrade(RequestEnterpriseUpgradeRequest) returns (RequestEnterpriseUpgradeResponse);

  // EnsureBillingCustomer links or fetches a Stripe customer for an account.
  // If the account already has a Stripe customer ID it is returned; otherwise
  // a new Stripe customer is created and linked.
  rpc EnsureBillingCustomer(EnsureBillingCustomerRequest) returns (EnsureBillingCustomerResponse);

  // SwitchPlan initiates a plan switch. Handles free→paid (checkout),
  // paid→free (cancel), and paid→paid (subscription update) scenarios.
  rpc SwitchPlan(SwitchPlanRequest) returns (SwitchPlanResponse);

  // ConfirmPlanSwitch is called after a Stripe checkout redirect to confirm
  // the upgrade from a free plan to a paid plan.
  rpc ConfirmPlanSwitch(ConfirmPlanSwitchRequest) returns (ConfirmPlanSwitchResponse);
}

message PricingPlan {
  string id = 1;
  string name = 2;
  string plan_type_code = 3;
  double price_per_seat = 4;
  optional double price_per_month = 5;
  optional int32 seat_minimum = 6;
  repeated PlanLimit limits = 7;
  repeated string display_features = 8;
  int32 display_order = 9;
  bool is_highlighted = 10;
  string button_text = 11;
  optional string includes_previous_plan = 12;
}

message PlanLimit {
  string key = 1;
  optional int32 value = 2;
}

// ListPricingPlansRequest carries pagination parameters for listing pricing plans.
message ListPricingPlansRequest {
  // Cursor is the opaque pagination cursor from a previous response's
  // next_cursor field. Omit for the first page.
  optional string cursor = 1;
  // Limit is the maximum number of plans to return per page.
  int32 limit = 2;
}

// PageInfo contains cursor-based pagination metadata.
message PageInfo {
  optional string next_cursor = 1;
  optional string prev_cursor = 2;
  bool has_next_page = 3;
  bool has_prev_page = 4;
}

// ListPricingPlansResponse contains a page of pricing plans plus pagination
// indicators.
message ListPricingPlansResponse {
  // Plans is the list of pricing plans for this page.
  repeated PricingPlan plans = 1;
  // Pagination metadata.
  PageInfo page_info = 4;
}

// GetPlanByCodeRequest carries the plan type code to look up.
message GetPlanByCodeRequest {
  // PlanCode is the plan type code (e.g. "starter", "professional").
  string plan_code = 1;
}

// GetPlanByCodeResponse contains the matching pricing plan.
message GetPlanByCodeResponse {
  // Plan is the pricing plan matching the requested code.
  PricingPlan plan = 1;
}

// ProcessWebhookEventRequest carries the raw Stripe webhook payload and
// signature header for server-side verification.
message ProcessWebhookEventRequest {
  // The raw HTTP request body bytes from Stripe.
  bytes raw_payload = 1;
  // The Stripe-Signature header value.
  string stripe_signature = 2;
}

// ProcessWebhookEventResponse indicates whether the webhook was successfully
// processed.
message ProcessWebhookEventResponse {
  // Whether the event was processed successfully.
  bool success = 1;
  // Whether the event was a duplicate (already processed).
  bool is_duplicate = 2;
}

// CreateCustomerRequest carries the parameters for creating a Stripe customer.
message CreateCustomerRequest {
  // The customer's email address.
  string email = 1;
  // The customer's display name.
  string name = 2;
  // Idempotency key for the Stripe API call.
  string idempotency_key = 3;
  // Arbitrary metadata to attach to the Stripe customer.
  map<string, string> metadata = 4;
}

// CreateCustomerResponse contains the created Stripe customer ID.
message CreateCustomerResponse {
  // The Stripe customer ID (e.g. "cus_...").
  string customer_id = 1;
}

// CreateCheckoutSessionRequest carries the parameters for creating a Stripe
// checkout session.
message CreateCheckoutSessionRequest {
  // The Stripe customer ID to associate with the session.
  string customer_id = 1;
  // The plan code to look up pricing (e.g. "starter", "professional").
  string plan_code = 2;
  // The URL to redirect to after checkout completes.
  string return_url = 3;
  // Idempotency key for the Stripe API call.
  string idempotency_key = 4;
}

// CreateCheckoutSessionResponse contains the created checkout session details.
message CreateCheckoutSessionResponse {
  // The Stripe checkout session ID.
  string session_id = 1;
  // The client secret for the embedded checkout UI.
  string client_secret = 2;
  // Field 3 was url (removed — embedded mode does not return a URL).
  reserved 3;
  reserved "url";
  // The Stripe publishable key for the frontend.
  string publishable_key = 4;
}

// GetCheckoutSessionStatusRequest carries the Stripe checkout session ID to
// look up.
message GetCheckoutSessionStatusRequest {
  // The Stripe checkout session ID (e.g. "cs_test_...").
  string checkout_session_id = 1;
}

// GetCheckoutSessionStatusResponse contains the checkout session's current
// status and, when complete, the resulting subscription and customer IDs.
message GetCheckoutSessionStatusResponse {
  // The checkout session status (e.g. "open", "complete", "expired").
  string status = 1;
  // The Stripe subscription ID, present when the checkout completed.
  optional string subscription_id = 2;
  // The Stripe customer ID associated with the checkout session.
  optional string customer_id = 3;
}

// GetAccountUsageRequest is intentionally empty; the account is identified by
// the caller's identity metadata.
message GetAccountUsageRequest {}

// UsageItem represents a single resource usage metric.
message UsageItem {
  // The current usage count.
  int32 current = 1;
  // The maximum allowed usage; absent means unlimited.
  optional int32 limit = 2;
}

// SubscriptionInfo carries billing subscription details.
message SubscriptionInfo {
  // The subscription status (active, trialing, past_due, canceled, etc.).
  string status = 1;
  // When the current billing period ends.
  optional google.protobuf.Timestamp current_period_end = 2;
  // When the trial ends, if subscription is trialing.
  optional google.protobuf.Timestamp trial_end = 3;
  // Whether the subscription will cancel at the end of the current period.
  bool cancel_at_period_end = 4;
  // When the subscription will be canceled, if scheduled for cancellation.
  optional google.protobuf.Timestamp cancel_at = 5;
}

// GetAccountUsageResponse contains resource usage and subscription info.
message GetAccountUsageResponse {
  // Seat usage for the account.
  UsageItem seats = 1;
  // Invoice usage for the account.
  UsageItem invoices = 2;
  // Batch usage for the account.
  UsageItem batches = 3;
  // Sandbox usage for the account.
  UsageItem sandboxes = 4;
  // Subscription information, if the account has an active subscription.
  optional SubscriptionInfo subscription = 5;
}

// CreateBillingPortalSessionRequest is intentionally empty; the account is
// identified by the caller's identity metadata.
message CreateBillingPortalSessionRequest {}

// CreateBillingPortalSessionResponse contains the billing portal session URL.
message CreateBillingPortalSessionResponse {
  // The URL to redirect the user to the Stripe billing portal.
  string url = 1;
}

// GetProrationPreviewRequest carries the target plan ID to preview.
message GetProrationPreviewRequest {
  // The plan ID to preview switching to.
  string plan_id = 1;
}

// ProrationLineItem represents a single line item in the proration preview.
message ProrationLineItem {
  // Description of the line item.
  string description = 1;
  // Amount in cents (negative for credits).
  int64 amount = 2;
  // Whether this line item is a proration adjustment.
  bool is_proration = 3;
}

// ProrationPreview contains the full proration calculation for a plan change.
message ProrationPreview {
  // The credit amount in cents from unused time on the current plan.
  int64 credit_amount = 1;
  // The charge amount in cents for the new plan.
  int64 charge_amount = 2;
  // The net amount in cents (charge minus credit).
  int64 net_amount = 3;
  // The formatted net amount for display (e.g., "$49.00").
  string formatted_net_amount = 4;
  // Whether the net amount is a credit (negative).
  bool is_credit = 5;
  // The total invoice amount in cents that would be charged immediately.
  int64 total_invoice_amount = 6;
  // The formatted total invoice amount for display.
  string formatted_total_invoice_amount = 7;
  // The estimated monthly bill amount in cents after the change.
  int64 monthly_bill_amount = 8;
  // The formatted monthly bill amount for display.
  string formatted_monthly_bill_amount = 9;
  // Detailed line items from the proration calculation.
  repeated ProrationLineItem line_items = 10;
}

// GetProrationPreviewResponse contains the proration preview result.
message GetProrationPreviewResponse {
  // The proration preview details.
  ProrationPreview preview = 1;
}

// RequestEnterpriseUpgradeRequest is intentionally empty; the account is
// identified by the caller's identity metadata.
message RequestEnterpriseUpgradeRequest {}

// RequestEnterpriseUpgradeResponse indicates whether the enterprise inquiry
// was successfully sent.
message RequestEnterpriseUpgradeResponse {
  // Whether the inquiry was successfully dispatched.
  bool success = 1;
}

// EnsureBillingCustomerRequest is intentionally empty; the account is
// identified by the caller's identity metadata.
message EnsureBillingCustomerRequest {}

// EnsureBillingCustomerResponse contains the Stripe customer ID and whether
// a new customer was created.
message EnsureBillingCustomerResponse {
  // The Stripe customer ID for the account.
  string stripe_customer_id = 1;
  // Whether a new Stripe customer was created (false if one already existed).
  bool created = 2;
}

// SwitchPlanRequest carries the target plan to switch to.
message SwitchPlanRequest {
  // The target plan type ID to switch to.
  string plan_id = 1;
}

// SwitchPlanResponse indicates whether the switch was initiated and whether
// payment is required via a hosted checkout redirect.
message SwitchPlanResponse {
  // Whether the plan switch was initiated successfully.
  bool success = 1;
  // Whether payment is required (free→paid requires checkout).
  bool requires_payment = 2;
  // The Stripe hosted checkout URL, present when requires_payment is true.
  optional string checkout_url = 3;
}

// ConfirmPlanSwitchRequest carries the checkout session and plan details
// needed to finalize a free→paid upgrade after Stripe checkout.
message ConfirmPlanSwitchRequest {
  // The Stripe checkout session ID from the redirect.
  string checkout_session_id = 1;
  // The target plan type ID that was selected.
  string plan_id = 2;
}

// ConfirmPlanSwitchResponse indicates whether the plan switch was confirmed.
message ConfirmPlanSwitchResponse {
  // Whether the plan switch was confirmed successfully.
  bool success = 1;
}
