apiVersion: apps/v1
kind: Deployment
metadata:
    name: agent-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: agent-service
    template:
        metadata:
            labels:
                app: agent-service
        spec:
            containers:
                - name: agent-service
                  image: augno-api/agent-service
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "50m"
                      limits:
                          memory: "128Mi"
                          cpu: "200m"
                  env:
                      - name: OTEL_ENVIRONMENT
                        valueFrom:
                            configMapKeyRef:
                                key: PLATFORM
                                name: app-config
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: http://otel-collector:4318
                      - name: OTEL_EXPORTER_OTLP_PROTOCOL
                        value: http
                      - name: OTEL_EXPORTER_OTLP_INSECURE
                        value: "true"
                      - name: DB_URL
                        valueFrom:
                            secretKeyRef:
                                name: database-credentials
                                key: agent-service-uri
                      - name: RABBITMQ_URI
                        valueFrom:
                            secretKeyRef:
                                name: rabbitmq-credentials
                                key: uri
                      - name: CORE_SERVICE_URL
                        valueFrom:
                            configMapKeyRef:
                                key: CORE_SERVICE_URL
                                name: app-config
                      - name: CURSOR_HMAC_KEY
                        valueFrom:
                            secretKeyRef:
                                name: cursor-hmac-key
                                key: key
                      - name: STRIPE_SECRET_KEY
                        valueFrom:
                            secretKeyRef:
                                name: stripe-credentials
                                key: secret-key
                      - name: BILLING_SERVICE_URL
                        valueFrom:
                            configMapKeyRef:
                                key: BILLING_SERVICE_URL
                                name: app-config
                      - name: AWS_REGION
                        valueFrom:
                            configMapKeyRef:
                                key: AWS_REGION
                                name: app-config
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: aws-credentials
                                key: access-key-id
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: aws-credentials
                                key: secret-access-key
---
apiVersion: v1
kind: Service
metadata:
    name: agent-service
spec:
    selector:
        app: agent-service
    ports:
        - port: 9092
          name: grpc
          targetPort: 9092
    type: ClusterIP
