version: "2"
sql:
  - schema: "../../shared/db/migrations"
    queries: "internal/infrastructure/queries"
    engine: "mysql"
    gen:
      go:
        out: "internal/infrastructure/sqlc"
        package: "sqlc"
        emit_prepared_queries: false
        overrides:
          - column: "service_idempotency_key.response_body"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          - column: "message_outbox.headers"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          # job.results, job.error and job.errors are nullable json: they are empty
          # until the job settles. json.RawMessage cannot scan NULL — database/sql
          # special cases *[]byte but not named types of it — so a freshly created
          # job would fail to read back.
          - column: "job.results"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "job.error"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "job.errors"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "hubspot_sync_job.cursors"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "hubspot_sync_job.counts"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "hubspot_company_review.candidate_matches"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "portal_domain.dns_records"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"

