apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-service
  template:
    metadata:
      labels:
        app: platform-service
    spec:
      containers:
        - name: platform-service
          image: augno-api/platform-service
          ports:
            - containerPort: 9092
          readinessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: OTEL_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  key: PLATFORM
                  name: app-config
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: core-service-uri
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: uri
            - name: PLATFORM
              valueFrom:
                configMapKeyRef:
                  key: PLATFORM
                  name: app-config
            - name: CURSOR_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: cursor-hmac-key
                  key: key
---
apiVersion: v1
kind: Service
metadata:
  name: platform-service
spec:
  selector:
    app: platform-service
  ports:
    - port: 9092
      name: grpc
      targetPort: 9092
  type: ClusterIP
