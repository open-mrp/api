syntax = "proto3";

// Package core defines the gRPC contract for the core-service. It manages
// accounts, account-user relationships, roles, permissions, and cross-account
// business relationships (customer/supplier). The auth-service and api-gateway
// call these RPCs during credential validation to resolve the caller's
// authorization context.
package core;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "shared/proto/core;core";

service CoreService {
  // GetAccountContext returns the account's metadata needed for identity
  // resolution: whether it's a sandbox, its parent production account (if
  // sandbox), and its mode. Called during credential validation to determine
  // the data partition for the request.
  rpc GetAccountContext(GetAccountContextRequest) returns (GetAccountContextResponse);

  // GetUserAccountAccess checks whether a user has access to a specific
  // account and returns their role and permissions if they do. Called during
  // credential validation for user identities targeting a specific account.
  rpc GetUserAccountAccess(GetUserAccountAccessRequest) returns (GetUserAccountAccessResponse);

  // GetRolePermissions returns the full permission set for a given role.
  // Used to resolve API key permissions, since API keys reference a role
  // directly rather than going through an account-user mapping.
  rpc GetRolePermissions(GetRolePermissionsRequest) returns (GetRolePermissionsResponse);

  // GetAccountRelation checks whether an entity (user or API key) has a
  // cross-account business relationship (customer/supplier) with the target
  // account. Called during credential validation when the user is not a
  // direct member of the target account.
  rpc GetAccountRelation(GetAccountRelationRequest) returns (GetAccountRelationResponse);

  // MarkAccountUserUsed updates the last_used_at timestamp on an
  // account-user record. Called after successful credential validation to
  // track which accounts a user actively uses (for account switching UI).
  rpc MarkAccountUserUsed(MarkAccountUserUsedRequest) returns (google.protobuf.Empty);

  // ListUserAccountAffiliations returns all accounts a user has access to,
  // including their role in each. Used by the account switcher in the UI
  // and to resolve the user's default account on login.
  rpc ListUserAccountAffiliations(ListUserAccountAffiliationsRequest) returns (ListUserAccountAffiliationsResponse);

  // GetSandboxAccountByOwner returns the sandbox account ID for a given
  // owner (production) account. Used by the doc API key flow to resolve
  // the sandbox where documentation keys are scoped.
  rpc GetSandboxAccountByOwner(GetSandboxAccountByOwnerRequest) returns (GetSandboxAccountByOwnerResponse);

  // GetAdminRole returns the admin role ID.
  // Used by the doc API key flow to assign the admin role to generated keys.
  rpc GetAdminRole(google.protobuf.Empty) returns (GetAdminRoleResponse);

  // ListSandboxAccounts returns a paginated list of sandbox accounts
  // owned by a production account. Used by the GET /v1/sandboxes endpoint.
  rpc ListSandboxAccounts(ListSandboxAccountsRequest) returns (ListSandboxAccountsResponse);

  // CreateSandbox creates a new sandbox account for the caller's production
  // account. Enforces a per-account sandbox limit. Used by the
  // POST /v1/core/sandboxes endpoint.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // GetSandbox returns a single sandbox account by its type ID.
  // Used by the GET /v1/core/sandboxes/{id} endpoint.
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);

  // DeleteSandbox deletes a sandbox account and its underlying account record.
  // Rejects deletion if only one sandbox remains. Account-scoped data is purged
  // asynchronously via RabbitMQ. Used by the DELETE /v1/core/sandboxes/{id} endpoint.
  rpc DeleteSandbox(DeleteSandboxRequest) returns (google.protobuf.Empty);

  // UpdateAccountSubscription updates the subscription-related fields on an
  // account (plan, status, Stripe subscription ID, period end). Called by
  // billing-service when processing Stripe webhook events.
  rpc UpdateAccountSubscription(UpdateAccountSubscriptionRequest) returns (google.protobuf.Empty);

  // ClearAccountStripeCustomer removes all Stripe-related fields from an
  // account. Called when a Stripe customer.deleted event is received.
  rpc ClearAccountStripeCustomer(ClearAccountStripeCustomerRequest) returns (google.protobuf.Empty);

  // GetAccountByStripeCustomerID resolves an account from a Stripe customer ID.
  // Used by billing-service to map Stripe events to internal accounts.
  rpc GetAccountByStripeCustomerID(GetAccountByStripeCustomerIDRequest) returns (GetAccountByStripeCustomerIDResponse);

  // CompleteRegistration creates the production account, sandbox account, roles,
  // permissions, and account-user records for a newly registered user. Called by
  // auth-service after payment is confirmed.
  rpc CompleteRegistration(CompleteRegistrationRequest) returns (CompleteRegistrationResponse);

  // ListUnits returns a paginated list of units visible to the caller's
  // account, including both account-specific and global (system) units.
  // Supports filtering by dimension type, unit group membership, and
  // search by name/abbreviation. Used by the GET /v1/core/units endpoint.
  rpc ListUnits(ListUnitsRequest) returns (ListUnitsResponse);

}

// GetAccountContextRequest identifies the account to look up.
message GetAccountContextRequest {
  // AccountID is the prefixed account ID (e.g. "acct_abc123").
  string account_id = 1;
}

// GetAccountContextResponse contains the account's partition metadata.
message GetAccountContextResponse {
  // IsSandbox is true when the account is a sandbox (test) account.
  bool is_sandbox = 1;
  // OwnerAccountID is the parent production account ID when this is a
  // sandbox account. Absent for production accounts.
  optional string owner_account_id = 2;
  // AccountMode is the resolved mode (production or sandbox).
  AccountMode account_mode = 3;
  // SubscriptionStatus is the Stripe subscription status for the account
  // (or its owner, if this is a sandbox). Absent for free-tier accounts.
  optional string subscription_status = 4;
}

// AccountMode distinguishes between production and sandbox data partitions.
enum AccountMode {
  ACCOUNT_MODE_UNSPECIFIED = 0;
  ACCOUNT_MODE_PRODUCTION = 1;
  ACCOUNT_MODE_SANDBOX = 2;
}

// GetUserAccountAccessRequest identifies the user-account pair to check.
message GetUserAccountAccessRequest {
  // UserID is the prefixed user ID (e.g. "usr_abc123").
  string user_id = 1;
  // AccountID is the prefixed account ID to check access for.
  string account_id = 2;
}

// GetUserAccountAccessResponse indicates whether the user has access and,
// if so, provides their role and permissions within that account.
message GetUserAccountAccessResponse {
  // HasAccess is true when an active account-user record exists.
  bool has_access = 1;
  // Access contains the user's role and permissions. Present only when
  // has_access is true.
  optional AccountUserAccess access = 2;
}

// AccountUserAccess represents a user's membership and authorization
// within a specific account.
message AccountUserAccess {
  // AccountUserID is the unique ID of the account-user join record.
  string account_user_id = 1;
  // AccountID is the account this access record belongs to.
  string account_id = 2;
  // RoleID is the user's role within this account.
  optional string role_id = 3;
  // RoleTypeCode is the role's type code (e.g. "owner", "admin", "member").
  optional string role_type_code = 4;
  // Permissions is the resolved permission set. Keys are permission codes
  // (e.g. "invoices.create"), values are always true.
  map<string, bool> permissions = 5;
  // LastUsedAt is the most recent time the user accessed this account.
  optional google.protobuf.Timestamp last_used_at = 6;
}

// GetAccountRelationRequest looks up a cross-account business relationship
// between an entity and a target account. The entity can be identified by
// either user_id or api_key_id.
message GetAccountRelationRequest {
  // OwnerAccountID is the target account to check the relationship against.
  string owner_account_id = 1;
  oneof lookup {
    // UserID identifies the entity as a user.
    string user_id = 2;
    // ApiKeyId identifies the entity as an API key (database row ID).
    int64 api_key_id = 3;
  }
}

// GetAccountRelationResponse indicates whether a business relationship
// exists and provides its details.
message GetAccountRelationResponse {
  // HasRelation is true when a customer or supplier relationship exists.
  bool has_relation = 1;
  // Relation contains the relationship details. Present only when
  // has_relation is true.
  optional AccountRelation relation = 2;
}

// AccountRelation represents a cross-account business relationship
// (customer or supplier) between two accounts.
message AccountRelation {
  // ID is the unique identifier of the relationship record.
  string id = 1;
  // CounterpartyAccountID is the account on the other side of the
  // relationship (the entity's "home" account).
  string counterparty_account_id = 2;
  // RoleCode is the relationship type: "customer" or "supplier".
  string role_code = 3;
}

// GetRolePermissionsRequest identifies the role to look up.
message GetRolePermissionsRequest {
  // RoleID is the prefixed role ID (e.g. "role_abc123").
  string role_id = 1;
}

// GetRolePermissionsResponse contains the full permission set for a role.
message GetRolePermissionsResponse {
  // Permissions maps permission codes to granted status. Keys are
  // permission codes (e.g. "invoices.create"), values are always true.
  map<string, bool> permissions = 1;
}

// MarkAccountUserUsedRequest identifies the account-user record to touch.
message MarkAccountUserUsedRequest {
  // AccountUserID is the unique ID of the account-user join record
  // whose last_used_at should be updated to now.
  string account_user_id = 1;
}

// ListUserAccountAffiliationsRequest identifies the user whose account
// memberships should be listed.
message ListUserAccountAffiliationsRequest {
  // UserID is the prefixed user ID (e.g. "usr_abc123").
  string user_id = 1;
}

// ListUserAccountAffiliationsResponse contains all accounts the user is
// a member of, plus which account they used most recently.
message ListUserAccountAffiliationsResponse {
  // Affiliations is the list of all accounts the user has access to.
  repeated AccountAffiliation affiliations = 1;
  // LastUsedAccountID is the account the user accessed most recently,
  // used as the default selection in account switching UI. Absent if
  // the user has never accessed any account.
  optional string last_used_account_id = 2;
}

// AccountAffiliation represents one account a user is a member of,
// including their role and last access time.
message AccountAffiliation {
  // AccountID is the prefixed account ID.
  string account_id = 1;
  // AccountName is the account's display name.
  string account_name = 2;
  // RoleID is the user's role within this account.
  string role_id = 3;
  // RoleName is the human-readable role name (e.g. "Owner", "Member").
  string role_name = 4;
  // LastUsedAt is when the user last accessed this account. Absent if
  // the user has never explicitly selected this account.
  optional google.protobuf.Timestamp last_used_at = 5;
}

// CompleteRegistrationRequest carries the data needed to finalize a new
// user's account setup after payment (Stripe) is confirmed. Creates the
// production account, sandbox account, and initial role assignments.
message CompleteRegistrationRequest {
  // UserID is the newly registered user's ID.
  string user_id = 1;
  // PlanCode identifies the subscription plan (e.g. "starter", "pro").
  string plan_code = 2;
  // StripeCustomerID is the Stripe customer ID created during checkout.
  string stripe_customer_id = 3;
  // StripeSubscriptionID is the Stripe subscription ID, absent for
  // free-tier plans that don't create a subscription.
  optional string stripe_subscription_id = 4;
  // AccountData contains the business details provided during onboarding.
  RegistrationAccountData account_data = 5;
}

// RegistrationAccountData holds the business profile information
// collected during onboarding.
message RegistrationAccountData {
  // AccountName is the business or organization name.
  string account_name = 1;
  // BusinessAddress is the business's physical address, optional during
  // initial registration.
  optional RegistrationAddress business_address = 2;
}

// RegistrationAddress is a structured postal address. All fields are
// optional to accommodate varying address formats across countries.
message RegistrationAddress {
  optional string line1 = 1;
  optional string line2 = 2;
  optional string city = 3;
  optional string state = 4;
  optional string postal_code = 5;
  optional string country = 6;
}

// CompleteRegistrationResponse returns the IDs of the newly created
// accounts so the caller can redirect the user to their new workspace.
message CompleteRegistrationResponse {
  // AccountID is the new production account's prefixed ID.
  string account_id = 1;
  // SandboxID is the new sandbox account's prefixed ID.
  string sandbox_id = 2;
}

// GetSandboxAccountByOwnerRequest identifies the production account whose
// sandbox should be looked up.
message GetSandboxAccountByOwnerRequest {
  // OwnerAccountID is the production account's prefixed ID.
  string owner_account_id = 1;
}

// GetSandboxAccountByOwnerResponse contains the sandbox account ID.
message GetSandboxAccountByOwnerResponse {
  // SandboxAccountID is the sandbox account's prefixed ID.
  string sandbox_account_id = 1;
}

// GetAdminRoleResponse contains the admin role ID.
message GetAdminRoleResponse {
  // RoleID is the admin role's prefixed ID.
  string role_id = 1;
}

// ListSandboxAccountsRequest carries pagination parameters for listing
// sandbox accounts owned by the caller's production account.
message ListSandboxAccountsRequest {
  // Cursor for fetching the next page, from a previous response's
  // next_cursor field. Absent on the first request.
  optional string cursor = 1;
  // Maximum number of results to return per page.
  int32 limit = 2;
}

// PageInfo contains cursor-based pagination metadata.
message PageInfo {
  optional string next_cursor = 1;
  optional string prev_cursor = 2;
  bool has_next_page = 3;
  bool has_prev_page = 4;
}

// ListSandboxAccountsResponse contains a page of sandbox accounts
// with pagination metadata.
message ListSandboxAccountsResponse {
  // The sandbox accounts in this page.
  repeated SandboxInfo sandboxes = 1;
  // Pagination metadata.
  PageInfo page_info = 4;
}

// SandboxMode controls whether a new sandbox is created empty or
// pre-populated with tutorial seed data.
enum SandboxMode {
  SANDBOX_MODE_UNSPECIFIED = 0; // defaults to blank
  SANDBOX_MODE_BLANK = 1;
  SANDBOX_MODE_SEEDED = 2;
}

// CreateSandboxRequest carries the data needed to create a new sandbox account.
message CreateSandboxRequest {
  // The display name for the new sandbox.
  string name = 1;
  // Controls whether the sandbox is blank or seeded with tutorial data.
  SandboxMode mode = 2;
}

// CreateSandboxResponse returns the newly created sandbox's metadata.
message CreateSandboxResponse {
  // The created sandbox account info.
  SandboxInfo sandbox = 1;
}

// GetSandboxRequest identifies the sandbox to retrieve by its type ID.
message GetSandboxRequest {
  // The sandbox's prefixed type ID (e.g. "sbac_abc123").
  string id = 1;
}

// GetSandboxResponse contains the requested sandbox's metadata.
message GetSandboxResponse {
  // The sandbox account info.
  SandboxInfo sandbox = 1;
}

// DeleteSandboxRequest identifies the sandbox to delete by its type ID.
message DeleteSandboxRequest {
  // The sandbox's prefixed type ID (e.g. "sbac_abc123").
  string id = 1;
}

// SandboxInfo represents a sandbox account's metadata.
message SandboxInfo {
  // The sandbox's prefixed type ID (e.g. "sbac_abc123").
  string id = 1;
  // The sandbox's display name (inherited from the account).
  string name = 2;
  // The underlying account ID for this sandbox.
  string account_id = 3;
  // When the sandbox was created.
  google.protobuf.Timestamp created_at = 4;
  // When the sandbox was last updated.
  google.protobuf.Timestamp updated_at = 5;
}

// UpdateAccountSubscriptionRequest carries the fields to update on an
// account's subscription. Optional fields are cleared when absent.
message UpdateAccountSubscriptionRequest {
  string account_id = 1;
  optional string subscription_status = 2;
  string plan_code = 3;
  optional string stripe_subscription_id = 4;
  optional google.protobuf.Timestamp current_period_end = 5;
  // Optional Stripe customer ID to persist when upgrading a free account.
  optional string stripe_customer_id = 6;
}

// ClearAccountStripeCustomerRequest identifies the account whose Stripe
// customer data should be removed.
message ClearAccountStripeCustomerRequest {
  string account_id = 1;
}

// GetAccountByStripeCustomerIDRequest identifies a Stripe customer.
message GetAccountByStripeCustomerIDRequest {
  string stripe_customer_id = 1;
}

// GetAccountByStripeCustomerIDResponse returns the matched account.
message GetAccountByStripeCustomerIDResponse {
  string account_id = 1;
  string plan_code = 2;
}

// ListUnitsRequest carries pagination and filter parameters for listing
// units visible to the caller's account.
message ListUnitsRequest {
  // Cursor for fetching the next page, from a previous response's
  // next_cursor field. Absent on the first request.
  optional string cursor = 1;
  // Maximum number of results to return per page.
  int32 limit = 2;
  // Optional search query to filter units by name or abbreviation.
  optional string query = 3;
  // Optional filter by unit dimension code (e.g. "mass", "quantity").
  optional string type = 4;
  // Optional filter by unit group membership. Only units belonging to
  // at least one of these groups are returned.
  repeated string unit_group_ids = 5;
}

// ListUnitsResponse contains a page of units with pagination metadata.
message ListUnitsResponse {
  // The units in this page.
  repeated UnitInfo units = 1;
  // Pagination metadata.
  PageInfo page_info = 2;
}

// UnitInfo represents a unit of measurement.
message UnitInfo {
  // The unit's unique identifier.
  string id = 1;
  // The display name (e.g. "Gram", "Kilogram").
  string name = 2;
  // The short abbreviation (e.g. "g", "kg").
  string abbreviation = 3;
  // The unit dimension code (e.g. "mass", "quantity").
  string type = 4;
  // Conversion ratio numerator relative to the base unit, as a decimal string.
  string ratio_numerator = 5;
  // Conversion ratio denominator relative to the base unit, as a decimal string.
  string ratio_denominator = 6;
  // Conversion offset numerator, as a decimal string.
  string offset_numerator = 7;
  // Conversion offset denominator, as a decimal string.
  string offset_denominator = 8;
  // Whether this unit is the base unit for its dimension.
  bool is_base_unit = 9;
  // Whether this unit belongs to the requesting account (true) or is a
  // system/global unit (false).
  bool is_internal = 10;
  // When the unit was created.
  google.protobuf.Timestamp created_at = 11;
  // When the unit was last updated.
  google.protobuf.Timestamp updated_at = 12;
}

