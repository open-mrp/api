name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  terraform:
    name: Terraform Apply
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/production/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: |
            .terraform/providers
            .terraform.lock.hcl
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  build-push:
    name: Build and Push
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [api-gateway, auth-service, core-service, platform-service, notification-service, billing-service]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/production/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:${{ needs.release-please.outputs.tag_name }}
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: [release-please, terraform, build-push]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      needs.terraform.result == 'success' &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Deploy to EKS
        run: ./scripts/deploy.sh
        env:
          AWS_REGION: "us-east-2"
          CLUSTER_NAME: "augno-prod"
          IMAGE_TAG: ${{ needs.release-please.outputs.tag_name }}

  publish-openapi-specs:
    name: Publish OpenAPI Specs
    needs: [release-please, deploy]
    if: needs.release-please.outputs.release_created == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Read API Version
        id: api-version
        run: |
          API_VERSION=$(go run ./cmd/print-version)
          echo "api_version=$API_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate OpenAPI Specs
        run: |
          make install-cd-tools
          make gen-openapi-specs

      - name: Upload Public Spec to S3
        run: |
          aws s3 cp specs/public_openapi_spec.json s3://augno-public-openapi-specs/openapi.json
          aws s3 cp specs/public_openapi_spec.json s3://augno-public-openapi-specs/${{ steps.api-version.outputs.api_version }}.json

      - name: Upload Private Spec to S3
        run: |
          aws s3 cp specs/internal_openapi_spec.json s3://augno-private-openapi-specs/openapi.json
          aws s3 cp specs/internal_openapi_spec.json s3://augno-private-openapi-specs/${{ steps.api-version.outputs.api_version }}.json

      - name: Upload to Stainless
        uses: stainless-api/upload-openapi-spec-action@v1
        with:
          input_path: specs/public_openapi_spec.json
          project_name: augno
          stainless_api_key: ${{ secrets.STAINLESS_API_KEY }}
