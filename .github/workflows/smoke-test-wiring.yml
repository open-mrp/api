name: Smoke Test Wiring

# TEMPORARY. Verifies the two links the repository migration changed and nothing has exercised yet:
# the OIDC subject this repo now emits, and whether INFRA_DISPATCH_TOKEN can reach augno/infra.
# Deploys nothing, mutates nothing, and prints no secret. Delete once it has passed.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  wiring:
    name: Check Wiring
    runs-on: ubuntu-latest
    steps:
      - name: OIDC subject
        run: |
          set -euo pipefail
          tok=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$tok")
          payload=$(tr '_-' '/+' <<<"$payload")
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims=$(base64 -d <<<"$payload")
          sub=$(jq -r .sub <<<"$claims")
          echo "sub              = $sub"
          echo "job_workflow_ref = $(jq -r .job_workflow_ref <<<"$claims")"
          expected="repo:Augno@100289138/api@1341932407:ref:refs/heads/main"
          if [ "$sub" != "$expected" ]; then
            echo "::error::subject is '$sub', but the IAM trust policies pin '$expected'"
            exit 1
          fi
          echo "Subject matches what the trust policies pin."

      - name: INFRA_DISPATCH_TOKEN reaches augno/infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::INFRA_DISPATCH_TOKEN is empty — a release would fail at the deploy dispatch"
            exit 1
          fi
          # Reading the workflow proves both repo access and that deploy.yml is dispatchable. The
          # token needs actions:write to dispatch; actions:read is enough to see it, so also confirm
          # the write scope is present rather than discovering it mid-release.
          gh api repos/Augno/infra/actions/workflows/deploy.yml --jq '"deploy.yml: \(.state)"'
          perm=$(gh api repos/Augno/infra --jq '.permissions.push // false')
          echo "push permission on augno/infra: $perm"
          echo "Token reaches augno/infra."
