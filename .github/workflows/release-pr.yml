name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Create or Update Release PR
    runs-on: ubuntu-latest
    # Skip if this push is from merging the release PR
    if: ${{ !contains(github.event.head_commit.message, 'release/next') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read current version
        id: version
        run: |
          VERSION=$(go run ./cmd/print-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Find last release tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match="v[0-9]*.[0-9]*.[a-z]*" 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(./scripts/generate-changelog.sh "${{ steps.prev-tag.outputs.prev_tag }}" "${{ steps.version.outputs.version }}")
          echo "$CHANGELOG" > /tmp/changelog-entry.md
          {
            echo "changelog<<CHANGELOG_DELIMITER"
            echo "$CHANGELOG"
            echo "CHANGELOG_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        run: ./scripts/update-changelog.sh < /tmp/changelog-entry.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: release/next
          commit-message: "chore: update CHANGELOG.md for ${{ steps.version.outputs.version }}"
          title: "chore(main): release ${{ steps.version.outputs.version }}"
          body: |
            ## Release ${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}
          labels: "autorelease: pending"
          delete-branch: false
