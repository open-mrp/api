message AnalyzeDeliveryPerformanceRequest {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
  string granularity = 3;
  repeated string customer_ids = 4;
  repeated string customer_group_ids = 5;
  repeated string product_line_ids = 6;
  repeated string sales_rep_ids = 7;
}

// DeliveryPerformanceProto is one period's delivery picture, or the whole window's.
// Ratios are absent rather than zero when nothing was due.
message DeliveryPerformanceProto {
  optional google.protobuf.Timestamp period_start = 1;
  int32 committed_order_count = 2;
  int32 shipped_order_count = 3;
  int32 on_time_order_count = 4;
  int32 on_time_in_full_count = 5;
  int32 late_order_count = 6;
  int32 not_yet_shipped_count = 7;
  optional double on_time_pct = 8;
  optional double on_time_in_full_pct = 9;
  optional double average_days_late = 10;
  optional double average_lead_time_days = 11;
  optional double average_committed_lead_time_days = 12;
}

message DeliveryBacklogBucketProto {
  string label = 1;
  int32 min_days_late = 2;
  int32 max_days_late = 3;
  int32 order_count = 4;
  double units = 5;
}

// DeliveryLatenessBucketProto is one band of how far the window's misses missed by.
message DeliveryLatenessBucketProto {
  string label = 1;
  int32 min_days_late = 2;
  int32 max_days_late = 3;
  int32 order_count = 4;
  int32 shipped_count = 5;
  double units = 6;
}

// DeliveryBreakdownProto is delivery performance for one slice of the order book.
message DeliveryBreakdownProto {
  string key = 1;
  string label = 2;
  DeliveryPerformanceProto performance = 3;
}

message AnalyzeDeliveryPerformanceResponse {
  DeliveryPerformanceProto overall = 1;
  repeated DeliveryPerformanceProto periods = 2;
  repeated DeliveryBacklogBucketProto backlog = 3;
  int32 uncommitted_order_count = 4;
  repeated DeliveryLatenessBucketProto lateness = 5;
  repeated DeliveryBreakdownProto by_customer = 6;
  repeated DeliveryBreakdownProto by_customer_group = 7;
  repeated DeliveryBreakdownProto by_product_line = 8;
  repeated DeliveryBreakdownProto by_commitment_source = 9;
}

message AnalyzeScheduleAttainmentRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string group_by = 3;
  repeated string machine_ids = 4;
  repeated string department_ids = 5;
}

// AttainmentBucketInfo is one row of the breakdown. The ratios are optional because a
// bucket with nothing planned has no attainment, which is not the same as zero.
message AttainmentBucketInfo {
  string key = 1;
  string label = 2;
  optional google.protobuf.Timestamp week_start_date = 3;
  double planned_quantity = 4;
  double actual_quantity = 5;
  double matched_quantity = 6;
  double waste_quantity = 7;
  double unplanned_quantity = 8;
  double planned_run_hours = 9;
  int64 planned_lines = 10;
  int64 batch_count = 11;
  optional double attainment_pct = 12;
  optional double output_ratio_pct = 13;
}

message FrozenAdherenceInfo {
  string schedule_id = 1;
  int32 version = 2;
  int64 frozen_line_count = 3;
  double frozen_planned_quantity = 4;
  int64 deviated_lines = 5;
  int64 added_lines = 6;
  double abs_delta_units = 7;
  optional double line_adherence_pct = 8;
  optional double units_adherence_pct = 9;
  optional google.protobuf.Timestamp frozen_through_date = 10;
  int64 off_plan_lines = 11;
  double off_plan_quantity = 12;
}

message AnalyzeScheduleAttainmentResponse {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string group_by = 3;
  repeated string baseline_schedule_ids = 4;
  repeated AttainmentBucketInfo buckets = 5;
  AttainmentBucketInfo totals = 6;
  repeated FrozenAdherenceInfo frozen_adherence = 7;
  bool has_baseline = 8;
  int64 scheduled_machine_count = 9;
}
