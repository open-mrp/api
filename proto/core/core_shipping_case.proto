syntax = "proto3";

// Package core defines the gRPC service for shipping case management.
package core;

import "google/protobuf/timestamp.proto";

option go_package = "shared/proto/core;core";

service CoreShippingCaseService {
  // GetShippingCase returns a single shipping case by its ID.
  rpc GetShippingCase(GetShippingCaseRequest) returns (GetShippingCaseResponse);

  // UpdateShippingCase updates an existing shipping case.
  rpc UpdateShippingCase(UpdateShippingCaseRequest) returns (UpdateShippingCaseResponse);

  // AdminUpdateShippingCaseTracking corrects the tracking number of a case that has already shipped.
  rpc AdminUpdateShippingCaseTracking(AdminUpdateShippingCaseTrackingRequest) returns (AdminUpdateShippingCaseTrackingResponse);

  // DeleteShippingCase deletes a shipping case.
  rpc DeleteShippingCase(DeleteShippingCaseRequest) returns (DeleteShippingCaseResponse);

  // GetShippingCaseLabel returns a presigned URL for the shipping case's label.
  rpc GetShippingCaseLabel(GetShippingCaseLabelRequest) returns (GetShippingCaseLabelResponse);
}

// ShippingCaseInfo represents a shipping case resource.
message ShippingCaseInfo {
  string id = 1;
  string number = 2;
  optional string sscc = 3;
  optional string tracking_number = 4;
  optional google.protobuf.Timestamp shipped_at = 5;
  string shipment_id = 6;
  optional string shipment_number = 38;
  optional string shipment_status_code = 39;
  optional string shipment_status_name = 40;
  optional google.protobuf.Timestamp shipment_created_at = 41;
  optional google.protobuf.Timestamp shipment_updated_at = 42;
  string carrier_id = 7;
  string carrier_name = 8;
  optional bool carrier_is_portal_enabled = 23;
  optional google.protobuf.Timestamp carrier_created_at = 24;
  optional google.protobuf.Timestamp carrier_updated_at = 25;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Freight amount quantity fields
  string freight_amount_id = 11;
  string freight_amount_value = 12;
  string freight_amount_unit_id = 13;
  string freight_amount_unit_name = 14;
  string freight_amount_unit_abbreviation = 15;
  string freight_amount_unit_type = 16;
  string freight_amount_unit_ratio_numerator = 26;
  string freight_amount_unit_ratio_denominator = 27;
  string freight_amount_unit_offset_numerator = 28;
  string freight_amount_unit_offset_denominator = 29;
  google.protobuf.Timestamp freight_amount_unit_created_at = 30;
  google.protobuf.Timestamp freight_amount_unit_updated_at = 31;
  // Freight weight quantity fields
  string freight_weight_id = 17;
  string freight_weight_value = 18;
  string freight_weight_unit_id = 19;
  string freight_weight_unit_name = 20;
  string freight_weight_unit_abbreviation = 21;
  string freight_weight_unit_type = 22;
  string freight_weight_unit_ratio_numerator = 32;
  string freight_weight_unit_ratio_denominator = 33;
  string freight_weight_unit_offset_numerator = 34;
  string freight_weight_unit_offset_denominator = 35;
  google.protobuf.Timestamp freight_weight_unit_created_at = 36;
  google.protobuf.Timestamp freight_weight_unit_updated_at = 37;
}

// Get shipping case
message GetShippingCaseRequest {
  string id = 1;
}

message GetShippingCaseResponse {
  ShippingCaseInfo shipping_case = 1;
}

// Update shipping case
message UpdateShippingCaseRequest {
  string id = 1;
  optional string tracking_number = 2;
  optional string freight_amount_value = 3;
  optional string freight_amount_unit_id = 4;
  optional string freight_weight_value = 5;
  optional string freight_weight_unit_id = 6;
}

message UpdateShippingCaseResponse {
  ShippingCaseInfo shipping_case = 1;
}

// Admin update shipping case tracking
message AdminUpdateShippingCaseTrackingRequest {
  string id = 1;
  optional string tracking_number = 2;
}

message AdminUpdateShippingCaseTrackingResponse {
  ShippingCaseInfo shipping_case = 1;
}

// Delete shipping case
message DeleteShippingCaseRequest {
  string id = 1;
}

message DeleteShippingCaseResponse {}

// Get shipping case label
message GetShippingCaseLabelRequest {
  string id = 1;
}

message GetShippingCaseLabelResponse {
  optional string url = 1;
}
