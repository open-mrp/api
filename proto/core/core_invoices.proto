message ProductLineInfo {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string notes = 4;
  string commission_policy = 5;
  string freight_policy = 6;
  string unit_group_id = 7;
  optional string account_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional ItemCategoryUnitGroupInfo unit_group = 11;
  // The lot products in this line are made in, as a quantity: the number and its unit are
  // one value, since 60 pairs and 60 eaches are different lots.
  optional ProductLineDefaultLotInfo default_lot = 12;
  // How products in this line are produced when they do not say for themselves.
  optional string fulfillment_policy_code = 13;
}

message ProductLineDefaultLotInfo {
  string id = 1;
  string value = 2;
  string unit_id = 3;
}
