apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: openmrp-api/billing-service
          ports:
            - containerPort: 9092
          readinessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          env:
            - name: OTEL_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  key: PLATFORM
                  name: app-config
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: core-service-uri
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: uri
            - name: PLATFORM
              valueFrom:
                configMapKeyRef:
                  key: PLATFORM
                  name: app-config
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-credentials
                  key: webhook-secret
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-credentials
                  key: secret-key
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-credentials
                  key: publishable-key
            - name: CORE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  key: CORE_SERVICE_URL
                  name: app-config
            - name: CURSOR_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: cursor-hmac-key
                  key: key
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  key: FRONTEND_URL
                  name: app-config
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  key: NOTIFICATION_SERVICE_URL
                  name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
spec:
  selector:
    app: billing-service
  ports:
    - port: 9092
      name: grpc
      targetPort: 9092
  type: ClusterIP
