apiVersion: apps/v1
kind: Deployment
metadata:
    name: jaeger
spec:
    replicas: 1
    selector:
        matchLabels:
            app: jaeger
    template:
        metadata:
            labels:
                app: jaeger
        spec:
            containers:
                - name: jaeger
                  image: jaegertracing/all-in-one:1.64.0
                  env:
                    - name: QUERY_UI_CONFIG
                      value: /etc/jaeger/jaeger-ui.json
                    # Cap the in-memory trace store. all-in-one keeps every span in RAM with
                    # no default limit, so a request storm (or just a long-running dev session)
                    # grows it unbounded until it exhausts the whole minikube VM. 50k traces is
                    # plenty for local debugging and bounds RAM to a few hundred MB.
                    - name: MEMORY_MAX_TRACES
                      value: "50000"
                  resources:
                    requests:
                      memory: 256Mi
                    # Hard ceiling so a trace burst OOM-kills (and restarts) only Jaeger
                    # instead of taking down every service on the node.
                    limits:
                      memory: 1Gi
                  ports:
                      - containerPort: 16686
                        name: ui
                      - containerPort: 4317
                        name: otlp-grpc
                      - containerPort: 4318
                        name: otlp-http
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 16686
                      initialDelaySeconds: 10
                      periodSeconds: 15
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 16686
                      initialDelaySeconds: 30
                      periodSeconds: 30
                  volumeMounts:
                    - name: jaeger-ui-config
                      mountPath: /etc/jaeger/jaeger-ui.json
                      subPath: jaeger-ui.json
            volumes:
                - name: jaeger-ui-config
                  configMap:
                    name: jaeger-ui-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-ui-config
data:
  jaeger-ui.json: |
    {
      "theme": "light"
    }
---
apiVersion: v1
kind: Service
metadata:
    name: jaeger
spec:
    type: ClusterIP
    selector:
        app: jaeger
    ports:
        - name: ui
          port: 16686
          targetPort: 16686
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
        - name: otlp-http
          port: 4318
          targetPort: 4318
