version: "2"
sql:
  - schema: "../../shared/db/migrations"
    queries: "internal/infrastructure/queries"
    engine: "mysql"
    gen:
      go:
        out: "internal/infrastructure/sqlc"
        package: "sqlc"
        emit_prepared_queries: false
        overrides:
          - column: "idempotency_key.request_params"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "idempotency_key.response_body"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "idempotency_key.response_headers"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "request_log.query_json"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "request_log.request_body_json"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "request_log.response_body_json"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "message_outbox.headers"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          # target_account_id is nullable until the backfill + non-null migration
          # land. Pin it so the equality predicate in the actor-or-target OR scope
          # can't trip sqlc into inferring NOT NULL — which would panic scanning
          # legacy NULL rows that match the scope via account_id.
          - column: "audit_event.target_account_id"
            go_type: "database/sql.NullString"
          - column: "audit_event.changes"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
          - column: "audit_event.metadata"
            go_type:
              import: "github.com/augno/api/shared/db"
              type: "NullableRawMessage"
