syntax = "proto3";

// Package core defines additional gRPC services for the core-service.
// CoreProductionScheduleService exposes the production scheduling solver.
package core;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "core/core.proto";
import "core/core_patch.proto";
import "core/core_production_run.proto";

option go_package = "shared/proto/core;core";

service CoreProductionScheduleService {
  // PreviewProductionSchedule runs the solver and returns the plan without persisting it.
  rpc PreviewProductionSchedule(PreviewProductionScheduleRequest) returns (PreviewProductionScheduleResponse);

  // GenerateProductionSchedule solves and persists a new draft version.
  rpc GenerateProductionSchedule(GenerateProductionScheduleRequest) returns (GenerateProductionScheduleResponse);

  // PreviewRegenerateProductionSchedule says what a re-solve would change about a draft,
  // without changing it.
  rpc PreviewRegenerateProductionSchedule(RegenerateProductionScheduleRequest) returns (PreviewRegenerateProductionScheduleResponse);

  // RegenerateProductionSchedule re-solves a draft in place, keeping its version number.
  rpc RegenerateProductionSchedule(RegenerateProductionScheduleRequest) returns (RegenerateProductionScheduleResponse);

  // GetProductionSchedule returns one version by ID.
  rpc GetProductionSchedule(GetProductionScheduleRequest) returns (GetProductionScheduleResponse);

  // GetCurrentProductionSchedule returns the published version covering today.
  rpc GetCurrentProductionSchedule(GetCurrentProductionScheduleRequest) returns (GetProductionScheduleResponse);

  // ListProductionSchedules returns a paginated list of versions.
  rpc ListProductionSchedules(ListProductionSchedulesRequest) returns (ListProductionSchedulesResponse);

  // ListProductionScheduleLines returns the planned campaigns for a version.
  rpc ListProductionScheduleLines(ListProductionScheduleLinesRequest) returns (ListProductionScheduleLinesResponse);

  // ListProductionScheduleItemPolicies returns the per-item policy snapshot for a version.
  rpc ListProductionScheduleItemPolicies(ListProductionScheduleItemPoliciesRequest) returns (ListProductionScheduleItemPoliciesResponse);

  // ListProductionScheduleFinishedPolicies returns the per-finished-SKU decomposition of
  // the pooled constraint buffers.
  rpc ListProductionScheduleFinishedPolicies(ListProductionScheduleFinishedPoliciesRequest) returns (ListProductionScheduleFinishedPoliciesResponse);

  // ListProductionScheduleFinishingLines returns stage two: how many of which finished
  // good to make from the knitted parts, week by week.
  rpc ListProductionScheduleFinishingLines(ListProductionScheduleFinishingLinesRequest) returns (ListProductionScheduleFinishingLinesResponse);

  // GetProductionScheduleSettings returns the merchant's planning assumptions.
  rpc GetProductionScheduleSettings(GetProductionScheduleSettingsRequest) returns (GetProductionScheduleSettingsResponse);

  // UpdateProductionScheduleSettings replaces the merchant's planning assumptions.
  rpc UpdateProductionScheduleSettings(UpdateProductionScheduleSettingsRequest) returns (GetProductionScheduleSettingsResponse);

  // ListProductionScheduleResourceSettings returns per-resource overrides.
  rpc ListProductionScheduleResourceSettings(ListProductionScheduleResourceSettingsRequest) returns (ListProductionScheduleResourceSettingsResponse);

  // UpsertProductionScheduleResourceSetting writes one per-resource override.
  rpc UpsertProductionScheduleResourceSetting(UpsertProductionScheduleResourceSettingRequest) returns (UpsertProductionScheduleResourceSettingResponse);

  // DeleteProductionScheduleResourceSetting removes one per-resource override.
  rpc DeleteProductionScheduleResourceSetting(DeleteProductionScheduleResourceSettingRequest) returns (google.protobuf.Empty);

  // ListFulfillmentRecommendations works out which SKUs should be built to order.
  rpc ListFulfillmentRecommendations(ListFulfillmentRecommendationsRequest) returns (ListFulfillmentRecommendationsResponse);

  // ApplyFulfillmentRecommendations writes the recommended policy onto the named items.
  rpc ApplyFulfillmentRecommendations(ApplyFulfillmentRecommendationsRequest) returns (ListFulfillmentRecommendationsResponse);

  // ListProductionScheduleItemSettings returns per-item planning overrides.
  rpc ListProductionScheduleItemSettings(ListProductionScheduleItemSettingsRequest) returns (ListProductionScheduleItemSettingsResponse);

  // GetProductionScheduleItemSetting returns one item's planning override.
  rpc GetProductionScheduleItemSetting(GetProductionScheduleItemSettingRequest) returns (ProductionScheduleItemSettingResponse);

  // UpsertProductionScheduleItemSetting writes one item's planning override.
  rpc UpsertProductionScheduleItemSetting(UpsertProductionScheduleItemSettingRequest) returns (ProductionScheduleItemSettingResponse);

  // DeleteProductionScheduleItemSetting removes one item's planning override.
  rpc DeleteProductionScheduleItemSetting(DeleteProductionScheduleItemSettingRequest) returns (google.protobuf.Empty);

  // ListProductionScheduleAtRiskOrders returns the commitments a version does not meet.
  rpc ListProductionScheduleAtRiskOrders(ListProductionScheduleAtRiskOrdersRequest) returns (ListProductionScheduleAtRiskOrdersResponse);


  // ListProductionScheduleDerivedLines returns derived downstream department work.
  rpc ListProductionScheduleDerivedLines(ListProductionScheduleDerivedLinesRequest) returns (ListProductionScheduleDerivedLinesResponse);

  // ListScheduleDeviationTypes returns the global deviation taxonomy.
  rpc ListScheduleDeviationTypes(ListScheduleDeviationTypesRequest) returns (ListScheduleDeviationTypesResponse);

  // ListProductionScheduleDeviations returns the append-only log of hand changes.
  rpc ListProductionScheduleDeviations(ListProductionScheduleDeviationsRequest) returns (ListProductionScheduleDeviationsResponse);

  // CreateProductionScheduleLine adds a campaign by hand.
  rpc CreateProductionScheduleLine(CreateProductionScheduleLineRequest) returns (CreateProductionScheduleLineResponse);

  // UpdateProductionScheduleLine edits a campaign.
  rpc UpdateProductionScheduleLine(UpdateProductionScheduleLineRequest) returns (UpdateProductionScheduleLineResponse);

  // DeleteProductionScheduleLine removes a campaign.
  rpc DeleteProductionScheduleLine(DeleteProductionScheduleLineRequest) returns (google.protobuf.Empty);

  // PublishProductionSchedule freezes the first weeks and supersedes what it replaces.
  rpc PublishProductionSchedule(PublishProductionScheduleRequest) returns (PublishProductionScheduleResponse);

  // ReleaseProductionScheduleWeek turns one planned week into a production run.
  rpc ReleaseProductionScheduleWeek(ReleaseProductionScheduleWeekRequest) returns (ReleaseProductionScheduleWeekResponse);

  // PreviewReleaseProductionScheduleWeek says what releasing a week would create.
  rpc PreviewReleaseProductionScheduleWeek(PreviewReleaseProductionScheduleWeekRequest) returns (ReleaseProductionScheduleWeekPreviewResponse);

  // ArchiveProductionSchedule retires a version.
  rpc ArchiveProductionSchedule(ArchiveProductionScheduleRequest) returns (ArchiveProductionScheduleResponse);

  // DeleteProductionSchedule removes a draft version.
  rpc DeleteProductionSchedule(DeleteProductionScheduleRequest) returns (google.protobuf.Empty);

  // Operating calendars: the days a plant tenders freight and a customer's dock accepts it,
  // which every ship-by commitment is resolved against. They live on this service because the
  // account settings that select them are the same settings the solver is configured with.
  rpc ListOperatingCalendars(ListOperatingCalendarsRequest) returns (ListOperatingCalendarsResponse);
  rpc GetOperatingCalendar(GetOperatingCalendarRequest) returns (OperatingCalendarInfo);
  rpc CreateOperatingCalendar(CreateOperatingCalendarRequest) returns (OperatingCalendarInfo);
  rpc UpdateOperatingCalendar(UpdateOperatingCalendarRequest) returns (OperatingCalendarInfo);
  rpc DeleteOperatingCalendar(DeleteOperatingCalendarRequest) returns (google.protobuf.Empty);
  rpc ListOperatingCalendarClosures(ListOperatingCalendarClosuresRequest) returns (ListOperatingCalendarClosuresResponse);
  rpc CreateOperatingCalendarClosure(CreateOperatingCalendarClosureRequest) returns (OperatingCalendarClosureInfo);
  rpc DeleteOperatingCalendarClosure(DeleteOperatingCalendarClosureRequest) returns (google.protobuf.Empty);
}

message OperatingCalendarInfo {
  string id = 1;
  string account_id = 2;
  string code = 3;
  string name = 4;
  string kind_code = 5;
  string days_of_week = 6;
  optional string cutoff_at = 7;
  optional string timezone = 8;
  bool is_default = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message OperatingCalendarClosureInfo {
  string id = 1;
  string operating_calendar_id = 2;
  google.protobuf.Timestamp closed_on = 3;
  string name = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListOperatingCalendarsRequest {
  optional string kind_code = 1;
}

message ListOperatingCalendarsResponse {
  repeated OperatingCalendarInfo calendars = 1;
}

message GetOperatingCalendarRequest {
  string id = 1;
}

message CreateOperatingCalendarRequest {
  string code = 1;
  string name = 2;
  string kind_code = 3;
  string days_of_week = 4;
  optional string cutoff_at = 5;
  optional string timezone = 6;
  bool is_default = 7;
}

message UpdateOperatingCalendarRequest {
  string id = 1;
  optional string name = 2;
  optional string days_of_week = 3;
  StringPatch cutoff_at = 4;
  StringPatch timezone = 5;
  optional bool is_default = 6;
}

message DeleteOperatingCalendarRequest {
  string id = 1;
}

message ListOperatingCalendarClosuresRequest {
  string operating_calendar_id = 1;
  // Bounded window. Both default to a year either side of today rather than returning
  // everything, since a calendar accumulates closures indefinitely.
  optional google.protobuf.Timestamp from_date = 2;
  optional google.protobuf.Timestamp to_date = 3;
}

message ListOperatingCalendarClosuresResponse {
  repeated OperatingCalendarClosureInfo closures = 1;
}

message CreateOperatingCalendarClosureRequest {
  string operating_calendar_id = 1;
  google.protobuf.Timestamp closed_on = 2;
  string name = 3;
}

message DeleteOperatingCalendarClosureRequest {
  string id = 1;
}

// ProductionScheduleInfo is one persisted version of the plan.
message ProductionScheduleInfo {
  string id = 1;
  int32 version = 2;
  string status_code = 3;
  optional string name = 4;
  google.protobuf.Timestamp planning_as_of = 5;
  google.protobuf.Timestamp horizon_start_date = 6;
  google.protobuf.Timestamp horizon_end_date = 7;
  int32 horizon_weeks = 8;
  int32 frozen_weeks = 9;
  optional google.protobuf.Timestamp frozen_through_date = 10;
  string demand_basis_code = 11;
  string generation_source_code = 12;
  string solver_version = 13;
  // JSON blobs frozen at write time so the plan stays explainable later.
  string settings_snapshot = 14;
  string diagnostics = 15;
  optional string error_message = 16;
  int32 frozen_line_count = 17;
  double frozen_planned_quantity = 18;
  optional string generated_by_id = 19;
  optional string published_by_id = 20;
  optional google.protobuf.Timestamp published_at = 21;
  optional string superseded_by_id = 22;
  google.protobuf.Timestamp created_at = 23;
  google.protobuf.Timestamp updated_at = 24;
}

message ProductionScheduleLineInfo {
  string id = 1;
  string production_schedule_id = 2;
  int32 week_index = 3;
  google.protobuf.Timestamp week_start_date = 4;
  string machine_id = 5;
  optional string production_step_id = 6;
  optional string department_id = 7;
  string item_id = 8;
  double planned_quantity = 9;
  optional string planned_unit_id = 10;
  int32 planned_lots = 11;
  double planned_run_hours = 12;
  double planned_changeover_minutes = 13;
  int32 sequence_index = 14;
  double projected_on_hand_before = 15;
  double projected_on_hand_after = 16;
  string status_code = 17;
  string source_code = 18;
  optional string reason_code = 19;
  bool is_frozen = 20;
  optional string production_run_id = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
  double planned_lot_units = 24;
  optional string planned_unit_abbreviation = 25;
  int64 released_batch_count = 26;
  int64 scanned_batch_count = 27;
  double scanned_quantity = 28;
}

message ProductionScheduleItemPolicyInfo {
  string id = 1;
  string production_schedule_id = 2;
  string item_id = 3;
  string sku = 4;
  optional string unit_id = 34;
  optional string unit_abbreviation = 35;
  optional string production_step_id = 5;
  optional string primary_machine_id = 6;
  double annual_demand = 7;
  double weekly_demand = 8;
  double seconds_per_unit = 9;
  double unit_cost = 10;
  double setup_cost = 11;
  double holding_cost = 12;
  double eoq_units = 13;
  double constraint_lead_time_weeks = 14;
  double finish_lead_time_weeks = 15;
  double sigma_weekly_pooled = 16;
  double sigma_downstream_sum = 17;
  double safety_stock_primary = 18;
  double safety_stock_downstream = 19;
  double reorder_point = 20;
  double order_up_to = 21;
  double on_hand_echelon = 22;
  double weeks_of_cover = 23;
  double annual_run_hours = 24;
  optional string abc_class = 25;
  bool was_eoq_capped = 26;
  bool was_capacity_starved = 27;
  google.protobuf.Timestamp created_at = 28;
  google.protobuf.Timestamp updated_at = 29;
  // The constraint stage on its own, split out of the echelon figure above.
  double on_hand_greige = 30;
  double average_greige_inventory = 31;
  double max_greige_inventory = 32;
  // The echelon position at the end of each horizon week. Weeks with no campaign are
  // what this explains: stock draining toward the reorder point.
  repeated double projected_on_hand = 33;
  // The physical greige store at the end of each horizon week — the constraint stage on
  // its own, which the echelon curve cannot be decomposed back into. A week where it dips
  // to the safety stock is the week knitting is meant to replenish. Empty for a schedule
  // generated before the greige buffer existed.
  repeated double projected_greige_on_hand = 40;
  // How this item was planned, the rule that decided, and the split between what the
  // order book owed and what the forecast projected.
  string fulfillment_policy_code = 36;
  string policy_source_code = 37;
  double firm_demand_units = 38;
  double forecast_demand_units = 39;
}

// ProductionScheduleFinishedPolicyInfo is one finished SKU's own inventory target — the
// decomposition of the pooled buffer the item policy reports.
message ProductionScheduleFinishedPolicyInfo {
  string id = 1;
  string production_schedule_id = 2;
  string item_id = 3;
  string sku = 4;
  string greige_item_id = 5;
  string greige_sku = 6;
  optional string product_line_id = 7;
  double annual_demand = 8;
  double weekly_demand = 9;
  double sigma_weekly = 10;
  double safety_stock = 11;
  double reorder_point = 12;
  double on_hand = 13;
  double weeks_of_cover = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

// ProductionScheduleFinishingLineInfo is one finished good's build in one week: the
// second stage of the plan, which decides the mix the pooled greige campaign left open.
message ProductionScheduleFinishingLineInfo {
  string id = 1;
  string production_schedule_id = 2;
  int32 week_index = 3;
  google.protobuf.Timestamp week_start_date = 4;
  string item_id = 5;
  string sku = 6;
  string greige_item_id = 7;
  string greige_sku = 8;
  optional string department_id = 9;
  optional string production_step_id = 10;
  double planned_quantity = 11;
  optional string planned_unit_id = 12;
  optional string planned_unit_abbreviation = 13;
  int32 planned_lots = 14;
  double planned_lot_units = 15;
  double planned_run_hours = 16;
  double greige_consumed = 17;
  double firm_units = 18;
  double projected_on_hand_before = 19;
  double projected_on_hand_after = 20;
  string status_code = 21;
  string source_code = 22;
  bool is_frozen = 23;
  google.protobuf.Timestamp created_at = 24;
  google.protobuf.Timestamp updated_at = 25;
}

message ListProductionScheduleFinishingLinesRequest {
  string production_schedule_id = 1;
  optional int32 week_index = 2;
  optional string item_id = 3;
}

message ListProductionScheduleFinishingLinesResponse {
  repeated ProductionScheduleFinishingLineInfo lines = 1;
}

message ListProductionScheduleFinishedPoliciesRequest {
  string production_schedule_id = 1;
}

message ListProductionScheduleFinishedPoliciesResponse {
  repeated ProductionScheduleFinishedPolicyInfo policies = 1;
}

message GenerateProductionScheduleRequest {
  optional google.protobuf.Timestamp planning_as_of = 1;
  optional int32 horizon_weeks = 2;
  optional string demand_basis = 3;
  optional string name = 4;
}

message GenerateProductionScheduleResponse {
  ProductionScheduleInfo schedule = 1;
}

message RegenerateProductionScheduleRequest {
  string id = 1;
  // merge_mode decides what happens to hand-edited campaigns. Empty preserves them.
  optional string merge_mode = 2;
  // Planning inputs default to the ones the version was generated with, so a plain
  // regenerate answers "what would the solver say now" rather than a different question.
  optional google.protobuf.Timestamp planning_as_of = 3;
  optional int32 horizon_weeks = 4;
  optional string demand_basis = 5;
}

message ScheduleDiffLineProto {
  string change_code = 1;
  string item_id = 2;
  string sku = 3;
  string machine_id = 4;
  int32 week_index = 5;
  double current_quantity = 6;
  double proposed_quantity = 7;
  bool current_is_manual = 8;
}

message PreviewRegenerateProductionScheduleResponse {
  string schedule_id = 1;
  string solver_version = 2;
  google.protobuf.Timestamp planning_as_of = 3;
  repeated ScheduleDiffLineProto lines = 4;
  int32 added_count = 5;
  int32 removed_count = 6;
  int32 changed_count = 7;
  int32 manual_line_count = 8;
  int32 discarded_manual_count = 9;
}

message RegenerateProductionScheduleResponse {
  ProductionScheduleInfo schedule = 1;
}

message GetProductionScheduleRequest {
  string id = 1;
}

message GetCurrentProductionScheduleRequest {}

message GetProductionScheduleResponse {
  // Absent when no published version covers today, which is a normal state.
  optional ProductionScheduleInfo schedule = 1;
}

message ListProductionSchedulesRequest {
  optional string cursor = 1;
  int32 limit = 2;
  repeated string status_codes = 3;
  optional string query = 4;
}

message ListProductionSchedulesResponse {
  repeated ProductionScheduleInfo schedules = 1;
  PageInfo page_info = 2;
}

message ListProductionScheduleLinesRequest {
  string production_schedule_id = 1;
  repeated string machine_ids = 2;
  optional int32 week_index = 3;
}

message ListProductionScheduleLinesResponse {
  repeated ProductionScheduleLineInfo lines = 1;
}

message ListProductionScheduleItemPoliciesRequest {
  string production_schedule_id = 1;
}

message ListProductionScheduleItemPoliciesResponse {
  repeated ProductionScheduleItemPolicyInfo policies = 1;
}

message PreviewProductionScheduleRequest {
  optional google.protobuf.Timestamp planning_as_of = 1;
  // Overrides the saved settings for this preview only.
  optional int32 horizon_weeks = 2;
  optional string demand_basis = 3;
}

// SchedulePolicyProto is the computed inventory policy for one item.
message SchedulePolicyProto {
  string item_id = 1;
  string sku = 2;
  double annual_demand = 3;
  double weekly_demand = 4;
  double seconds_per_unit = 5;
  double unit_cost = 6;
  double setup_cost = 7;
  double holding_cost = 8;
  double eoq_units = 9;
  double constraint_lead_time_weeks = 10;
  double finish_lead_time_weeks = 11;
  double safety_stock_primary = 12;
  double safety_stock_downstream = 13;
  double reorder_point = 14;
  double order_up_to = 15;
  double on_hand_echelon = 16;
  double weeks_of_cover = 17;
  string abc_class = 18;
  double annual_run_hours = 19;
  // The constraint stage on its own, split out of the echelon figure above.
  double on_hand_greige = 20;
  double average_greige_inventory = 21;
  double max_greige_inventory = 22;
  // How this item was planned, the rule that decided, and the split between what the
  // order book owed and what the forecast projected.
  string fulfillment_policy_code = 23;
  string policy_source_code = 24;
  double firm_demand_units = 25;
  double forecast_demand_units = 26;
}

// ScheduleCampaignProto is one planned production block.
message ScheduleCampaignProto {
  string item_id = 1;
  string sku = 2;
  string machine_id = 3;
  int32 week_index = 4;
  double units = 5;
  int32 lots = 6;
  double run_hours = 7;
}

// ScheduleProjectionProto is an item's projected stock position across the horizon.
message ScheduleProjectionProto {
  string item_id = 1;
  repeated double on_hand_by_week = 2;
}

// ScheduleAppliedOverrideProto records an override that actually moved a number, so
// the plan can explain why it differs from history.
message ScheduleAppliedOverrideProto {
  string override_id = 1;
  string item_id = 2;
  google.protobuf.Timestamp month_start = 3;
  double before = 4;
  double after = 5;
  string type_code = 6;
  string reason_code = 7;
}

// ScheduleDiagnosticsProto is the honest account of what the solver could not do.
message ScheduleDiagnosticsProto {
  repeated string eoq_capped_skus = 1;
  repeated string unschedulable_skus = 2;
  repeated string capacity_starved_skus = 3;
  repeated string items_without_run_rate = 4;
  int32 excluded_item_count = 5;
  double changeover_slope_minutes = 6;
  double average_inputs_added = 7;
  repeated ScheduleAppliedOverrideProto applied_overrides = 8;
  // Why an empty plan is empty: the machines the department contributed, and how much
  // production history was found on them.
  int32 constraint_machine_count = 9;
  int32 measured_batch_count = 10;
  int32 machines_without_step = 11;
  // The order book this plan owes, and the commitments it does not meet.
  double firm_demand_units = 12;
  int32 undated_firm_order_count = 13;
  repeated ScheduleAtRiskOrderProto at_risk_orders = 14;
  // How many planned items are built only against the order book.
  int32 make_to_order_item_count = 15;
  // How the second stage — the rest of the factory — fared against this plan.
  ScheduleFinishingDiagnosticsProto finishing = 16;
  int32 finishing_machine_count = 17;
  bool finishing_capacity_is_estimated = 18;
}

// ScheduleFinishingDiagnosticsProto is stage two's account of itself. The two starvation
// lists are kept apart because they call for opposite responses: knit more, or find hours.
message ScheduleFinishingDiagnosticsProto {
  double weekly_capacity_hours = 1;
  repeated double planned_hours_by_week = 2;
  repeated double utilisation_by_week = 3;
  repeated string greige_starved_skus = 4;
  repeated string capacity_starved_skus = 5;
  repeated string items_without_run_rate = 6;
  double unused_greige_units = 7;
  double total_planned_units = 8;
  int32 line_count = 9;
}

// ScheduleAtRiskOrderProto is a commitment the plan does not meet, with the reason.
message ScheduleAtRiskOrderProto {
  string sales_order_id = 1;
  string sales_order_number = 2;
  string item_id = 3;
  string sku = 4;
  double units = 5;
  int32 due_week = 6;
  string reason = 7;
}

message PreviewProductionScheduleResponse {
  string solver_version = 1;
  google.protobuf.Timestamp planning_as_of = 2;
  repeated SchedulePolicyProto policies = 3;
  repeated ScheduleCampaignProto campaigns = 4;
  repeated ScheduleProjectionProto projections = 5;
  ScheduleDiagnosticsProto diagnostics = 6;
}

// ScheduleDeviationTypeInfo is one entry in the deviation taxonomy.
message ScheduleDeviationTypeInfo {
  string id = 1;
  string code = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// ProductionScheduleDeviationInfo is one append-only record of a hand change.
message ProductionScheduleDeviationInfo {
  string id = 1;
  string production_schedule_id = 2;
  optional string production_schedule_line_id = 3;
  string deviation_type_code = 4;
  // Materialized at write time, never derived on read.
  bool is_frozen_week = 5;
  optional int32 week_index = 6;
  optional string machine_id = 7;
  optional string item_id = 8;
  optional string before_json = 9;
  optional string after_json = 10;
  double delta_quantity = 11;
  double delta_run_hours = 12;
  optional string reason_code = 13;
  optional string reason_note = 14;
  string actor_id = 15;
  google.protobuf.Timestamp created_at = 16;
}

message ListScheduleDeviationTypesRequest {}

message ListScheduleDeviationTypesResponse {
  repeated ScheduleDeviationTypeInfo types = 1;
}

message ListProductionScheduleDeviationsRequest {
  string schedule_id = 1;
  optional string cursor = 2;
  int32 limit = 3;
  optional bool frozen_only = 4;
  optional string query = 5;
}

message ListProductionScheduleDeviationsResponse {
  repeated ProductionScheduleDeviationInfo deviations = 1;
  PageInfo page_info = 2;
}

message CreateProductionScheduleLineRequest {
  string schedule_id = 1;
  int32 week_index = 2;
  string machine_id = 3;
  string item_id = 4;
  double quantity = 5;
  optional int32 lots = 6;
  optional double run_hours = 7;
  optional string reason_code = 8;
  optional string reason_note = 9;
}

message CreateProductionScheduleLineResponse {
  ProductionScheduleLineInfo line = 1;
}

message UpdateProductionScheduleLineRequest {
  string schedule_id = 1;
  string line_id = 2;
  optional int32 week_index = 3;
  optional string machine_id = 4;
  optional double quantity = 5;
  optional int32 lots = 6;
  optional double run_hours = 7;
  optional int32 sequence_index = 8;
  optional string status_code = 9;
  StringPatch reason_code = 10;
  optional string reason_note = 12;
}

message UpdateProductionScheduleLineResponse {
  ProductionScheduleLineInfo line = 1;
}

message DeleteProductionScheduleLineRequest {
  string schedule_id = 1;
  string line_id = 2;
  optional string reason_code = 3;
  optional string reason_note = 4;
}

message PublishProductionScheduleRequest {
  string id = 1;
}

message PublishProductionScheduleResponse {
  ProductionScheduleInfo schedule = 1;
}

message ReleaseProductionScheduleWeekRequest {
  string id = 1;
  int32 week_index = 2;
  string responsible_user_id = 3;
  optional string scanning_station_id = 4;
  // Issue the whole week as new tickets instead of moving an earlier week's
  // unworked doffs into this run.
  bool skip_carry_forward = 5;
}

// ReleaseScheduleLineBatchInfo is one batch the release would create, or did.
message ReleaseScheduleLineBatchInfo {
  string item_id = 1;
  string sku = 2;
  double quantity = 3;
  optional string batch_id = 4;
  // The number of the run this ticket came off when the batch already existed.
  // Absent means the release creates it new.
  optional string carried_forward_from = 5;
}

// ReleasedScheduleLineInfo is one campaign and the lots it broke into.
message ReleasedScheduleLineInfo {
  string production_schedule_line_id = 1;
  string item_id = 2;
  string sku = 3;
  string machine_id = 4;
  optional string machine_name = 5;
  double planned_quantity = 6;
  double lot_units = 7;
  int32 batch_count = 8;
  repeated ReleaseScheduleLineBatchInfo batches = 9;
  optional string unit = 10;
  double carried_forward_quantity = 11;
}

message ReleaseProductionScheduleWeekResponse {
  ProductionRunInfo production_run = 1;
  int32 week_index = 2;
  google.protobuf.Timestamp week_start_date = 3;
  int32 released_line_count = 4;
  int32 batch_count = 5;
  double total_quantity = 6;
  repeated ReleasedScheduleLineInfo lines = 7;
  int32 carried_forward_batch_count = 8;
}

message PreviewReleaseProductionScheduleWeekRequest {
  string id = 1;
  int32 week_index = 2;
  bool skip_carry_forward = 3;
}

// ReleaseProductionScheduleWeekPreviewResponse is what a release would do, with nothing
// written. is_releasable is false when the week is empty or already released.
message ReleaseProductionScheduleWeekPreviewResponse {
  int32 week_index = 1;
  google.protobuf.Timestamp week_start_date = 2;
  int32 line_count = 3;
  int32 batch_count = 4;
  double total_quantity = 5;
  repeated ReleasedScheduleLineInfo lines = 6;
  bool is_releasable = 7;
  optional string blocked_reason = 8;
  optional string existing_production_run_id = 9;
  int32 carried_forward_batch_count = 10;
}

message ArchiveProductionScheduleRequest {
  string id = 1;
}

message ArchiveProductionScheduleResponse {
  ProductionScheduleInfo schedule = 1;
}

message DeleteProductionScheduleRequest {
  string id = 1;
}

// ProductionScheduleDerivedLineInfo is downstream work implied by a constraint campaign.
message ProductionScheduleDerivedLineInfo {
  string id = 1;
  string production_schedule_id = 2;
  string source_line_id = 3;
  string production_step_id = 4;
  optional string department_id = 5;
  string item_id = 6;
  int32 week_index = 7;
  google.protobuf.Timestamp week_start_date = 8;
  double quantity = 9;
  optional string planned_unit_id = 10;
  int32 explosion_depth = 11;
  int32 offset_weeks = 12;
  string status_code = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message ListProductionScheduleDerivedLinesRequest {
  string schedule_id = 1;
  repeated string department_ids = 2;
  optional int32 week_index = 3;
}

message ListProductionScheduleDerivedLinesResponse {
  repeated ProductionScheduleDerivedLineInfo lines = 1;
}

// ProductionScheduleSettingsInfo is the merchant's planning assumptions. Always fully
// populated: an account with nothing saved gets the solver's own defaults.
message ProductionScheduleSettingsInfo {
  optional string constraint_department_id = 1;
  int32 planning_horizon_weeks = 2;
  int32 frozen_weeks = 3;
  int32 week_start_day = 4;
  int32 demand_window_months = 5;
  int32 forecast_history_months = 6;
  int32 forecast_months = 7;
  string demand_basis_code = 8;
  double forecast_z = 9;
  double changeover_avg_minutes = 10;
  double changeover_min_minutes = 11;
  double changeover_max_minutes = 12;
  double changeover_labor_rate = 13;
  double holding_rate_pct = 14;
  double service_level_z = 15;
  double finish_lead_time_weeks = 16;
  double default_constraint_lead_time_weeks = 17;
  double max_weeks_supply = 18;
  int32 max_flow_depth = 19;
  int32 shifts_per_day = 20;
  double hours_per_shift = 21;
  int32 work_days_per_week = 22;
  int32 weeks_per_year = 23;
  double capacity_headroom_pct = 24;
  double default_lot_units = 25;
  bool is_enabled = 26;
  optional string generation_cron = 27;
  string generation_timezone = 28;
  bool auto_publish = 29;
  optional google.protobuf.Timestamp last_generated_at = 30;
  bool has_stored_settings = 31;
  google.protobuf.Timestamp created_at = 32;
  google.protobuf.Timestamp updated_at = 33;
  // The last fallback in an order's ship-by chain, behind the customer and its account group.
  int32 default_customer_lead_time_days = 34;
  string default_fulfillment_policy_code = 35;
  // The account-wide operating calendars, behind the per-customer and per-address links and
  // ahead of a plain Monday-to-Friday week.
  optional string ship_calendar_id = 36;
  optional string receive_calendar_id = 37;
}

// ProductionScheduleItemSettingInfo is one item's planning override.
message ProductionScheduleItemSettingInfo {
  string id = 1;
  string item_id = 2;
  string sku = 3;
  bool is_excluded = 4;
  optional double lot_multiple_units = 5;
  optional string fulfillment_policy_code = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// FulfillmentRecommendationInfo is the engine's advice for one item, with the
// measurements behind it so a planner can disagree with the rule rather than only
// with the answer.
message FulfillmentRecommendationInfo {
  string item_id = 1;
  string sku = 2;
  optional string product_line_id = 3;
  string current_policy_code = 4;
  string recommended_policy_code = 5;
  string reason_code = 6;
  bool changes = 7;
  double average_demand_interval = 8;
  double coefficient_of_variation = 9;
  double top_customer_share_pct = 10;
  optional string top_customer_name = 11;
  double demand_weighted_lead_time_days = 12;
  double annual_cogs = 13;
  int32 months_since_last_sale = 14;
  double mixed_stream_share_pct = 15;
  optional string description = 16;
}

message ListFulfillmentRecommendationsRequest {}

message ListFulfillmentRecommendationsResponse {
  repeated FulfillmentRecommendationInfo recommendations = 1;
}

message ApplyFulfillmentRecommendationsRequest {
  repeated string item_ids = 1;
}

