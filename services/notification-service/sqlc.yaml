version: "2"
sql:
  - schema: "../../shared/db/migrations"
    queries: "internal/infrastructure/queries"
    engine: "mysql"
    gen:
      go:
        out: "internal/infrastructure/sqlc"
        package: "sqlc"
        emit_prepared_queries: false
        overrides:
          - column: "service_idempotency_key.response_body"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          - column: "message_outbox.headers"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "notification.template_params"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "notification.metadata"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "announcement.template_params"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "announcement.audience"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "conversation.metadata"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "message.metadata"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "message.template_params"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "conversation_participant.agent_trigger_keywords"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "scheduled_message.metadata"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "email_domain.dkim_tokens"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "email_inbox.agent_trigger_keywords"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"
          - column: "reply_draft.metadata"
            go_type:
              import: "github.com/open-mrp/api/shared/db"
              type: "NullableRawMessage"

