services:
  mysql:
    image: mysql:8
    container_name: openmrp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Testing123!"
      MYSQL_DATABASE: openmrp
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pTesting123!"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: openmrp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openmrp_agents
      POSTGRES_USER: openmrp
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmrp -d openmrp_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  postgres-data:
