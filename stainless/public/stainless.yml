edition: "2026-02-23"
organization:
  name: augno
  contact: support@augno.com
targets:
  typescript:
    edition: typescript.2025-10-10
    package_name: "@augno/sdk"
    staging_repo: augno/typescript-sdk
    production_repo: augno/typescript-sdk
    publish:
      npm:
        registry: npmjs
      # Emit .github/workflows/release-please.yml + release-please-config.json as
      # generated files (self-hosted, not stainlessManaged), so the TS SDK's
      # release automation survives every regeneration — same as python/go below.
      # Without this block stlc emits release-please-config.json but NOT the
      # workflow that consumes it, leaving the SDK with no way to cut a release
      # (the old Changesets "Release" workflow was removed in the same migration).
      # prerelease: true keeps the existing 0.x prerelease versioning.
      release:
        branch: main
        prerelease: true
    options:
      # Generate an MCP server as a sub-package (packages/mcp-server) of the
      # public TypeScript SDK. There is no standalone `mcp` target in stlc; the
      # server wraps @augno/sdk and is built/hosted as its own container (see
      # infra/production/kubernetes/apps/mcp-server.yaml and docs/stlc-sdk-codegen.md).
      mcp_server:
        package_name: "@augno/sdk-mcp"
        # The MCP server exposes a single code-execution tool: agents write small
        # TypeScript snippets against @augno/sdk (all 146 endpoints are reachable
        # via packages/mcp-server/src/methods.ts). Because we generate self-hosted
        # (sdk-gen forks, not stainlessManaged), code execution is forced to LOCAL
        # mode — it runs in an in-container Deno worker, NOT a Stainless-hosted
        # sandbox. So this is safe to host ourselves with no external dependency.
        enable_code_tool: true
        # The docs tool requires exposing an SDK docs-search API, which we do not
        # currently serve — disable it.
        enable_docs_tool: false
        instructions: |
          This MCP server wraps the Augno API (production management for SMB
          manufacturers). Use the code tool to call the API by writing TypeScript
          against the Augno SDK. Authenticate with an Augno API key as a Bearer
          token; set the active account with the Augno-Account header when
          operating across multiple accounts.
  python:
    edition: python.2025-11-20
    # package_name is both the import name (`from augno import ...`) and the
    # PyPI distribution name (`pip install augno`); project_name defaults to it.
    package_name: augno
    staging_repo: augno/python-sdk
    production_repo: augno/python-sdk
    publish:
      pypi:
        # GitHub Actions OIDC (PyPI Trusted Publishing) — no long-lived token.
        auth_method: oidc
      # Emit .github/workflows/release-please.yml + release-please-config.json as
      # generated files (self-hosted, not stainlessManaged), so the release
      # automation is part of the generated baseline and survives every
      # regeneration. The generated workflow uses a RELEASE_PLEASE_TOKEN secret.
      release:
        branch: main
        prerelease: false
  go:
    edition: go.2026-04-15
    # Module path is derived as github.com/<production_repo> => github.com/augno/augno-go.
    # Go "publishing" is a git tag (release-please); pkg.go.dev indexes the public repo.
    package_name: augno
    staging_repo: augno/augno-go
    production_repo: augno/augno-go
    publish:
      # Emit the release-please workflow + config as generated files (durable).
      release:
        branch: main
        prerelease: false
environments:
  production: https://api.augno.com
  local: http://localhost:8081
client_settings:
  # The API requires an Augno-Version header on every request. The self-hosted
  # stlc fork does not honor the upstream `send_openapi_info_version_as_header`
  # key, so we emit it as a default header instead. `version_header: true` marks
  # it as the API-version header; `value` is kept in sync with the spec's
  # info.version by `make stainless` (see tools/apidocs/stainless.go).
  default_headers:
    Augno-Version:
      value: "1.0.forge-preview.3"
      version_header: true
  bearer_token_refresh:
    method: PUT
    path: "/v1/auth/access-tokens"
    credentials: include
    retry_signal_header: X-Retry
    skip_request_paths:
      - "/v1/auth/access-tokens"
      - "/v1/auth/actions/login"
    expose_on_auth_failure_callback: true
  omit_stainless_headers: true
  opts:
    bearer_token:
      type: string
      nullable: true
      read_env: AUGNO_API_KEY
      auth:
        security_scheme: BearerAuth
        role: value
      description: "API key sent as a Bearer token. Omit for cookie-based user sessions (dashboard)."
    augno_account_id:
      type: string
      nullable: true
      description: "Current account UUID (Augno-Account). Update when switching accounts."
      send_in_header: Augno-Account
readme:
  include_stainless_attribution: false
  example_requests:
    default:
      type: request
      endpoint: get /v1/catalog/items
      params: {}
