apiVersion: apps/v1
kind: Deployment
metadata:
    name: redis
spec:
    replicas: 1
    selector:
        matchLabels:
            app: redis
    template:
        metadata:
            labels:
                app: redis
        spec:
            containers:
                - name: redis
                  image: redis:8-alpine
                  # Pure cache: no RDB/AOF, so a restart is a cold cache and never a recovery. No password in dev, so a fresh clone needs no local secret.
                  args:
                      - --maxmemory
                      - 128mb
                      - --maxmemory-policy
                      - allkeys-lru
                      - --save
                      - ""
                      - --appendonly
                      - "no"
                  ports:
                      - containerPort: 6379
                  readinessProbe:
                      exec:
                          command: ["redis-cli", "ping"]
                      initialDelaySeconds: 2
                      periodSeconds: 5
                  livenessProbe:
                      exec:
                          command: ["redis-cli", "ping"]
                      initialDelaySeconds: 10
                      periodSeconds: 15
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "50m"
                      limits:
                          memory: "192Mi"
                          cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
    name: redis
spec:
    selector:
        app: redis
    ports:
        - name: redis
          port: 6379
          targetPort: 6379
    type: ClusterIP
