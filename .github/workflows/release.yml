name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  detect-changes:
    name: Detect Release Changes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.detect.outputs.previous_tag }}
      current_ref: ${{ steps.detect.outputs.current_ref }}
      build_services_json: ${{ steps.detect.outputs.build_services_json }}
      build_services_csv: ${{ steps.detect.outputs.build_services_csv }}
      build_matrix_json: ${{ steps.detect.outputs.build_matrix_json }}
      has_build_services: ${{ steps.detect.outputs.has_build_services }}
      deploy_services_json: ${{ steps.detect.outputs.deploy_services_json }}
      deploy_services_csv: ${{ steps.detect.outputs.deploy_services_csv }}
      has_deploy_services: ${{ steps.detect.outputs.has_deploy_services }}
      terraform_changed: ${{ steps.detect.outputs.terraform_changed }}
      config_changed: ${{ steps.detect.outputs.config_changed }}
      platform_changed: ${{ steps.detect.outputs.platform_changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect release changes since last release
        id: detect
        run: go run ./cmd/detect-release-changes --current-tag "${{ needs.release-please.outputs.tag_name }}"

      - name: Summarize release selection
        run: |
          PREVIOUS_TAG="${{ steps.detect.outputs.previous_tag }}"
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="(none)"
          fi

          {
            echo "## Release selection"
            echo ""
            echo "- Previous tag: ${PREVIOUS_TAG}"
            echo "- Current ref: ${{ steps.detect.outputs.current_ref }}"
            echo "- Build services: ${{ steps.detect.outputs.build_services_json }}"
            echo "- Deploy services: ${{ steps.detect.outputs.deploy_services_json }}"
            echo "- Terraform changed: ${{ steps.detect.outputs.terraform_changed }}"
            echo "- Config changed: ${{ steps.detect.outputs.config_changed }}"
            echo "- Platform changed: ${{ steps.detect.outputs.platform_changed }}"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform Apply
    needs: [release-please, detect-changes]
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      needs.detect-changes.outputs.terraform_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/production/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Cache Terraform Providers
        uses: actions/cache@v5
        with:
          path: |
            .terraform/providers
            .terraform.lock.hcl
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  build-push:
    name: Build and Push
    needs: [release-please, detect-changes, terraform]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.detect-changes.outputs.has_build_services == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.build_matrix_json) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/production/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:${{ needs.release-please.outputs.tag_name }}
            ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: [release-please, detect-changes, terraform, build-push]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      (needs.build-push.result == 'success' || needs.build-push.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Deploy to EKS
        run: ./scripts/deploy.sh
        env:
          AWS_REGION: "us-east-2"
          CLUSTER_NAME: "augno-prod"
          IMAGE_TAG: ${{ needs.release-please.outputs.tag_name }}
          DEPLOY_SERVICES: ${{ needs.detect-changes.outputs.deploy_services_csv }}
          BUILD_SERVICES: ${{ needs.detect-changes.outputs.build_services_csv }}
          APPLY_PLATFORM: ${{ needs.detect-changes.outputs.platform_changed }}
          APPLY_CONFIG: ${{ needs.detect-changes.outputs.config_changed }}
          CONFIG_CHANGED: ${{ needs.detect-changes.outputs.config_changed }}

  publish-openapi-specs:
    name: Publish OpenAPI Specs
    needs: [release-please, deploy]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      internal_spec_changed: ${{ steps.compare-internal.outputs.changed }}
      public_spec_changed: ${{ steps.compare-public.outputs.changed }}
      api_version: ${{ steps.api-version.outputs.api_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Install Modules
        run: |
          go mod tidy
          cd tools && go mod tidy

      - name: Resolve API version
        id: api-version
        run: echo "api_version=$(go run ./cmd/print-version)" >> "$GITHUB_OUTPUT"

      - name: Snapshot current OpenAPI specs from S3 (pre-upload baseline)
        run: |
          mkdir -p specs/sdk-baseline
          aws s3 cp s3://augno-public-openapi-specs/openapi.json specs/sdk-baseline/public_openapi_spec.json 2>/dev/null || true
          aws s3 cp s3://augno-private-openapi-specs/openapi.json specs/sdk-baseline/internal_openapi_spec.json 2>/dev/null || true

      - name: Generate OpenAPI Specs and Stainless configs
        run: make openapi-stainless

      - name: Compare internal OpenAPI spec to S3 baseline
        id: compare-internal
        run: ./scripts/sdk-openapi-spec-changed.sh internal

      - name: Compare public OpenAPI spec to S3 baseline
        id: compare-public
        run: ./scripts/sdk-openapi-spec-changed.sh public

      - name: Upload Public Release Artifacts to S3
        run: |
          # Key per-version artifacts by the API version (cmd/print-version, e.g.
          # 1.0.forge-preview.2) — the same value notify-consumers dispatches and the
          # spec embeds in info.version. The API version is not unique per release, so
          # releases that ship the same API version overwrite the key: it always holds
          # the latest spec for that API version.
          api_version="${{ steps.api-version.outputs.api_version }}"
          aws s3 cp specs/public_openapi_spec.json "s3://augno-public-openapi-specs/openapi.json"
          aws s3 cp specs/public_openapi_spec.json "s3://augno-public-openapi-specs/${api_version}.json"
          aws s3 cp stainless/public/stainless.yml "s3://augno-public-openapi-specs/stainless.yml"
          aws s3 cp stainless/public/stainless.yml "s3://augno-public-openapi-specs/${api_version}-stainless.yml"

      - name: Upload Private Release Artifacts to S3
        run: |
          api_version="${{ steps.api-version.outputs.api_version }}"
          aws s3 cp specs/internal_openapi_spec.json "s3://augno-private-openapi-specs/openapi.json"
          aws s3 cp specs/internal_openapi_spec.json "s3://augno-private-openapi-specs/${api_version}.json"
          aws s3 cp stainless/internal/stainless.yml "s3://augno-private-openapi-specs/stainless.yml"
          aws s3 cp stainless/internal/stainless.yml "s3://augno-private-openapi-specs/${api_version}-stainless.yml"

  generate-sdks:
    name: Generate SDKs with stlc
    needs: [release-please, deploy, publish-openapi-specs]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success' &&
      needs.publish-openapi-specs.result == 'success'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/stlc-generate-reusable.yml
    with:
      # Deliberately the release-please tag, not the API version: the reusable
      # workflow derives the SDK semver bump from the tag's shape (vX.Y.Z).
      api_version: ${{ needs.release-please.outputs.tag_name }}
      push_branch: main
      openapi_specs_source: s3
      openapi_internal_gate: ${{ needs.publish-openapi-specs.outputs.internal_spec_changed }}
      openapi_public_gate: ${{ needs.publish-openapi-specs.outputs.public_spec_changed }}
    secrets:
      STLC_READ_TOKEN: ${{ secrets.STLC_READ_TOKEN }}
      SDK_WRITE_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}

  build-deploy-mcp:
    name: Build and Deploy MCP Server
    # The MCP server source lives in typescript-sdk/packages/mcp-server and is
    # (re)generated by generate-sdks. Build its image from the generated
    # Dockerfile and roll it out on EKS. Gated on the public spec changing — the
    # same condition under which generate-sdks pushes a new public TS SDK.
    needs: [release-please, deploy, publish-openapi-specs, generate-sdks]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success' &&
      needs.generate-sdks.result == 'success' &&
      needs.publish-openapi-specs.outputs.public_spec_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout API repo (k8s manifest + kubeconfig)
        uses: actions/checkout@v5

      - name: Checkout typescript-sdk (MCP build context)
        uses: actions/checkout@v5
        with:
          repository: augno/typescript-sdk
          ref: main
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: typescript-sdk-src

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push MCP Server image
        uses: docker/build-push-action@v7
        with:
          # The generated Dockerfile builds the whole pnpm workspace; context is
          # the typescript-sdk repo root, Dockerfile is the generated one.
          context: typescript-sdk-src
          file: typescript-sdk-src/packages/mcp-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/mcp-server:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/augno/mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy MCP Server to EKS
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region us-east-2 --name augno-prod
          registry="${{ steps.login-ecr.outputs.registry }}"
          image="${registry}/augno/mcp-server:${IMAGE_TAG}"
          manifest=infra/production/kubernetes/apps/mcp-server.yaml
          # Pin the rolled-out image to this release's tag (mirrors deploy.sh).
          sed -E "s#^([[:space:]]*image: ).*#\1${image}#" "$manifest" > /tmp/mcp-server.yaml
          kubectl apply -f /tmp/mcp-server.yaml
          kubectl rollout status deployment/mcp-server --timeout=5m

  notify-consumers:
    name: Notify ${{ matrix.consumer }}
    # Runs in parallel with generate-sdks; consumers sync from deployed API / S3 specs, not from SDK PRs.
    needs: [release-please, deploy, publish-openapi-specs]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy.result == 'success' &&
      needs.publish-openapi-specs.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - Augno/public-docs
          - Augno/openapi-spec
    steps:
      - name: Dispatch api-release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: ${{ matrix.consumer }}
          event-type: api-release
          # Send the API version (e.g. 1.0.forge-preview.2) — the SAME value
          # publish-openapi-specs uses to key the per-version S3 artifact
          # `<api_version>.json`, which consumers fetch. Keep this in lockstep with
          # the Upload *Release Artifacts to S3 steps. release_version (the
          # release-please tag) rides along for traceability.
          client-payload: '{"api_version": "${{ needs.publish-openapi-specs.outputs.api_version }}", "release_version": "${{ needs.release-please.outputs.tag_name }}"}'
