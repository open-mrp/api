syntax = "proto3";

// Package auth defines the gRPC contract for the auth-service. It handles user
// authentication (login, registration, credential validation), token lifecycle
// (refresh, revoke), and password management (reset, update). The api-gateway
// calls these RPCs on every authenticated request (ValidateCredential) and for
// all auth-related HTTP endpoints.
package auth;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "shared/proto/auth;auth";

service AuthService {
  // ValidateCredential verifies a bearer token (JWT or API key) and returns
  // the resolved Identity. Called by the api-gateway on every authenticated
  // request to build the identity context propagated to downstream services.
  rpc ValidateCredential(Credential) returns (Identity);

  // Login authenticates a user by identifier + password and returns a token
  // pair (access + refresh) along with the user profile.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Register creates a new user account and returns a token pair so the user
  // is immediately logged in after registration.
  rpc Register(RegisterRequest) returns (LoginResponse);

  // RefreshToken exchanges a valid refresh token for a new short-lived access
  // token. The refresh token itself is not rotated.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // RequestPasswordReset initiates the password reset flow by sending a
  // reset email to the user. Returns Empty regardless of whether the
  // identifier exists (to prevent user enumeration).
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (google.protobuf.Empty);

  // ResetPassword completes the password reset flow using the token from the
  // reset email. Sets the new password and returns a token pair so the user
  // is logged in immediately.
  rpc ResetPassword(ResetPasswordRequest) returns (LoginResponse);

  // RevokeRefreshToken invalidates a refresh token so it can no longer be
  // used to mint access tokens. Used on logout.
  rpc RevokeRefreshToken(RevokeRefreshTokenRequest) returns (google.protobuf.Empty);

  // UpdatePassword changes the authenticated user's password. Requires the
  // old password for verification before accepting the new one.
  rpc UpdatePassword(UpdatePasswordRequest) returns (google.protobuf.Empty);

  // CreateAPIKey creates a new API key for the target account. Only internal
  // admin users may call this RPC. Returns the full secret (shown once) and
  // the API key metadata.
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);

  // RotateAPIKey revokes an existing API key and creates a new replacement
  // key with the same name, role, and owner. The new key inherits the old
  // key's expiration unless an explicit expires_at override is provided.
  // Returns the new secret (shown once) and the new API key metadata.
  rpc RotateAPIKey(RotateAPIKeyRequest) returns (RotateAPIKeyResponse);

  // RevokeAPIKey permanently revokes an API key so it can no longer be used
  // to authenticate requests. Unlike RotateAPIKey, no replacement is created.
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (google.protobuf.Empty);

  // ListAPIKeys returns a paginated list of API keys for the target account.
  // Supports cursor-based pagination and optional search filtering.
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);

  // GetAPIKey returns a single API key's metadata by its ID. Only callable
  // by internal admin users on the key's owning account.
  rpc GetAPIKey(GetAPIKeyRequest) returns (GetAPIKeyResponse);

  // GetOrCreateDocAPIKey returns a sandbox API key for embedding in API
  // documentation. Reuses an existing valid key or creates/rotates one as
  // needed. Only callable by internal admin users.
  rpc GetOrCreateDocAPIKey(GetOrCreateDocAPIKeyRequest) returns (GetOrCreateDocAPIKeyResponse);

  // CreateRegistrationSession creates a new registration session for the
  // given email and plan code, or returns an existing active session if one
  // already exists (idempotent). Sends a verification email on creation.
  rpc CreateRegistrationSession(CreateRegistrationSessionRequest) returns (CreateRegistrationSessionResponse);

  // ResendVerificationEmail regenerates the verification token for an
  // existing registration session and resends the verification email.
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (google.protobuf.Empty);

  // VerifyRegistrationToken verifies the email token sent during registration.
  // Marks the session's email as verified and advances the step to user_details.
  // Idempotent: repeated calls with the same token return the same session.
  rpc VerifyRegistrationToken(VerifyRegistrationTokenRequest) returns (VerifyRegistrationTokenResponse);

  // GetRegistrationSession returns the current state of a registration session.
  rpc GetRegistrationSession(GetRegistrationSessionRequest) returns (GetRegistrationSessionResponse);

  // CreateUserForRegistration creates or resolves a user for the given
  // registration session. Returns the user ID and auth tokens.
  rpc CreateUserForRegistration(CreateUserForRegistrationRequest) returns (CreateUserForRegistrationResponse);

  // UpdateRegistrationSession updates an in-progress registration session's
  // step, form data, or Stripe-related fields. Returns the updated session.
  rpc UpdateRegistrationSession(UpdateRegistrationSessionRequest) returns (UpdateRegistrationSessionResponse);

  // ListRegistrationSessions returns a paginated list of open (uncompleted)
  // registration sessions for the authenticated user.
  rpc ListRegistrationSessions(ListRegistrationSessionsRequest) returns (ListRegistrationSessionsResponse);

  // CreateRegistrationCheckout creates a Stripe checkout session for a
  // registration session. Creates the Stripe customer, product, price, and
  // checkout session using recovery points for crash safety.
  rpc CreateRegistrationCheckout(CreateRegistrationCheckoutRequest) returns (CreateRegistrationCheckoutResponse);

  // CompleteRegistration finalizes a registration session by creating the
  // production account, sandbox account, roles, permissions, and account-user
  // records in the core-service, then marks the session as completed.
  rpc CompleteRegistration(CompleteRegistrationRequest) returns (CompleteRegistrationResponse);

  // ConfirmRegistrationPayment verifies a Stripe checkout session's payment
  // status and, if complete, marks the registration session's payment as done
  // and records the subscription ID.
  rpc ConfirmRegistrationPayment(ConfirmRegistrationPaymentRequest) returns (ConfirmRegistrationPaymentResponse);
}

// CompleteRegistrationRequest carries the session ID to finalize.
message CompleteRegistrationRequest {
  // SessionId is the prefixed unique identifier of the registration session.
  string session_id = 1;
}

// CompleteRegistrationResponse returns the IDs of the newly created accounts.
message CompleteRegistrationResponse {
  // AccountId is the new production account's prefixed ID.
  string account_id = 1;
  // SandboxId is the new sandbox account's prefixed ID.
  string sandbox_id = 2;
}

// LoginRequest carries the credentials for user authentication.
message LoginRequest {
  // Identifier is the user's email address, username, or user ID. The
  // auth-service resolves the user by trying each format in order.
  string identifier = 1;
  // Password is the plaintext password to verify against the stored bcrypt hash.
  string password = 2;
}

// LoginResponse is returned by Login, Register, and ResetPassword. It contains
// everything the client needs to establish an authenticated session.
message LoginResponse {
  // AccessToken is a short-lived JWT (typically 1 hour) used to
  // authenticate subsequent API requests via the Authorization header.
  string access_token = 1;
  // RefreshToken is a long-lived opaque token (typically 30 days) stored
  // in the database. The client exchanges it for a new access token when
  // the current one expires.
  string refresh_token = 2;
  // User is the authenticated user's profile data.
  User user = 3;
}

// User represents a user profile as returned to API clients. Optional fields
// are absent when the user hasn't set them (e.g. username, profile image).
message User {
  // ID is the prefixed unique identifier (e.g. "us_1wjfmmbwg8l7").
  string id = 1;
  // Email is the user's email address. Optional because some auth flows
  // (e.g. future OAuth) may not provide one.
  optional string email = 2;
  // Name is the user's display name.
  optional string name = 3;
  // Username is the user's unique handle.
  optional string username = 4;
  // ImageURL is the absolute URL to the user's profile avatar.
  optional string image_url = 5;
  // EmailVerified is the timestamp when the user confirmed their email.
  // Absent (null) if the email has not been verified yet.
  optional google.protobuf.Timestamp email_verified = 6;
  // CreatedAt is when the user record was created.
  google.protobuf.Timestamp created_at = 7;
  // UpdatedAt is when the user record was last modified.
  google.protobuf.Timestamp updated_at = 8;
}

// Credential is sent by the api-gateway to ValidateCredential on every
// authenticated request. It wraps the raw bearer token and the optional
// target account context.
message Credential {
  // Token is the bearer token from the Authorization header. It may be a
  // JWT access token (for user sessions) or an API key (for programmatic
  // access). The auth-service determines the type by inspecting the token
  // format.
  string token = 1;
  // TargetAccountID is the account the caller wants to operate on, taken
  // from the Account-ID header. When absent, the auth-service resolves
  // the user's default account.
  optional string target_account_id = 2;
}

// Identity is the resolved authentication context returned by
// ValidateCredential. The api-gateway serializes it into gRPC metadata
// so downstream services know who is making the request, what account
// they're targeting, and what permissions they have.
message Identity {
  // Type indicates whether the caller authenticated as a user, API key,
  // or is unauthenticated (public endpoint).
  IdentityType type = 1;
  // TargetAccountID is the resolved account the request operates on.
  // Absent for unauthenticated requests.
  optional string target_account_id = 2;
  // Actor contains the authenticated entity's details (ID, role,
  // permissions).
  IdentityActor actor = 3;
  // AccountMode indicates whether the target account is in production or
  // sandbox mode, controlling which data partition the request accesses.
  AccountMode account_mode = 4;
  // SubscriptionStatus is the Stripe subscription status for the target
  // account. Absent for free-tier or unauthenticated requests.
  optional string subscription_status = 5;
}

// IdentityActor describes the authenticated entity (user or API key) and
// its authorization context within the target account.
message IdentityActor {
  // Type classifies the actor's relationship to the target account
  // (internal member, customer, supplier, or unassigned).
  IdentityActorType type = 1;
  // ID is the actor's unique identifier — a user ID (e.g. "us_1wjfmmbwg8l7")
  // for user identities or an API key ID (e.g. "apke_xyz789") for API
  // key identities.
  string id = 2;
  // Name is the actor's display name, used in audit logs and UI.
  optional string name = 3;
  // AccountID is the account the actor belongs to (their "home" account),
  // which may differ from the target account in cross-account scenarios.
  optional string account_id = 4;
  // RoleID is the actor's role within the target account (e.g.
  // "role_owner", "role_member").
  optional string role_id = 5;
  // RoleTypeCode is the role's type code (e.g. "owner", "admin",
  // "member") used for coarse-grained authorization checks.
  optional string role_type_code = 6;
  // Permissions is the actor's resolved permission set for the target
  // account. Keys are permission codes (e.g. "invoices.create"), values
  // are always true (the map only contains granted permissions).
  map<string, bool> permissions = 7;
}

// IdentityType classifies how the caller authenticated.
enum IdentityType {
  IDENTITY_TYPE_UNSPECIFIED = 0;
  // IDENTITY_TYPE_USER indicates authentication via a JWT access token
  // issued to a human user.
  IDENTITY_TYPE_USER = 1;
  // IDENTITY_TYPE_API_KEY indicates authentication via a programmatic
  // API key (prefixed with the key secret).
  IDENTITY_TYPE_API_KEY = 2;
  // IDENTITY_TYPE_UNAUTHENTICATED indicates no valid credential was
  // provided. Used for public endpoints that still propagate identity
  // metadata.
  IDENTITY_TYPE_UNAUTHENTICATED = 3;
}

// IdentityActorType classifies the actor's relationship to the target
// account. This determines what data the actor can see and what
// operations they can perform.
enum IdentityActorType {
  IDENTITY_ACTOR_TYPE_UNSPECIFIED = 0;
  // IDENTITY_ACTOR_TYPE_INTERNAL means the actor is a direct member of
  // the target account (e.g. an employee of the business).
  IDENTITY_ACTOR_TYPE_INTERNAL = 1;
  // IDENTITY_ACTOR_TYPE_CUSTOMER means the actor belongs to a customer
  // account that has a business relationship with the target account.
  IDENTITY_ACTOR_TYPE_CUSTOMER = 2;
  // IDENTITY_ACTOR_TYPE_SUPPLIER means the actor belongs to a supplier
  // account that has a business relationship with the target account.
  IDENTITY_ACTOR_TYPE_SUPPLIER = 3;
  // IDENTITY_ACTOR_TYPE_UNASSIGNED means the actor is authenticated but
  // not yet associated with any account (e.g. a newly registered user
  // who hasn't completed onboarding).
  IDENTITY_ACTOR_TYPE_UNASSIGNED = 4;
}

// AccountMode distinguishes between production and sandbox data partitions.
// Sandbox accounts mirror production behavior but use isolated data, allowing
// developers to test integrations without affecting real records.
enum AccountMode {
  ACCOUNT_MODE_UNSPECIFIED = 0;
  // ACCOUNT_MODE_PRODUCTION is the live data partition.
  ACCOUNT_MODE_PRODUCTION = 1;
  // ACCOUNT_MODE_SANDBOX is the isolated test data partition.
  ACCOUNT_MODE_SANDBOX = 2;
}

// RegisterRequest carries the data needed to create a new user account.
message RegisterRequest {
  // Email is the user's email address, used for login and notifications.
  string email = 1;
  // Password is the plaintext password (8-72 chars, must contain a digit
  // and special character). It is bcrypt-hashed before storage.
  string password = 2;
  // Name is the user's display name.
  string name = 3;
}

// RefreshTokenRequest carries the refresh token to exchange for a new
// access token.
message RefreshTokenRequest {
  // RefreshToken is the opaque refresh token previously issued by Login
  // or Register. It is validated against the database and must not be
  // expired or revoked.
  string refresh_token = 1;
}

// RefreshTokenResponse contains the newly minted access token.
message RefreshTokenResponse {
  // AccessToken is a fresh short-lived JWT.
  string access_token = 1;
}

// RequestPasswordResetRequest initiates the password reset flow.
message RequestPasswordResetRequest {
  // Identifier is the user's email, username, or ID. The service looks
  // up the user and sends a reset email if found.
  string identifier = 1;
  // AccountSlug optionally scopes the reset email's branding and links
  // to a specific account context (e.g. custom login page URL).
  optional string account_slug = 2;
}

// ResetPasswordRequest completes the password reset flow.
message ResetPasswordRequest {
  // Token is the single-use reset token from the email link. It is
  // validated for expiry and prior use before the password is changed.
  string token = 1;
  // Password is the new plaintext password to set.
  string password = 2;
}

// RevokeRefreshTokenRequest invalidates a specific refresh token.
message RevokeRefreshTokenRequest {
  // RefreshToken is the token to revoke. After revocation it can no
  // longer be used to mint access tokens.
  string refresh_token = 1;
}

// UpdatePasswordRequest changes the authenticated user's password.
message UpdatePasswordRequest {
  // OldPassword is the user's current plaintext password, verified
  // before the change is applied.
  string old_password = 1;
  // NewPassword is the new plaintext password to set.
  string new_password = 2;
}

// CreateAPIKeyRequest carries the data needed to create a new API key.
message CreateAPIKeyRequest {
  // RoleID is the role to assign to the API key.
  string role_id = 1;
  // Name is a human-readable label for the API key.
  string name = 2;
  // ExpiresAt is an optional expiration timestamp for the API key.
  optional google.protobuf.Timestamp expires_at = 3;
  // Includes specifies which related objects to expand (e.g. "role").
  repeated string includes = 4;
}

// CreateAPIKeyResponse is returned after successfully creating an API key.
message CreateAPIKeyResponse {
  // APIKeySecret is the full secret value, shown only at creation time.
  string api_key_secret = 1;
  // APIKey is the API key metadata.
  APIKeyInfo api_key = 2;
}

// RotateAPIKeyRequest carries the ID of the API key to rotate and an optional
// expiration override. If expires_at is not set, the new key inherits the old
// key's expiration.
message RotateAPIKeyRequest {
  // APIKeyID is the prefixed unique identifier of the key to rotate.
  string api_key_id = 1;
  // ExpiresAt is an optional expiration timestamp override for the new API key.
  optional google.protobuf.Timestamp expires_at = 2;
  // Includes specifies which related objects to expand (e.g. "role").
  repeated string includes = 3;
}

// RotateAPIKeyResponse is returned after successfully rotating an API key.
message RotateAPIKeyResponse {
  // APIKeySecret is the full secret value of the new key, shown only once.
  string api_key_secret = 1;
  // APIKey is the new API key's metadata.
  APIKeyInfo api_key = 2;
}

// RevokeAPIKeyRequest carries the ID of the API key to revoke.
message RevokeAPIKeyRequest {
  // APIKeyID is the prefixed unique identifier of the key to revoke.
  string api_key_id = 1;
}

// ListAPIKeysRequest carries pagination and search parameters for listing
// API keys.
message ListAPIKeysRequest {
  // Cursor is the opaque pagination cursor from a previous response's
  // next_cursor field. Omit for the first page.
  optional string cursor = 1;
  // Limit is the maximum number of API keys to return per page.
  int32 limit = 2;
  // Query is an optional search string to filter API keys by name.
  optional string query = 3;
  // Statuses filters API keys by status. Valid values: "active", "expired",
  // "revoked". When empty, all statuses are included.
  repeated string statuses = 4;
  // Includes specifies which related objects to expand (e.g. "role").
  repeated string includes = 5;
}

// PageInfo contains cursor-based pagination metadata.
message PageInfo {
  optional string next_cursor = 1;
  optional string prev_cursor = 2;
  bool has_next_page = 3;
  bool has_prev_page = 4;
}

// ListAPIKeysResponse contains a page of API key metadata plus pagination
// indicators.
message ListAPIKeysResponse {
  // APIKeys is the list of API key metadata for this page.
  repeated APIKeyInfo api_keys = 1;
  // Pagination metadata.
  PageInfo page_info = 4;
}

// GetAPIKeyRequest carries the ID of the API key to retrieve.
message GetAPIKeyRequest {
  // APIKeyID is the prefixed unique identifier of the key to retrieve.
  string api_key_id = 1;
  // Includes specifies which related objects to expand (e.g. "role").
  repeated string includes = 2;
}

// GetAPIKeyResponse contains the API key metadata.
message GetAPIKeyResponse {
  // APIKey is the API key metadata.
  APIKeyInfo api_key = 1;
}

// APIKeyInfo represents API key metadata as returned to API clients.
message APIKeyInfo {
  // ID is the prefixed unique identifier (e.g. "ak_01gf7a8200eaj8fke1xvw4h50x").
  string id = 1;
  // Name is the human-readable label for the API key.
  string name = 2;
  // RedactedValue is the redacted API key value for display purposes.
  string redacted_value = 3;
  // RoleID is the role assigned to this API key.
  optional string role_id = 4;
  // RoleName is the display name of the assigned role.
  optional string role_name = 5;
  // CreatedAt is when the API key was created.
  google.protobuf.Timestamp created_at = 6;
  // UpdatedAt is when the API key was last modified.
  google.protobuf.Timestamp updated_at = 7;
  // LastUsedAt is when the API key was last used to authenticate a request.
  optional google.protobuf.Timestamp last_used_at = 8;
  // ExpiresAt is when the API key expires.
  optional google.protobuf.Timestamp expires_at = 9;
  // RevokedAt is when the API key was revoked.
  optional google.protobuf.Timestamp revoked_at = 10;
  // RoleTypeCode is the type code of the assigned role.
  optional string role_type_code = 11;
}

// GetOrCreateDocAPIKeyRequest is empty because the caller's identity is
// extracted from gRPC metadata.
message GetOrCreateDocAPIKeyRequest {
  // Includes specifies which related objects to expand (e.g. "role").
  repeated string includes = 1;
}

// GetOrCreateDocAPIKeyResponse contains the full API key secret (decrypted
// from storage) and the API key metadata.
message GetOrCreateDocAPIKeyResponse {
  // APIKeySecret is the full secret value for the documentation key.
  string api_key_secret = 1;
  // APIKey is the API key metadata.
  APIKeyInfo api_key = 2;
}

// CreateRegistrationSessionRequest carries the data needed to start a new
// registration session.
message CreateRegistrationSessionRequest {
  // Email is the email address for the registration session.
  string email = 1;
  // PlanCode is the pricing plan code selected during registration
  // (e.g. "starter", "professional").
  string plan_code = 2;
}

// CreateRegistrationSessionResponse is returned after creating (or
// retrieving an existing) registration session.
message CreateRegistrationSessionResponse {
  // SessionId is the prefixed unique identifier of the registration session
  // (e.g. "rgfl_01gf7a8200eaj8fke1xvw4h50x").
  string session_id = 1;
}

// ResendVerificationEmailRequest carries the session ID for which to
// resend the verification email.
message ResendVerificationEmailRequest {
  // SessionId is the prefixed unique identifier of the registration session.
  string session_id = 1;
}

// RegistrationSessionData holds mutable form data collected across registration steps.
message RegistrationSessionData {
  optional string user_name = 1;
  optional string account_name = 2;
  optional string billing_address_line1 = 3;
  optional string billing_address_line2 = 4;
  optional string billing_address_city = 5;
  optional string billing_address_state = 6;
  optional string billing_address_postal_code = 7;
  optional string billing_address_country = 8;
}

// RegistrationSessionInfo is the full registration session state returned by
// verify-token and future step endpoints.
message RegistrationSessionInfo {
  string id = 1;
  string email = 2;
  string plan_code = 3;
  string step = 4;
  bool is_email_verified = 5;
  optional bool is_existing_user = 6;
  optional string user_id = 7;
  optional string account_id = 8;
  optional string stripe_customer_id = 9;
  optional string stripe_checkout_session_id = 10;
  optional string stripe_subscription_id = 11;
  bool payment_completed = 12;
  RegistrationSessionData session_data = 13;
  optional google.protobuf.Timestamp completed_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

// VerifyRegistrationTokenRequest carries the verification token from the
// email link.
message VerifyRegistrationTokenRequest {
  // Token is the verification token sent to the user's email.
  string token = 1;
}

// VerifyRegistrationTokenResponse contains the updated registration session
// after email verification.
message VerifyRegistrationTokenResponse {
  // Session is the full registration session state after verification.
  RegistrationSessionInfo session = 1;
}

// GetRegistrationSessionRequest carries the session ID to look up.
message GetRegistrationSessionRequest {
  // SessionId is the prefixed unique identifier of the registration session.
  string session_id = 1;
}

// GetRegistrationSessionResponse contains the registration session state.
message GetRegistrationSessionResponse {
  // Session is the full registration session state.
  RegistrationSessionInfo session = 1;
}

// CreateUserForRegistrationRequest carries the data needed to create a user
// for a registration session.
message CreateUserForRegistrationRequest {
  // SessionId is the prefixed unique identifier of the registration session.
  string session_id = 1;
  // Name is the display name for the new user.
  string name = 2;
  // Password is the plaintext password for the new user account.
  string password = 3;
}

// CreateUserForRegistrationResponse contains the created user's ID and
// auth tokens for immediate login.
message CreateUserForRegistrationResponse {
  // UserID is the prefixed unique identifier of the created or existing user.
  string user_id = 1;
  // AccessToken is a short-lived JWT for authenticating subsequent requests.
  string access_token = 2;
  // RefreshToken is a long-lived token for obtaining new access tokens.
  string refresh_token = 3;
}

// UpdateRegistrationSessionRequest carries the fields to update on an
// in-progress registration session. All fields except session_id are optional;
// only provided fields are applied.
message UpdateRegistrationSessionRequest {
  // SessionId is the prefixed unique identifier of the registration session.
  string session_id = 1;
  // Step optionally advances the session to a new registration step.
  optional string step = 2;
  // SessionData optionally updates the mutable form data (user name, account
  // name, billing address).
  optional RegistrationSessionData session_data = 3;
  // StripeCustomerID optionally sets the Stripe customer ID on the session.
  optional string stripe_customer_id = 4;
  // PaymentCompleted optionally marks whether payment has been completed.
  optional bool payment_completed = 5;
  // StripeSubscriptionID optionally sets the Stripe subscription ID on the session.
  optional string stripe_subscription_id = 6;
}

// UpdateRegistrationSessionResponse contains the updated registration session.
message UpdateRegistrationSessionResponse {
  // Session is the full registration session state after the update.
  RegistrationSessionInfo session = 1;
}

// ListRegistrationSessionsRequest carries pagination parameters for listing
// open registration sessions.
message ListRegistrationSessionsRequest {
  // Cursor is the opaque pagination cursor from a previous response's
  // next_cursor field. Omit for the first page.
  optional string cursor = 1;
  // Limit is the maximum number of sessions to return per page.
  int32 limit = 2;
}

// ListRegistrationSessionsResponse contains a page of registration sessions
// plus pagination indicators.
message ListRegistrationSessionsResponse {
  // Sessions is the list of open registration sessions for this page.
  repeated RegistrationSessionInfo sessions = 1;
  // Pagination metadata.
  PageInfo page_info = 4;
}

// CreateRegistrationCheckoutRequest carries the session ID for which to
// create a Stripe checkout session.
message CreateRegistrationCheckoutRequest {
  // SessionId is the prefixed unique identifier of the registration session.
  string session_id = 1;
}

// CreateRegistrationCheckoutResponse contains the Stripe checkout session
// details needed by the frontend to render the embedded checkout form.
message CreateRegistrationCheckoutResponse {
  // ClientSecret is the Stripe checkout session's client secret for the
  // embedded checkout UI.
  string client_secret = 1;
  // CheckoutID is the Stripe checkout session ID.
  string checkout_id = 2;
  // StripeCustomerID is the Stripe customer ID created for this registration.
  string stripe_customer_id = 3;
  // PublishableKey is the Stripe publishable key for the frontend.
  string publishable_key = 4;
  // Field 5 was checkout_url (removed — embedded mode does not return a URL).
  reserved 5;
  reserved "checkout_url";
}

// ConfirmRegistrationPaymentRequest carries the session and checkout session
// IDs to verify payment completion.
message ConfirmRegistrationPaymentRequest {
  // SessionId is the prefixed unique identifier of the registration session.
  string session_id = 1;
  // CheckoutSessionId is the Stripe checkout session ID to verify.
  string checkout_session_id = 2;
}

// ConfirmRegistrationPaymentResponse contains the checkout session status and,
// when complete, the subscription and customer IDs.
message ConfirmRegistrationPaymentResponse {
  // Status is the Stripe checkout session status (e.g. "complete", "open").
  string status = 1;
  // SubscriptionId is the Stripe subscription ID, present when payment is complete.
  optional string subscription_id = 2;
  // StripeCustomerId is the Stripe customer ID associated with the checkout.
  optional string stripe_customer_id = 3;
}
