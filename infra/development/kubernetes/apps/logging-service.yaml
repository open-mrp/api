apiVersion: apps/v1
kind: Deployment
metadata:
    name: logging-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: logging-service
    template:
        metadata:
            labels:
                app: logging-service
        spec:
            containers:
                - name: logging-service
                  image: augno-api/logging-service
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "50m"
                      limits:
                          memory: "128Mi"
                          cpu: "200m"
                  env:
                      - name: OTEL_SERVICE_NAME
                        value: logging-service
                      - name: OTEL_ENVIRONMENT
                        valueFrom:
                            configMapKeyRef:
                                key: PLATFORM
                                name: app-config
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: http://otel-collector:4318
                      - name: OTEL_EXPORTER_OTLP_PROTOCOL
                        value: http
                      - name: OTEL_EXPORTER_OTLP_INSECURE
                        value: "true"
                      - name: DB_URL
                        valueFrom:
                            secretKeyRef:
                                name: database-credentials
                                key: uri
                      - name: RABBITMQ_URI
                        valueFrom:
                            secretKeyRef:
                                name: rabbitmq-credentials
                                key: uri
                      - name: PLATFORM
                        valueFrom:
                            configMapKeyRef:
                                key: PLATFORM
                                name: app-config
---
apiVersion: v1
kind: Service
metadata:
    name: logging-service
spec:
    selector:
        app: logging-service
    ports:
        - port: 9092
          name: grpc
          targetPort: 9092
    type: ClusterIP
