syntax = "proto3";

// Package core defines additional gRPC services for the core-service.
// CoreFulfillmentService handles machine management RPCs.
package core;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "core/core.proto";
import "core/core_fuzzy_identifiers.proto";
import "core/core_async.proto";

option go_package = "shared/proto/core;core";

service CoreFulfillmentService {
  // ListMachines returns a paginated list of machines for the target account.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);

  // ExportMachines renders the target account's machines as a spreadsheet.
  rpc ExportMachines(ExportMachinesRequest) returns (ExportMachinesResponse);

  // GetMachine returns a single machine by its ID.
  rpc GetMachine(GetMachineRequest) returns (GetMachineResponse);

  // ListMachineStatus returns what every machine is running right now.
  rpc ListMachineStatus(ListMachineStatusRequest) returns (ListMachineStatusResponse);

  // CreateMachine creates a new machine for the target account.
  rpc CreateMachine(CreateMachineRequest) returns (CreateMachineResponse);

  // UpdateMachine updates an existing machine's metadata.
  rpc UpdateMachine(UpdateMachineRequest) returns (UpdateMachineResponse);

  // BulkUpsertMachines creates or updates machines matched by name.
  rpc BulkUpsertMachines(BulkUpsertMachinesRequest) returns (BulkUpsertMachinesResponse);

  // DeleteMachine deletes a machine by its ID.
  rpc DeleteMachine(DeleteMachineRequest) returns (google.protobuf.Empty);

  // BatchGetMachinesByIDs returns machines by their IDs for include resolution.
  rpc BatchGetMachinesByIDs(BatchGetMachinesByIDsRequest) returns (BatchGetMachinesByIDsResponse);
}

// MachineInfo represents a machine resource returned by the core-service.
message MachineInfo {
  string id = 1;
  string name = 2;
  string serial_number = 3;
  optional string notes = 4;
  optional string department_id = 5;
  optional string department_name = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  optional google.protobuf.Timestamp department_created_at = 9;
  optional google.protobuf.Timestamp department_updated_at = 10;
}

message ListMachinesRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
  repeated string includes = 4;
}

message ListMachinesResponse {
  repeated MachineInfo machines = 1;
  PageInfo page_info = 2;
}

message ExportMachinesRequest {
  optional string query = 1;
}
message ExportMachinesResponse {
  JobInfo job = 1;
}

message GetMachineRequest {
  string id = 1;
  repeated string includes = 2;
}

message GetMachineResponse {
  MachineInfo machine = 1;
}

message CreateMachineRequest {
  string name = 1;
  string serial_number = 2;
  optional string notes = 3;
  string department_id = 4;
  repeated string includes = 5;
}

message CreateMachineResponse {
  MachineInfo machine = 1;
}

message UpdateMachineRequest {
  string id = 1;
  optional string name = 2;
  optional string serial_number = 3;
  optional string notes = 4;
  repeated string includes = 5;
}

message UpdateMachineResponse {
  MachineInfo machine = 1;
}

message DeleteMachineRequest {
  string id = 1;
}

// A single machine in a bulk upsert, matched by name OR serial number
// (case-insensitive) within the account. The department is referenced by name,
// resolved server-side, and confirms matching intent: updates must state the
// machine's current department, and a key matching a machine in a different
// department is rejected as a collision.
message UpsertMachineInput {
  string name = 1;
  string serial_number = 2;
  optional string notes = 3;
  ObjectIdentifier department = 4;
}

message BulkUpsertMachinesRequest {
  repeated UpsertMachineInput machines = 1;
}

message BulkUpsertMachinesResponse {
  JobInfo job = 1;
}

message BatchGetMachinesByIDsRequest {
  repeated string ids = 1;
}

message BatchGetMachinesByIDsResponse {
  repeated MachineInfo machines = 1;
}


message ListMachineStatusRequest {
  optional google.protobuf.Timestamp as_of = 1;
  repeated string department_ids = 2;
}

// MachineCampaignInfo is one campaign on a machine with how far through it the floor is.
message MachineCampaignInfo {
  string production_schedule_line_id = 1;
  string item_id = 2;
  string sku = 3;
  google.protobuf.Timestamp week_start_date = 4;
  int32 week_index = 5;
  double planned_quantity = 6;
  double scanned_quantity = 7;
  double remaining_quantity = 8;
  optional string unit = 9;
  int64 released_batch_count = 10;
  int64 scanned_batch_count = 11;
  double planned_run_hours = 12;
  string status_code = 13;
  optional string production_run_id = 14;
}

message MachineDowntimeSummaryInfo {
  string event_id = 1;
  string reason = 2;
  string reason_name = 3;
  string oee_bucket = 4;
  google.protobuf.Timestamp started_at = 5;
  optional string note = 6;
}

message MachineStatusInfo {
  string machine_id = 1;
  string machine_name = 2;
  optional string department_id = 3;
  optional string department_name = 4;
  string status = 5;
  optional MachineDowntimeSummaryInfo downtime = 6;
  optional MachineCampaignInfo current = 7;
  optional MachineCampaignInfo next = 8;
  double week_planned_quantity = 9;
  double week_scanned_quantity = 10;
  double week_planned_run_hours = 11;
  optional string unit = 12;
}

message ListMachineStatusResponse {
  optional string production_schedule_id = 1;
  google.protobuf.Timestamp week_start_date = 2;
  repeated MachineStatusInfo machines = 3;
}
