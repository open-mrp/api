apiVersion: v1
kind: ConfigMap
metadata:
    name: app-config
data:
    PLATFORM: "development"
    PORT: "8081"
    AWS_REGION: "us-east-2"
    # MinIO in minikube stands in for S3 (platform/minio.yaml); the SDK signs for this host, so the browser needs `127.0.0.1 minio` in /etc/hosts to follow presigned URLs through the port-forward.
    S3_ENDPOINT_URL: "http://minio:9000"
    FRONTEND_URL: "http://localhost:4200"
    PORTAL_URL: "http://localhost:4300"
    ACCOUNT_PHOTOS_BUCKET: "augno-account-photos"
    USER_PHOTOS_BUCKET: "augno-user-photos"
    SHIPPING_LABELS_BUCKET: "augno-shipping-labels"
    EXPORTS_BUCKET: "augno-exports"
    CHAT_BUCKET: "augno-chat-attachments"
    PAYLOADS_BUCKET: "augno-payloads"
    # The email bridge's SES/SQS side runs only in production (PlatformMode.UsesAWSEmail); dev keeps
    # the domain so seeded inboxes (shared/db/seed/dev/0002_email_bridge.sql) render their addresses.
    INBOUND_EMAIL_DOMAIN: "mail.dev.openmrp.ai"
    AUTH_SERVICE_URL: "auth-service:9092"
    CORE_SERVICE_URL: "core-service:9092"
    NOTIFICATION_SERVICE_URL: "notification-service:9092"
    PLATFORM_SERVICE_URL: "platform-service:9092"
    AGENT_SERVICE_URL: "agent-service:9092"
    REDIS_URL: "redis://redis:6379/0"
    # api-gateway internal listener (agent-service → api-gateway endpoint-tools).
    INTERNAL_PORT: "8091"
    API_GATEWAY_INTERNAL_URL: "http://api-gateway-internal:8091"