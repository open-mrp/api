syntax = "proto3";

// CoreService message types (imported by core.proto).
package core;

import "google/protobuf/timestamp.proto";
import "core/core_fuzzy_identifiers.proto";
import "core/core_async.proto";
import "core/core_identity_context.proto";
import "core/core_analytics.proto";
import "core/core_accounts_carriers.proto";
option go_package = "shared/proto/core;core";

message GetItemInventoryResponse {
  QuantityInfo on_hand = 1;
  QuantityInfo reserved = 2;
  QuantityInfo available_to_promise = 3;
  QuantityInfo short = 4;
}
message GetItemCostsRequest {
  string id = 1;
}
message GetItemCostsResponse {
  string direct_material_cost = 1;
  string direct_labor_cost = 2;
  string overhead_cost = 3;
  string total_cost = 4;
  string unit_id = 5;
}
message ItemTrendPoint {
  google.protobuf.Timestamp date = 1;
  string value = 2;
}
message GetItemTrendsRequest {
  string id = 1;
  string trend_type = 2;
}
message GetItemTrendsResponse {
  string trend_type = 1;
  repeated ItemTrendPoint points = 2;
}
message ExportItemsRequest {}
message ExportItemInfo {
  string id = 1;
  string sku = 2;
  optional string description = 3;
  optional string notes = 4;
  string item_type_code = 5;
  string category_name = 6;
  string account_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string on_hand_quantity = 10;
  string on_hand_unit_id = 11;
}
message ExportItemsResponse {
  repeated ExportItemInfo items = 1;
  int64 count = 2;
}
message UpdateItemRequest {
  string id = 1;
  optional string sku = 2;
  optional string description = 3;
  bool update_description = 4;
  optional string notes = 5;
  bool update_notes = 6;
  repeated string includes = 7;
}
message UpdateItemResponse {
  ItemInfo item = 1;
}
message AddItemAttributeRequest {
  string item_id = 1;
  string attribute_id = 2;
  repeated string includes = 3;
}
message AddItemAttributeResponse {
  ItemInfo item = 1;
}
message RemoveItemAttributeRequest {
  string item_id = 1;
  string attribute_id = 2;
  repeated string includes = 3;
}
message RemoveItemAttributeResponse {
  ItemInfo item = 1;
}
message ChangeItemCategoryRequest {
  string item_id = 1;
  string category_id = 2;
  repeated string includes = 3;
}
message ChangeItemCategoryResponse {
  ItemInfo item = 1;
}
message UpdateItemInventoryRequest {
  // 2 held quantity_change as a double. A quantity that has been through a binary float is not the
  // quantity that was sent: 20 lbs in grams is 9071.8474, which no double holds.
  reserved 2;
  reserved "quantity_change";
  string item_id = 1;
  optional bool reconcile = 3;
  optional string customer_id = 4;
  optional string location_id = 5;
  optional string lot_number = 6;
  string unit_id = 7;
  // Decimal string.
  string measure = 8;
}
message UpdateItemInventoryResponse {
  string message = 1;
}
message BulkCreateItemInput {
  string sku = 1;
  optional string description = 2;
  string item_category_id = 3;
  optional string product_line_id = 4;
}
message BulkCreateItemsRequest {
  repeated BulkCreateItemInput items = 1;
  string type = 2;
}
message BulkCreateItemResult {
  string sku = 1;
  bool success = 2;
  optional string error = 3;
  optional string item_id = 4;
}
message BulkCreateItemsResponse {
  repeated BulkCreateItemResult results = 1;
}
message UpsertItemPropertyInput {
  string name = 1;
  string value = 2;
}
message UpsertPartInput {
  string sku = 1;
  optional string description = 2;
  optional string notes = 3;
  ObjectIdentifier category = 4;
  // unit_price / unit_cost: numerator must be a currency unit, denominator the per-unit
  // basis. CreateRateInput is defined in core_analytics.proto.
  optional CreateRateInput unit_price = 5;
  optional CreateRateInput unit_cost = 6;
  repeated UpsertItemPropertyInput properties = 7;
}
message BulkUpsertPartsRequest {
  repeated UpsertPartInput parts = 1;
}
message BulkUpsertPartsResponse {
  JobInfo job = 1;
}
message UpsertProductInput {
  string sku = 1;
  optional string type = 2;
  optional string description = 3;
  optional string notes = 4;
  ObjectIdentifier category = 5;
  ObjectIdentifier product_line = 6;
  optional bool is_portal_ready = 7;
  optional CreateRateInput unit_price = 8;
  optional CreateRateInput unit_cost = 9;
  repeated UpsertItemPropertyInput properties = 10;
}
message BulkUpsertProductsRequest {
  repeated UpsertProductInput products = 1;
}
message BulkUpsertProductsResponse {
  JobInfo job = 1;
}
message UpsertMaterialInput {
  string sku = 1;
  optional string description = 2;
  optional string notes = 3;
  ObjectIdentifier category = 4;
  // order_point / lead_time: QuantityInput is defined in core_analytics.proto.
  optional QuantityInput order_point = 5;
  optional QuantityInput lead_time = 6;
  // unit_price / unit_cost: numerator must be a currency unit, denominator the per-unit
  // basis. CreateRateInput is defined in core_analytics.proto.
  optional CreateRateInput unit_price = 7;
  optional CreateRateInput unit_cost = 8;
  repeated UpsertItemPropertyInput properties = 9;
}
message BulkUpsertMaterialsRequest {
  repeated UpsertMaterialInput materials = 1;
}
message BulkUpsertMaterialsResponse {
  JobInfo job = 1;
}
message ChildAccountProto {
  string relation_id = 1;
  string account_id = 2;
  string account_name = 3;
  string external_number = 4;
  optional string email = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message ListChildAccountsRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
}
message ListChildAccountsResponse {
  repeated ChildAccountProto items = 1;
  PageInfo page_info = 2;
}
message AddChildAccountRequest {
  string child_account_id = 1;
}
message AddChildAccountResponse {
  ChildAccountProto child_account = 1;
}
message RemoveChildAccountRequest {
  string child_account_id = 1;
}
// Batched read for the api-gateway resourcekit resolver. IDs are relation_ids.
message BatchGetChildAccountsByIDsRequest {
  repeated string ids = 1;
}
message BatchGetChildAccountsByIDsResponse {
  repeated ChildAccountProto items = 1;
}
message BatchQuantityInfo {
  string id = 1;
  string measure = 2;
  string unit_id = 3;
  string unit_abbreviation = 4;
  string unit_type = 5;
}
message BaseBatchInfo {
  string id = 1;
  string item_id = 2;
  string item_sku = 3;
  BatchQuantityInfo quantity = 4;
  optional BatchQuantityInfo seconds = 5;
  optional BatchQuantityInfo waste = 6;
  optional string scanning_station_id = 7;
  optional string scanning_station_name = 8;
  optional string production_step_id = 9;
  optional string production_step_name = 10;
  optional string production_run_id = 11;
  optional string production_run_number = 12;
  optional google.protobuf.Timestamp closed_at = 13;
  optional google.protobuf.Timestamp scanned_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  optional string department_id = 17;
  optional string department_name = 18;
}
message BatchInfo {
  string id = 1;
  string item_id = 2;
  string item_sku = 3;
  BatchQuantityInfo quantity = 4;
  optional BatchQuantityInfo seconds = 5;
  optional BatchQuantityInfo waste = 6;
  optional string scanning_station_id = 7;
  optional string scanning_station_name = 8;
  optional string production_step_id = 9;
  optional string production_step_name = 10;
  optional string production_run_id = 11;
  optional string production_run_number = 12;
  repeated LightMachineInfo machines = 13;
  optional google.protobuf.Timestamp closed_at = 14;
  optional google.protobuf.Timestamp scanned_at = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  optional string department_id = 18;
  optional string department_name = 22;
  repeated BatchLotInfo lots = 19;
  repeated string input_batch_ids = 20;
  repeated string output_batch_ids = 21;
}
message BatchLotInfo {
  string lot_number = 1;
  string type = 2;
}
message LightMachineInfo {
  string id = 1;
  string name = 2;
  string serial_number = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}
message BatchFlowNodeInfo {
  BatchInfo batch = 1;
  repeated string input_batch_ids = 2;
  repeated string output_batch_ids = 3;
}
message ScanningProductionStepInfoProto {
  string id = 1;
  string name = 2;
  bool is_multi_part = 3;
}
message ScanningConsumptionInfo {
  string sku = 1;
  string demand_measure = 2;
  string demand_unit = 3;
  string inventory_measure = 4;
  string inventory_unit = 5;
  optional string instructions = 6;
}
message OpenBatchSummaryItemProto {
  string id = 1;
  string sku = 2;
}
message OpenBatchSummaryScanningStationProto {
  string id = 1;
}
message OpenBatchSummaryInfo {
  string department_name = 1;
  OpenBatchSummaryItemProto item = 2;
  OpenBatchSummaryScanningStationProto scanning_station = 3;
  string count = 4;
  string unit = 5;
}
message GetBatchFlowRequest {
  string batch_id = 1;
}
message GetBatchFlowResponse {
  repeated BatchFlowNodeInfo nodes = 1;
}
message ListBatchesByScanningStationRequest {
  string scanning_station_id = 1;
  optional string cursor = 2;
  int32 limit = 3;
  optional string query = 4;
}
message ListBatchesByScanningStationResponse {
  repeated BatchInfo batches = 1;
  PageInfo page_info = 2;
}
message GetBatchPossibleNextStepsRequest {
  string scanning_station_id = 1;
  string batch_id = 2;
}
message GetBatchPossibleNextStepsResponse {
  repeated ScanningProductionStepInfoProto steps = 1;
}
message AnalyzeOpenBatchesRequest {
  repeated string item_ids = 1;
  repeated string product_line_ids = 2;
}
message AnalyzeOpenBatchesResponse {
  repeated OpenBatchSummaryInfo summaries = 1;
}
message InitializeBatchRequest {
  string batch_id = 1;
  string scanning_station_id = 2;
}
message InitializeBatchResponse {
  BaseBatchInfo batch = 1;
}
message MoveBatchesRequest {
  repeated string batch_ids = 1;
  string production_step_id = 2;
  string scanning_station_id = 3;
}
message MoveBatchesResponse {
  BaseBatchInfo batch = 1;
}
message MergeBatchesRequest {
  repeated string batch_ids = 1;
  string scanning_station_id = 2;
  string production_step_id = 3;
}
message MergeBatchesResponse {
  BaseBatchInfo batch = 1;
}
message SplitBatchRequest {
  repeated string batch_ids = 1;
  string scanning_station_id = 2;
  string production_step_id = 3;
  BatchQuantityInfo firsts = 4;
  optional BatchQuantityInfo seconds = 5;
  optional BatchQuantityInfo waste = 6;
  bool close_batch = 7;
}
message SplitBatchResponse {
  BaseBatchInfo batch = 1;
}
message GetRemainingQuantityToSplitRequest {
  repeated string batch_ids = 1;
  string production_step_id = 2;
}
message GetRemainingQuantityToSplitResponse {
  BatchQuantityInfo quantity = 1;
}
message GetScanningStationConsumptionRequest {
  string scanning_station_id = 1;
  repeated string batch_ids = 2;
  optional string production_step_id = 3;
  optional BatchQuantityInfo split_quantity = 4;
}
message GetScanningStationConsumptionResponse {
  repeated ScanningConsumptionInfo consumptions = 1;
}
message CloseBatchRequest {
  string batch_id = 1;
}
message CloseBatchResponse {
  BaseBatchInfo batch = 1;
}
message DeleteBatchRequest {
  string batch_id = 1;
}
message DeleteBatchResponse {
  BaseBatchInfo batch = 1;
}
message DeleteManyBatchesRequest {
  repeated string batch_ids = 1;
}
message ListItemCategoriesRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
  optional string type = 4;
  repeated string includes = 5;
}
message ListItemCategoriesResponse {
  repeated ItemCategoryInfo item_categories = 1;
  PageInfo page_info = 2;
}
message ExportItemCategoriesRequest {
  optional string query = 1;
}
message ExportItemCategoriesResponse {
  JobInfo job = 1;
}
message GetItemCategoryRequest {
  string id = 1;
  repeated string includes = 2;
}
message GetItemCategoryResponse {
  ItemCategoryInfo item_category = 1;
}
message CreateItemCategoryRequest {
  string name = 1;
  string type = 2;
  string unit_group_id = 3;
  repeated string includes = 4;
}
message CreateItemCategoryResponse {
  ItemCategoryInfo item_category = 1;
}
message UpdateItemCategoryRequest {
  string id = 1;
  optional string name = 2;
  optional string notes = 3;
  repeated string includes = 4;
}
message UpdateItemCategoryResponse {
  ItemCategoryInfo item_category = 1;
}
message DeleteItemCategoryRequest {
  string id = 1;
}
message AddItemCategoryPropertyRequest {
  string id = 1;
  string property_id = 2;
}
message RemoveItemCategoryPropertyRequest {
  string id = 1;
  string property_id = 2;
}
message ChangeItemCategoryUnitGroupRequest {
  string id = 1;
  string unit_group_id = 2;
}
message BulkUpsertItemCategoryInput {
  string name = 1;
  optional string notes = 2;
  string type = 3;
  ObjectIdentifier unit_group = 4;
  repeated string property_names = 5;
}
message BulkUpsertItemCategoriesRequest {
  repeated BulkUpsertItemCategoryInput item_categories = 1;
}
message BulkUpsertItemCategoriesResponse {
  JobInfo job = 1;
}
message ConsumptionInfo {
  string id = 1;
  QuantityInfo quantity = 2;
  QuantityInfo waste_quantity = 3;
  string item_id = 4;
  string item_sku = 5;
  optional string item_description = 6;
  string item_type_code = 7;
  optional string instructions = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
message GetConsumptionRequest {
  string production_step_id = 1;
  string id = 2;
  repeated string includes = 3;
}
message GetConsumptionResponse {
  ConsumptionInfo consumption = 1;
}
