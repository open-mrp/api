name: CD

on:
    push:
        tags:
            - 'v*'

jobs:
    changes:
        name: Check for Changes
        runs-on: ubuntu-latest
        outputs:
            terraform: ${{ steps.filter.outputs.terraform }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Check for Changes
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      terraform:
                          - 'infra/production/terraform/**'

    terraform:
        name: Terraform Apply
        needs: changes
        if: needs.changes.outputs.terraform == 'true'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        defaults:
            run:
                working-directory: infra/production/terraform
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
                  aws-region: us-east-2

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Cache Terraform Providers
              uses: actions/cache@v4
              with:
                  path: |
                      .terraform/providers
                      .terraform.lock.hcl
                  key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}-${{ hashFiles('**/.terraform.lock.hcl') }}
                  restore-keys: |
                      ${{ runner.os }}-terraform-

            - name: Terraform Init
              run: terraform init

            - name: Terraform Apply
              run: terraform apply -auto-approve -input=false

    build-push:
        name: Build and Push
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: [api-gateway, auth-service, logging-service, notification-service]
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
                  aws-region: us-east-2

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: infra/production/docker/Dockerfile
                  push: true
                  platforms: linux/amd64
                  build-args: |
                      SERVICE_NAME=${{ matrix.service }}
                  tags: |
                      ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:${{ github.sha }}
                      ${{ steps.login-ecr.outputs.registry }}/augno/${{ matrix.service }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy to EKS
        needs: [terraform, build-push]
        if: |
            always() &&
            (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
            needs.build-push.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: arn:aws:iam::AWS_ACCOUNT_ID:role/github-action-role
                  aws-region: us-east-2

            - name: Deploy to EKS
              run: make deploy-prod
              env:
                  AWS_REGION: "us-east-2"
                  CLUSTER_NAME: "augno-prod"
                  IMAGE_TAG: ${{ github.sha }}
