syntax = "proto3";

// Package core defines additional gRPC services for the core-service.
// CoreJobService handles reads of the jobs that track asynchronous work.
package core;

import "google/protobuf/timestamp.proto";

option go_package = "shared/proto/core;core";

service CoreJobService {
  // GetJob returns a single job by its ID.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // CancelJob settles a job as cancelled. The job itself is not removed: it is returned carrying its new state.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  JobInfo job = 1;
}

message CancelJobRequest {
  string id = 1;
}

message CancelJobResponse {
  JobInfo job = 1;
}

// JobInfo represents a job: the record of a piece of asynchronous work, from the request that raised it through to its outcome.
message JobInfo {
  // 5-7 carried the creator's name, username and email, denormalized off account_user.
  // The gateway resolves the actor from created_by_id instead. 9 and 10 carried a
  // separate error list and one-line summary, both folded into results and error.
  reserved 5, 6, 7, 9, 10;
  string id = 1;
  string type = 2;
  string status = 3;
  optional string created_by_id = 4;
  JobResultList results = 8;
  optional google.protobuf.Timestamp started_at = 11;
  optional google.protobuf.Timestamp completed_at = 12;
  optional google.protobuf.Timestamp failed_at = 13;
  optional google.protobuf.Timestamp cancelled_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // Set only on a job whose work was rendering a file.
  optional ExportInfo export = 17;
  // Error is the failure that sank the job as a whole, as the canonical client-facing
  // error object in JSON — the same bytes a synchronous error response carries under its
  // `error` key. It stays JSON rather than becoming proto fields because both sides
  // already share the Go type that produces it (apierror.ResponseError), so there is
  // nothing here to keep in sync. A row that failed carries its own on the result.
  optional string error = 18;
  // ResourceType is the object type the job operates on, e.g. "production_run". It says
  // what a job that produced no results was for, which `type` — a verb — cannot.
  optional string resource_type = 19;
}

message JobResultList {
  repeated JobResultInfo items = 1;
  // Truncated reports that the executor recorded more rows than the list carries.
  bool truncated = 2;
}

// JobResultInfo is what became of one row of the request: the resource it produced, or
// the error it was rejected with.
message JobResultInfo {
  // 4 carried the sub-resources as bare ids, before they gained their object types.
  reserved 4;
  // Index is the zero-based row of the request this result names.
  int32 index = 1;
  // Id of the resource the row produced. Empty when the row failed.
  string id = 2;
  // "created", "updated" or "failed".
  string status = 3;
  // ResourceType is the object type of id, e.g. "product". Empty when the row failed.
  string resource_type = 5;
  // SubResources are resources produced alongside the row's own, e.g. a production run's
  // batches. Empty for operations that produce none.
  repeated JobSubResourceInfo sub_resources = 6;
  // Error is why the row was rejected, in the same JSON form as JobInfo.error. Empty
  // unless status is "failed".
  string error = 7;
}

// JobSubResourceInfo is one resource produced alongside a result row's own.
message JobSubResourceInfo {
  string id = 1;
  // ResourceType is the object type of id, e.g. "batch".
  string resource_type = 2;
}

// Points an export job at its download. It rides on JobInfo, so a client learns one
// shape for every export rather than one per resource.
message ExportInfo {
  // Fields 1-4 carried the file and its metadata before exports became jobs.
  reserved 1, 2, 3, 4;
  // Where to download the file.
  string url = 5;
}
