syntax = "proto3";

// Package core defines additional gRPC services for the core-service.
// CoreSalesService handles order discount and sales order status RPCs.
package core;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "core/core.proto";
import "core/core_patch.proto";
import "core/core_production_run.proto";

option go_package = "shared/proto/core;core";

service CoreSalesService {
  // ListOrderDiscounts returns a paginated list of order discounts.
  rpc ListOrderDiscounts(ListOrderDiscountsRequest) returns (ListOrderDiscountsResponse);

  // GetOrderDiscount returns a single order discount by its ID.
  rpc GetOrderDiscount(GetOrderDiscountRequest) returns (GetOrderDiscountResponse);

  // CreateOrderDiscount creates a new order discount.
  rpc CreateOrderDiscount(CreateOrderDiscountRequest) returns (CreateOrderDiscountResponse);

  // UpdateOrderDiscount updates an existing order discount.
  rpc UpdateOrderDiscount(UpdateOrderDiscountRequest) returns (UpdateOrderDiscountResponse);

  // DeleteOrderDiscount deletes an order discount by its ID.
  rpc DeleteOrderDiscount(DeleteOrderDiscountRequest) returns (DeleteOrderDiscountResponse);

  // FindOrderDiscountByCode looks up an order discount by its unique code.
  rpc FindOrderDiscountByCode(FindOrderDiscountByCodeRequest) returns (FindOrderDiscountByCodeResponse);

  // Returns order discounts by ID for the api-gateway include resolver.
  rpc BatchGetOrderDiscountsByIDs(BatchGetOrderDiscountsByIDsRequest) returns (BatchGetOrderDiscountsByIDsResponse);

  // ListSalesOrderStatuses returns a paginated list of sales order statuses.
  rpc ListSalesOrderStatuses(ListSalesOrderStatusesRequest) returns (ListSalesOrderStatusesResponse);

  // Returns sales order statuses by ID for the api-gateway include resolver.
  rpc BatchGetSalesOrderStatusesByIDs(BatchGetSalesOrderStatusesByIDsRequest) returns (BatchGetSalesOrderStatusesByIDsResponse);

  // ListSalesOrders returns a paginated list of sales orders.
  rpc ListSalesOrders(ListSalesOrdersRequest) returns (ListSalesOrdersResponse);

  // GetSalesOrder returns a single sales order by ID.
  rpc GetSalesOrder(GetSalesOrderRequest) returns (GetSalesOrderResponse);

  // Returns sales orders by ID for the api-gateway include resolver.
  rpc BatchGetSalesOrdersByIDs(BatchGetSalesOrdersByIDsRequest) returns (BatchGetSalesOrdersByIDsResponse);

  // CreateSalesOrder creates a new sales order.
  rpc CreateSalesOrder(CreateSalesOrderRequest) returns (CreateSalesOrderResponse);

  // UpdateSalesOrder updates an existing sales order.
  rpc UpdateSalesOrder(UpdateSalesOrderRequest) returns (UpdateSalesOrderResponse);

  // DeleteSalesOrder deletes a sales order by ID.
  rpc DeleteSalesOrder(DeleteSalesOrderRequest) returns (google.protobuf.Empty);

  // BulkDeleteSalesOrders deletes multiple sales orders.
  rpc BulkDeleteSalesOrders(BulkDeleteSalesOrdersRequest) returns (google.protobuf.Empty);

  // ChangeSalesOrderStatus changes the status of a sales order.
  rpc ChangeSalesOrderStatus(ChangeSalesOrderStatusRequest) returns (ChangeSalesOrderStatusResponse);

  // CheckoutSalesOrder initiates a checkout for a sales order.
  rpc CheckoutSalesOrder(CheckoutSalesOrderRequest) returns (CheckoutSalesOrderResponse);

  // QuoteSalesOrderLinePrices computes the unit price for each line without creating
  // an order, used to display prices to users (incl. the customer portal).
  rpc QuoteSalesOrderLinePrices(QuoteSalesOrderLinePricesRequest) returns (QuoteSalesOrderLinePricesResponse);

  // QuoteSalesOrderFreight re-estimates the freight (shipping) charge for an existing
  // order from its current ship-to, carrier, service level, and lines, without mutating it.
  rpc QuoteSalesOrderFreight(QuoteSalesOrderFreightRequest) returns (QuoteSalesOrderFreightResponse);

  // CreateSalesOrderProductionRun creates a production run from a sales order.
  rpc CreateSalesOrderProductionRun(CreateSalesOrderProductionRunRequest) returns (CreateSalesOrderProductionRunResponse);

  // CreateSalesOrderLine creates a new line on a sales order.
  rpc CreateSalesOrderLine(CreateSalesOrderLineRequest) returns (CreateSalesOrderLineResponse);

  // ListVolumeDiscounts returns a paginated list of volume discounts.
  rpc ListVolumeDiscounts(ListVolumeDiscountsRequest) returns (ListVolumeDiscountsResponse);

  // GetVolumeDiscount returns a single volume discount by ID.
  rpc GetVolumeDiscount(GetVolumeDiscountRequest) returns (GetVolumeDiscountResponse);

  // CreateVolumeDiscount creates a new volume discount.
  rpc CreateVolumeDiscount(CreateVolumeDiscountRequest) returns (CreateVolumeDiscountResponse);

  // UpdateVolumeDiscount updates an existing volume discount.
  rpc UpdateVolumeDiscount(UpdateVolumeDiscountRequest) returns (UpdateVolumeDiscountResponse);

  // DeleteVolumeDiscount deletes a volume discount by its ID.
  rpc DeleteVolumeDiscount(DeleteVolumeDiscountRequest) returns (google.protobuf.Empty);

  // UpdateSalesOrderLine updates an existing sales order line.
  rpc UpdateSalesOrderLine(UpdateSalesOrderLineRequest) returns (UpdateSalesOrderLineResponse);

  // DeleteSalesOrderLine deletes a sales order line.
  rpc DeleteSalesOrderLine(DeleteSalesOrderLineRequest) returns (google.protobuf.Empty);

  // ReorderSalesOrderLines re-sequences a sales order's product lines to match the
  // given order, keeping credit/freight lines at the bottom of the list.
  rpc ReorderSalesOrderLines(ReorderSalesOrderLinesRequest) returns (ReorderSalesOrderLinesResponse);

  // CreateCustomerCheckoutSession creates a checkout session for a customer order.
  rpc CreateCustomerCheckoutSession(CreateCustomerCheckoutSessionRequest) returns (CreateCustomerCheckoutSessionResponse);

  // RecordOrderPayment links a succeeded Stripe payment intent to a sales order.
  // Called by the billing-service when a checkout session completes. Idempotent.
  rpc RecordOrderPayment(RecordOrderPaymentRequest) returns (google.protobuf.Empty);

  // ProcessAccountStripeWebhook verifies a Stripe webhook event signed with an
  // account's own webhook secret and links succeeded payment intents to their
  // sales orders. Idempotent.
  rpc ProcessAccountStripeWebhook(ProcessAccountStripeWebhookRequest) returns (google.protobuf.Empty);
}

// RecordOrderPaymentRequest links a Stripe payment intent to a sales order.
message RecordOrderPaymentRequest {
  string sales_order_id = 1;
  string payment_intent_id = 2;
}

// ProcessAccountStripeWebhookRequest carries a raw Stripe webhook payload from
// an account's connected Stripe account for verification and processing.
message ProcessAccountStripeWebhookRequest {
  string account_id = 1;
  bytes raw_payload = 2;
  string stripe_signature = 3;
}

// OrderDiscountInfo represents an order discount resource returned by the core-service.
message OrderDiscountInfo {
  string id = 1;
  string name = 2;
  string code = 3;
  string percentage = 4;
  string amount = 5;
  string discount_type = 6;
  int32 order_count = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// SalesOrderStatusInfo represents a sales order status resource returned by the core-service.
message SalesOrderStatusInfo {
  string id = 1;
  string code = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListOrderDiscountsRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
}

message ListOrderDiscountsResponse {
  repeated OrderDiscountInfo order_discounts = 1;
  PageInfo page_info = 2;
}

message GetOrderDiscountRequest {
  string id = 1;
}

message GetOrderDiscountResponse {
  OrderDiscountInfo order_discount = 1;
}

message CreateOrderDiscountRequest {
  string name = 1;
  string code = 2;
  optional string percentage = 3;
  optional string amount = 4;
  string discount_type = 5;
}

message CreateOrderDiscountResponse {
  OrderDiscountInfo order_discount = 1;
}

message UpdateOrderDiscountRequest {
  string id = 1;
  optional string name = 2;
  optional string code = 3;
  optional string percentage = 4;
  optional string amount = 5;
  optional string discount_type = 6;
}

message UpdateOrderDiscountResponse {
  OrderDiscountInfo order_discount = 1;
}

message DeleteOrderDiscountRequest {
  string id = 1;
}

message DeleteOrderDiscountResponse {
  OrderDiscountInfo order_discount = 1;
}

message FindOrderDiscountByCodeRequest {
  string code = 1;
  optional string buyer_account_id = 2;
  optional string sales_order_id = 3;
}

message FindOrderDiscountByCodeResponse {
  OrderDiscountInfo order_discount = 1;
}

// Batched read for the api-gateway resourcekit resolver.
message BatchGetOrderDiscountsByIDsRequest {
  repeated string ids = 1;
}
message BatchGetOrderDiscountsByIDsResponse {
  repeated OrderDiscountInfo order_discounts = 1;
}

message ListSalesOrderStatusesRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
}

message ListSalesOrderStatusesResponse {
  repeated SalesOrderStatusInfo sales_order_statuses = 1;
  PageInfo page_info = 2;
}

// Batched read of full sales orders for the api-gateway resourcekit resolver.
message BatchGetSalesOrdersByIDsRequest {
  repeated string ids = 1;
}
message BatchGetSalesOrdersByIDsResponse {
  repeated SalesOrderInfo sales_orders = 1;
}

// Batched read for the api-gateway resourcekit resolver.
message BatchGetSalesOrderStatusesByIDsRequest {
  repeated string ids = 1;
}
message BatchGetSalesOrderStatusesByIDsResponse {
  repeated SalesOrderStatusInfo sales_order_statuses = 1;
}

// SalesOrderInfo represents a full sales order with all detail.
message SalesOrderInfo {
  string id = 1;
  string number = 2;
  optional string customer_po_number = 3;
  optional string note = 4;
  bool is_acknowledgment_sent = 5;
  // Address IDs
  string billing_address_id = 6;
  string shipping_address_id = 7;
  // Address details
  optional string bill_to_name = 8;
  optional string bill_to_street_line_1 = 9;
  optional string bill_to_street_line_2 = 10;
  optional string bill_to_locality = 11;
  optional string bill_to_state = 12;
  optional string bill_to_postal_code = 13;
  optional string bill_to_country = 14;
  optional string bill_to_phone = 15;
  optional string bill_to_email = 16;
  optional string ship_to_name = 17;
  optional string ship_to_street_line_1 = 18;
  optional string ship_to_street_line_2 = 19;
  optional string ship_to_locality = 20;
  optional string ship_to_state = 21;
  optional string ship_to_postal_code = 22;
  optional string ship_to_country = 23;
  optional string ship_to_phone = 24;
  optional string ship_to_email = 25;
  // Carrier
  optional string carrier_id = 26;
  optional string carrier_name = 27;
  optional string service_level_id = 28;
  optional string service_level_name = 29;
  optional string carrier_billing_type = 30;
  optional string carrier_billing_account = 31;
  // Customer
  string customer_id = 32;
  string customer_name = 33;
  string customer_number = 34;
  // Sales rep
  optional string sales_rep_id = 35;
  optional string sales_rep_name = 36;
  // Status
  string status_code = 37;
  string status_name = 38;
  // Type
  string type_code = 39;
  string type_name = 40;
  // Priority
  string priority_code = 41;
  string priority_name = 42;
  // Payment term
  optional string payment_term_id = 43;
  optional string payment_term_name = 44;
  // Shipping term
  optional string shipping_term_id = 45;
  optional string shipping_term_name = 46;
  // Order discount
  optional string order_discount_id = 47;
  optional string order_discount_name = 48;
  // Production run
  optional string production_run_id = 49;
  // Pick
  optional string pick_id = 50;
  // Lines (populated when included)
  repeated SalesOrderLineInfo lines = 51;
  // Timestamps
  optional google.protobuf.Timestamp issued_at = 52;
  optional google.protobuf.Timestamp completed_at = 53;
  optional google.protobuf.Timestamp first_ship_at = 54;
  optional google.protobuf.Timestamp expired_at = 55;
  optional google.protobuf.Timestamp promised_at = 56;
  google.protobuf.Timestamp created_at = 57;
  google.protobuf.Timestamp updated_at = 58;
  optional bool carrier_is_portal_enabled = 59;
  optional bool service_level_is_portal_enabled = 60;
  optional bool payment_term_is_active = 61;
  optional string shipping_term_type = 62;
  optional string priority_id = 63;
  optional string service_level_token = 64;
  optional string customer_status_code = 65;
  optional string customer_commission_policy = 66;
  optional google.protobuf.Timestamp service_level_created_at = 67;
  optional google.protobuf.Timestamp service_level_updated_at = 68;
  optional google.protobuf.Timestamp carrier_created_at = 69;
  optional google.protobuf.Timestamp carrier_updated_at = 70;
  // Customer timestamps
  optional google.protobuf.Timestamp customer_created_at = 71;
  optional google.protobuf.Timestamp customer_updated_at = 72;
  // Bill-to address type and timestamps
  optional bool bill_to_is_drop_ship = 73;
  optional string bill_to_geolocation_id = 74;
  optional google.protobuf.Timestamp bill_to_created_at = 75;
  optional google.protobuf.Timestamp bill_to_updated_at = 76;
  // Ship-to address type and timestamps
  optional bool ship_to_is_drop_ship = 77;
  optional string ship_to_geolocation_id = 78;
  optional google.protobuf.Timestamp ship_to_created_at = 79;
  optional google.protobuf.Timestamp ship_to_updated_at = 80;
  // Order discount full data
  optional string order_discount_code = 81;
  optional string order_discount_percentage = 82;
  optional string order_discount_amount = 83;
  optional string order_discount_discount_type = 84;
  optional int32 order_discount_order_count = 85;
  optional google.protobuf.Timestamp order_discount_created_at = 86;
  optional google.protobuf.Timestamp order_discount_updated_at = 87;
  // Payment term timestamps
  optional google.protobuf.Timestamp payment_term_created_at = 88;
  optional google.protobuf.Timestamp payment_term_updated_at = 89;
  // Shipping term timestamps
  optional google.protobuf.Timestamp shipping_term_created_at = 90;
  optional google.protobuf.Timestamp shipping_term_updated_at = 91;
  // Count of order lines (always populated, independent of the lines include).
  int32 line_count = 92;
  // IDs of shipments linked to this order (populated when related.shipments is
  // requested). The gateway builds the related.shipments record list from these.
  repeated string shipment_ids = 93;
  repeated string invoice_ids = 98;
  // Derived payment state: "unpaid", "partially_paid", or "paid". Always
  // populated; computed from settlement allocations vs. invoiced amounts plus
  // any Stripe payment intent.
  string payment_status = 94;
  // Invoice email recipients (populated when contacts is included).
  repeated string invoice_emails = 95;
  // Order acknowledgement email recipients (populated when contacts is included).
  repeated string acknowledgement_emails = 96;
  // Stripe payment intent IDs recorded against this order. Always populated.
  repeated string payment_intent_ids = 97;
  // Fulfillment progress as fractions between 0 and 1, aggregated over the
  // order's sale-type lines (quantity fulfilled / quantity ordered). Always
  // populated (independent of the lines include); 0 when there are no sale lines.
  double picked_completion = 101;
  double packed_completion = 102;
  double invoiced_completion = 103;
  // The contractual ship-by commitment, stamped at issue and cleared on unissue.
  optional google.protobuf.Timestamp ship_by_date = 104;
  optional int32 lead_time_days = 105;
  optional string lead_time_source_code = 106;
  // Carrier transit subtracted from a promised delivery date to reach ship_by_date.
  optional int32 transit_days = 107;
  optional string transit_source_code = 108;
}

// SalesOrderLineInfo represents a sales order line.
message SalesOrderLineInfo {
  string id = 1;
  int32 line_item_number = 2;
  string product_sku = 3;
  optional string product_description = 4;
  optional string product_id = 5;
  optional string item_id = 6;
  optional string item_sku = 7;
  optional string edi_line_item_id = 8;
  // Quantity ordered
  string quantity_id = 9;
  string quantity_value = 10;
  string quantity_unit_id = 11;
  string quantity_unit_name = 12;
  string quantity_unit_abbreviation = 13;
  string quantity_unit_type = 14;
  // Quantity picked
  optional string quantity_picked_value = 15;
  // Quantity packed
  optional string quantity_packed_value = 16;
  // Quantity invoiced
  optional string quantity_invoiced_value = 17;
  // Unit price
  string unit_price_id = 18;
  string unit_price_value = 19;
  string unit_price_numerator_unit_id = 20;
  string unit_price_numerator_unit_abbreviation = 21;
  string unit_price_denominator_unit_id = 22;
  string unit_price_denominator_unit_abbreviation = 23;
  // Unit cost
  optional string unit_cost_id = 24;
  optional string unit_cost_value = 25;
  optional string unit_cost_numerator_unit_id = 26;
  optional string unit_cost_numerator_unit_abbreviation = 27;
  optional string unit_cost_denominator_unit_id = 28;
  optional string unit_cost_denominator_unit_abbreviation = 29;
  // Timestamps
  reserved 30; // formerly completed_at (removed from sales order lines)
  google.protobuf.Timestamp created_at = 31;
  google.protobuf.Timestamp updated_at = 32;
  // Product type code (e.g. "sale", "service", "shipping", "credit", "tax"), used to distinguish physical sale lines from charge/adjustment lines.
  optional string product_type_code = 33;
}

// --- Sales Order Request/Response messages ---

message ListSalesOrdersRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
  repeated string status_codes = 4;
  repeated string item_ids = 5;
  repeated string product_line_ids = 6;
  repeated string customer_ids = 7;
  repeated string customer_group_ids = 8;
  repeated string sales_rep_ids = 9;
  optional string start_date = 10;
  optional string end_date = 11;
  reserved 12; // formerly exclude_internal_orders
  // If set, filters orders by buyer_account_id (for customer actor access).
  optional string buyer_account_id = 13;
  // Includes to expand (e.g. "lines"); inline-joined fields are always present.
  repeated string includes = 14;
  optional string ship_by_after = 15;
  optional string ship_by_before = 16;
  optional bool past_due = 17;
}

message ListSalesOrdersResponse {
  repeated SalesOrderInfo sales_orders = 1;
  PageInfo page_info = 2;
}

message GetSalesOrderRequest {
  string id = 1;
  repeated string includes = 2;
  // If set, filters by buyer_account_id (for customer actor access).
  optional string buyer_account_id = 3;
}

message GetSalesOrderResponse {
  SalesOrderInfo sales_order = 1;
}

message CreateSalesOrderRequest {
  string buyer_account_id = 1;
  optional string customer_po_number = 2;
  optional string note = 3;
  optional string carrier_id = 4;
  optional string service_level_id = 5;
  optional string carrier_billing_type = 6;
  optional string carrier_billing_account = 7;
  string priority_code = 8;
  optional string sales_rep_id = 9;
  optional string shipping_term_id = 10;
  // sales_order_type_code (11) removed: the order type is a storage discriminator
  // (always 'sales_order' for this endpoint), set in the repository layer — not API surface.
  reserved 11;
  optional string payment_term_id = 12;
  optional string order_discount_id = 13;
  // Flat bill_to_*/ship_to_* address fields (14-27) removed: create only accepts
  // existing address IDs, matching Dashboard (addresses are persisted separately).
  reserved 14 to 27;
  // Lines to create with the order
  repeated CreateSalesOrderLineInput lines = 28;
  // Email contact recipients for order acknowledgement emails
  repeated SalesOrderEmailContactInput acknowledgement_email_contacts = 29;
  // Email contact recipients for invoice emails
  repeated SalesOrderEmailContactInput invoice_email_contacts = 30;
  repeated string includes = 31;
  // Promised delivery date, stored at create time.
  optional google.protobuf.Timestamp promised_at = 32;
  // Existing bill-to / ship-to address IDs (required). The addresses must belong to
  // the order's owner or buyer account.
  string bill_to_address_id = 33;
  string ship_to_address_id = 34;
}

message SalesOrderEmailContactInput {
  string account_user_id = 1;
}

message CreateSalesOrderLineInput {
  string product_id = 1;
  // item_id (2) removed: the item is derived from the product. unit_cost (10-12)
  // removed: cost is pulled from the item on the backend. edi_line_item_id (13)
  // removed: not accepted on sales-order create.
  reserved 2, 10, 11, 12, 13;
  // product_sku / product_description default to the product's when omitted.
  optional string product_sku = 3;
  optional string product_description = 4;
  string quantity_value = 5;
  string quantity_unit_id = 6;
  // Unit price override (optional). Honored only for internal users; for customer
  // actors it is ignored and the price is computed server-side.
  optional string unit_price_value = 7;
  optional string unit_price_numerator_unit_id = 8;
  optional string unit_price_denominator_unit_id = 9;
}

message CreateSalesOrderResponse {
  SalesOrderInfo sales_order = 1;
}

message UpdateSalesOrderRequest {
  string id = 1;
  // Clearable nullable fields use *Patch (clear vs set vs leave); non-nullable
  // fields that can be changed but not cleared stay `optional`.
  StringPatch customer_po_number = 2;
  StringPatch note = 3;
  optional string carrier_id = 4;
  StringPatch service_level_id = 5;
  StringPatch carrier_billing_type = 6;
  StringPatch carrier_billing_account = 7;
  optional string priority_code = 8;
  StringPatch sales_rep_id = 9;
  optional string shipping_term_id = 10;
  optional string payment_term_id = 11;
  StringPatch order_discount_id = 12;
  // Address references. To change an address's contents, callers use the
  // update-address endpoint; the order update only re-points to an address ID.
  reserved 13 to 26;
  optional string billing_address_id = 34;
  optional string shipping_address_id = 35;
  // Additional updatable fields
  optional string number = 27;
  optional bool is_acknowledgment_sent = 28;
  TimestampPatch promised_at = 29;
  optional string customer_id = 30;
  // When set, replaces the acknowledgement email contacts on the order.
  // An empty list clears all acknowledgement contacts; nil/unset leaves existing contacts untouched.
  optional SalesOrderEmailContactList acknowledgement_email_contacts = 31;
  // When set, replaces the invoice email contacts on the order.
  // An empty list clears all invoice contacts; nil/unset leaves existing contacts untouched.
  optional SalesOrderEmailContactList invoice_email_contacts = 32;
  repeated string includes = 33;
}

message SalesOrderEmailContactList {
  repeated SalesOrderEmailContactInput contacts = 1;
}

message UpdateSalesOrderResponse {
  SalesOrderInfo sales_order = 1;
}

message DeleteSalesOrderRequest {
  string id = 1;
}

message BulkDeleteSalesOrdersRequest {
  repeated string ids = 1;
}

message ChangeSalesOrderStatusRequest {
  string id = 1;
  string status_change = 2;
  bool send_email = 3;
  repeated string includes = 4;
}

message ChangeSalesOrderStatusResponse {
  SalesOrderInfo sales_order = 1;
}

message CheckoutSalesOrderRequest {
  string id = 1;
  string email = 2;
  // The checkout success and cancel redirect URLs are constructed server-side
  // from the account's portal slug, not accepted from the caller, to prevent
  // open-redirect/phishing via the hosted checkout link.
}

message CheckoutSalesOrderResponse {
  string checkout_url = 1;
}

message QuoteSalesOrderLineInput {
  string product_id = 1;
  string quantity_value = 2;
  string quantity_unit_id = 3;
}

message QuoteSalesOrderLinePricesRequest {
  string buyer_account_id = 1;
  repeated QuoteSalesOrderLineInput lines = 2;
}

message SalesOrderLineQuote {
  string product_id = 1;
  string unit_price_value = 2;
  string unit_price_numerator_unit_id = 3;
  string unit_price_denominator_unit_id = 4;
}

message QuoteSalesOrderLinePricesResponse {
  repeated SalesOrderLineQuote lines = 1;
}

message QuoteSalesOrderFreightRequest {
  string id = 1;
}

message QuoteSalesOrderFreightResponse {
  string unit_price_value = 1;
  string unit_price_numerator_unit_id = 2;
  string unit_price_denominator_unit_id = 3;
}

message CreateSalesOrderProductionRunRequest {
  string id = 1;
}

message CreateSalesOrderProductionRunResponse {
  ProductionRunInfo production_run = 1;
}

message CreateSalesOrderLineRequest {
  string sales_order_id = 1;
  string product_id = 2;
  optional string item_id = 3;
  string product_sku = 4;
  optional string product_description = 5;
  string quantity_value = 6;
  string quantity_unit_id = 7;
  string unit_price_value = 8;
  string unit_price_numerator_unit_id = 9;
  string unit_price_denominator_unit_id = 10;
  optional string unit_cost_value = 11;
  optional string unit_cost_numerator_unit_id = 12;
  optional string unit_cost_denominator_unit_id = 13;
  optional string edi_line_item_id = 14;
}

message CreateSalesOrderLineResponse {
  SalesOrderLineInfo sales_order_line = 1;
}

message UpdateSalesOrderLineRequest {
  string sales_order_id = 1;
  string id = 2;
  optional string product_id = 3;
  optional string item_id = 4;
  optional string product_sku = 5;
  optional string product_description = 6;
  optional string quantity_value = 7;
  optional string quantity_unit_id = 8;
  optional string unit_price_value = 9;
  optional string unit_price_numerator_unit_id = 10;
  optional string unit_price_denominator_unit_id = 11;
  optional string unit_cost_value = 12;
  optional string unit_cost_numerator_unit_id = 13;
  optional string unit_cost_denominator_unit_id = 14;
  optional string edi_line_item_id = 15;
}

message UpdateSalesOrderLineResponse {
  SalesOrderLineInfo sales_order_line = 1;
}

message DeleteSalesOrderLineRequest {
  string sales_order_id = 1;
  string id = 2;
}

message ReorderSalesOrderLinesRequest {
  string sales_order_id = 1;
  // Line IDs in the desired display order. Credit/freight lines are kept at the
  // bottom regardless of their position here.
  repeated string line_ids = 2;
}

message ReorderSalesOrderLinesResponse {
  repeated SalesOrderLineInfo lines = 1;
}

// --- Volume Discount messages ---

message VolumeDiscountTierInfo {
  string id = 1;
  string name = 2;
  string discount_percentage = 3;
  string threshold = 4;
  optional string parent_tier_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message VolumeDiscountCustomerGroupInfo {
  string id = 1;
  string account_group_id = 2;
  string name = 3;
  optional string commission_policy = 4;
  optional string freight_policy = 5;
  optional string type = 6;
  optional google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp updated_at = 8;
