syntax = "proto3";

// Package core defines the gRPC service for the HubSpot backfill/reconciliation feature.
package core;

import "google/protobuf/timestamp.proto";
import "core/core_identity_context.proto";
import "core/core_async.proto";

option go_package = "shared/proto/core;core";

service CoreHubspotSyncService {
  // StartHubspotBackfill creates a backfill job and kicks off the read-only preview pass.
  rpc StartHubspotBackfill(StartHubspotBackfillRequest) returns (HubspotSyncJobResponse);
  // GetCurrentHubspotSyncJob returns the account's most recent backfill job (for resuming after a refresh).
  rpc GetCurrentHubspotSyncJob(GetCurrentHubspotSyncJobRequest) returns (HubspotSyncJobResponse);
  // GetHubspotSyncJob returns a backfill job (status + dry-run report).
  rpc GetHubspotSyncJob(GetHubspotSyncJobRequest) returns (HubspotSyncJobResponse);
  // ListHubspotCompanyReviews returns a job's company-match review queue.
  rpc ListHubspotCompanyReviews(ListHubspotCompanyReviewsRequest) returns (ListHubspotCompanyReviewsResponse);
  // ResolveHubspotCompanyReview records a human resolution (link / create_new / skip) for one review.
  rpc ResolveHubspotCompanyReview(ResolveHubspotCompanyReviewRequest) returns (HubspotCompanyReviewResponse);
  // BulkResolveHubspotCompanyReviews records many resolutions as one async job.
  rpc BulkResolveHubspotCompanyReviews(BulkResolveHubspotCompanyReviewsRequest) returns (BulkResolveHubspotCompanyReviewsResponse);
  // ExportHubspotCompanyReviews accepts an export of a job's review queue.
  rpc ExportHubspotCompanyReviews(ExportHubspotCompanyReviewsRequest) returns (ExportHubspotCompanyReviewsResponse);
  // ExecuteHubspotSync kicks off the write phase for a reviewed job.
  rpc ExecuteHubspotSync(ExecuteHubspotSyncRequest) returns (HubspotSyncJobResponse);
  // CancelHubspotSync force-fails an in-flight job so the account can start a new one.
  rpc CancelHubspotSync(CancelHubspotSyncRequest) returns (HubspotSyncJobResponse);
  // ListHubspotSyncRecords pages the Augno->HubSpot mappings the sync has written.
  rpc ListHubspotSyncRecords(ListHubspotSyncRecordsRequest) returns (ListHubspotSyncRecordsResponse);
}

message HubspotSyncRecordInfo {
  string id = 1;
  string augno_type = 2;
  string augno_id = 3;
  // Display name of the mapped Augno entity; empty when it no longer exists.
  string augno_name = 4;
  string hubspot_type = 5;
  string hubspot_id = 6;
  optional google.protobuf.Timestamp last_synced_at = 7;
  optional string last_error = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message HubspotSyncJobInfo {
  string id = 1;
  string status = 2;
  // 3 held dry_run, which was never honored: the preview pass is the dry run, and execute always wrote for real.
  reserved 3;
  reserved "dry_run";
  optional google.protobuf.Timestamp golive_cutoff_at = 4;
  // JSON-encoded dry-run report (PreviewCounts).
  string counts_json = 5;
  optional string last_error = 6;
  optional google.protobuf.Timestamp started_at = 7;
  optional google.protobuf.Timestamp completed_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message HubspotCompanyReviewInfo {
  string id = 1;
  string job_id = 2;
  string augno_customer_id = 3;
  string customer_name = 4;
  // JSON-encoded array of candidate HubSpot companies ([{hubspot_id,name,domain}]).
  string candidate_matches_json = 5;
  string status = 6;
  optional string resolution = 7;
  optional string resolved_hubspot_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Snapshot of the customer's contact details, taken when the review was raised.
  optional string customer_email = 11;
  optional string customer_url = 12;
}

message StartHubspotBackfillRequest {
  reserved 1;
  reserved "dry_run";
  optional google.protobuf.Timestamp golive_cutoff_at = 2;
}

message GetCurrentHubspotSyncJobRequest {}

message GetHubspotSyncJobRequest {
  string id = 1;
}

message HubspotSyncJobResponse {
  HubspotSyncJobInfo job = 1;
}

message ListHubspotCompanyReviewsRequest {
  string job_id = 1;
  optional string status = 2;
}

message ListHubspotCompanyReviewsResponse {
  repeated HubspotCompanyReviewInfo reviews = 1;
}

message ResolveHubspotCompanyReviewRequest {
  string job_id = 1;
  string review_id = 2;
  // One of: link, create_new, skip.
  string action = 3;
  optional string resolved_hubspot_id = 4;
}

message HubspotCompanyReviewResponse {
  HubspotCompanyReviewInfo review = 1;
}

message BulkResolveHubspotCompanyReviewsRequest {
  string job_id = 1;
  repeated HubspotCompanyReviewResolution reviews = 2;
}

message HubspotCompanyReviewResolution {
  string review_id = 1;
  // One of: link, create_new, skip.
  string action = 2;
  optional string resolved_hubspot_id = 3;
}

message BulkResolveHubspotCompanyReviewsResponse {
  JobInfo job = 1;
}

message ExportHubspotCompanyReviewsRequest {
  string job_id = 1;
  optional string status = 2;
}

message ExportHubspotCompanyReviewsResponse {
  JobInfo job = 1;
}

message ExecuteHubspotSyncRequest {
  string id = 1;
}

message CancelHubspotSyncRequest {
  string id = 1;
}

message ListHubspotSyncRecordsRequest {
  // Which Augno entity type to list (e.g. customer). Required: it anchors the keyset index.
  string augno_type = 1;
  optional string cursor = 2;
  int32 limit = 3;
}

message ListHubspotSyncRecordsResponse {
  repeated HubspotSyncRecordInfo records = 1;
  PageInfo page_info = 2;
}
