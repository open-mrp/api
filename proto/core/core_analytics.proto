message OeeDowntimeReasonProto {
  string reason_code = 1;
  string oee_bucket = 2;
  double downtime_seconds = 3;
  int64 event_count = 4;
}
message OeeDepartmentProto {
  string department_id = 1;
  string department_name = 2;
  double good_units = 3;
  double waste_units = 4;
  double seconds_units = 5;
  double estimated_runtime_hours = 6;
  double availability_loss_seconds = 7;
  double performance_loss_seconds = 8;
  double quality_loss_seconds = 9;
  double not_scheduled_seconds = 10;
  double changeover_seconds = 11;
  int64 downtime_event_count = 12;
  repeated OeeDowntimeReasonProto downtime_breakdown = 13;
  double scheduled_seconds = 14;
  // run_time_seconds is operating_time_seconds capped at scheduled_seconds — the run
  // time counted toward Availability. operating_time_seconds is the scheduled machines'
  // full measured run time (Performance's denominator); overrun_seconds is the part of
  // it beyond the schedule, a schedule-adherence signal kept out of Availability.
  double run_time_seconds = 15;
  // Ratios are absent when their denominator is unknown, which is not the same as zero.
  optional double availability_pct = 16;
  optional double performance_pct = 17;
  optional double quality_pct = 18;
  optional double oee_pct = 19;
  bool has_downtime_data = 20;
  bool has_performance_anomaly = 21;
  // standard_seconds_earned is the numerator of Performance: the ideal cycle time of
  // every production step multiplied by the units it produced, which is the time the
  // period's output should have taken at the designed speed.
  double standard_seconds_earned = 22;
  // 23-26 held the batch-ticket scan-interval Performance sample, dropped when
  // Performance became ideal-time-over-run-time.
  reserved 23, 24, 25, 26;
  reserved "measured_ideal_seconds", "measured_run_seconds", "performance_ticket_count", "performance_basis";
  // operating_time_seconds is the scheduled machines' measured run time (first-to-last
  // scan per machine per day), Performance's denominator. overrun_seconds is run time
  // beyond the scheduled window, reported apart from OEE so overtime cannot read as more
  // than 100% Availability.
  double operating_time_seconds = 27;
  double overrun_seconds = 28;
}
// OeeDepartmentPlannedTimeProto supplies the scheduled production time Availability
// is measured against. Without it the OEE ratios cannot be computed.
message OeeDepartmentPlannedTimeProto {
  string department_id = 1;
  double planned_hours = 2;
}
message AnalyzeOeeRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  repeated string department_ids = 3;
  repeated OeeDepartmentPlannedTimeProto planned_time = 4;
}
message AnalyzeOeeResponse {
  repeated OeeDepartmentProto departments = 1;
}
message AnalyzeOeeTrendRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  repeated string department_ids = 3;
}
// OeeTrendPeriodProto is one production week of OEE, rolled up across the departments
// that had scheduled time in it.
message OeeTrendPeriodProto {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
  double good_units = 3;
  double waste_units = 4;
  double seconds_units = 5;
  double standard_seconds_earned = 6;
  double scheduled_seconds = 7;
  // run_time_seconds is operating_time_seconds capped at scheduled_seconds (Availability's
  // numerator); operating_time_seconds is the full measured run time (Performance's
  // denominator); overrun_seconds is run time beyond the schedule, reported apart from OEE.
  double run_time_seconds = 8;
  double availability_loss_seconds = 9;
  double not_scheduled_seconds = 10;
  // Ratios are absent when their denominator is unknown, which is not the same as zero.
  optional double availability_pct = 11;
  optional double performance_pct = 12;
  optional double quality_pct = 13;
  optional double oee_pct = 14;
  bool has_downtime_data = 15;
  int64 downtime_event_count = 16;
  double operating_time_seconds = 17;
  double overrun_seconds = 18;
}
message AnalyzeOeeTrendResponse {
  repeated OeeTrendPeriodProto periods = 1;
}
