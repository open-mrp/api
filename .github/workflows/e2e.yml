name: E2E

# E2E is opt-in, never on every PR: it builds every service image and boots the
# full stack, which is too slow to gate routine changes on. Run it either way:
#   - manually, via the "Run workflow" button (pick any branch)
#   - on a PR, by adding the `run-e2e` label (remove it to stop re-running)
on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full E2E suite (vs. only tests affected by the diff vs. main)
        type: boolean
        default: true
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    # Manual runs always execute; PR runs only while the `run-e2e` label is present.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Modules
        run: |
          go mod tidy
          cd tools && go mod tidy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build E2E images with cache
        run: |
          pids=()
          for svc in platform-service core-service notification-service auth-service billing-service agent-service api-gateway; do
            (
              echo "Building $svc..."
              docker buildx build \
                --build-arg SERVICE_NAME=$svc \
                --cache-from type=gha,scope=e2e-$svc \
                --cache-to type=gha,scope=e2e-$svc,mode=max \
                --load \
                -t openmrp-e2e-$svc \
                -f infra/production/docker/Dockerfile .
              echo "$svc done."
            ) &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -eq 1 ]; then
            echo "One or more image builds failed."
            exit 1
          fi

      - name: Start E2E stack
        run: make e2e-up-ci

      - name: Cache e2e tools
        uses: actions/cache@v6
        id: cache-e2e-tools
        with:
          path: /usr/local/bin/ci-tools
          key: ${{ runner.os }}-e2e-tools-${{ hashFiles('tools/tool-versions') }}

      - name: Install e2e tools
        if: steps.cache-e2e-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p /usr/local/bin/ci-tools
          GOTESTSUM_V=$(awk '/gotestsum/{gsub(/^v/,"",$2); print $2}' tools/tool-versions)
          curl -sSL "https://github.com/gotestyourself/gotestsum/releases/download/v${GOTESTSUM_V}/gotestsum_${GOTESTSUM_V}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin/ci-tools gotestsum

      - name: Add tools to PATH
        run: echo "/usr/local/bin/ci-tools" >> "$GITHUB_PATH"

      - name: Select E2E tests
        id: e2e_select
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_SUITE: ${{ inputs.full_suite }}
        run: |
          # A PR run tests only what the diff touches; a manual run defaults to the full
          # suite but can opt into the same diff selection.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FULL_SUITE" == "true" ]]; then
            echo "run_regex=.*" >> "$GITHUB_OUTPUT"
          else
            RUN_REGEX=$(./scripts/select-e2e-tests.sh origin/main HEAD)
            echo "run_regex=${RUN_REGEX}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E tests
        env:
          RUN_REGEX: ${{ steps.e2e_select.outputs.run_regex }}
        run: ./scripts/run-e2e-tests.sh 300s "$RUN_REGEX"

      - name: Tear down E2E stack
        if: always()
        run: make e2e-down
