services:
  mysql:
    image: mysql:8
    container_name: openmrp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Testing123!"
      MYSQL_DATABASE: openmrp
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pTesting123!"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
