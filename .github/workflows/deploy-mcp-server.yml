name: Deploy MCP Server (manual)

# On-demand build + deploy of the MCP server.
#
# The MCP server source lives in open-mrp/typescript-sdk/packages/mcp-server and is
# (re)generated by the SDK-generation jobs. release.yml's build-mcp job only
# runs on a release that *changes the public spec* (and after generate-sdks
# succeeds), so it can't (re)deploy an already-released version. This workflow is
# the manual / first-time path: it builds the image from typescript-sdk's
# generated Dockerfile and rolls it out on prod EKS.
#
# Mirrors the "Build and Deploy MCP Server" job in release.yml: the image is built and pushed here,
# and the rollout is dispatched to the private open-mrp/infra repo, which owns the manifest and the only
# credential that can touch the cluster. The ECR-push OIDC role only trusts refs/heads/main, so this
# must be dispatched from the main branch.
on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: >-
          typescript-sdk tag supplying the MCP build context (e.g. v0.19.3).
          Defaults to that repo's latest release. It is versioned independently
          of this repo, so it is NOT the same as image_tag.
        required: false
      image_tag:
        description: Image tag to build/deploy (e.g. v0.23.4). Defaults to v<.release-please-manifest.json>.
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-mcp:
    name: Build and Deploy MCP Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout API repo (deploy dispatch script)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_SDK_REF: ${{ inputs.sdk_ref }}
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(jq -r '."."' .release-please-manifest.json)"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          if [[ ! "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "image_tag must be a semantic release tag such as v0.23.4" >&2
            exit 1
          fi
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "MCP image tag: ${tag}"

          # The MCP source lives in typescript-sdk, which release-please versions on
          # its own line — this repo is on 1.x while the SDK is still 0.19.x, so the
          # two tags are unrelated. Reusing image_tag as the checkout ref fails with
          # "process '/usr/bin/git' failed with exit code 1" once they diverge.
          if [ -n "$INPUT_SDK_REF" ]; then
            sdk_ref="$INPUT_SDK_REF"
          else
            # `gh release view` returns GitHub's "latest", which EXCLUDES pre-releases.
            # typescript-sdk marks every release prerelease=true, so that resolves to
            # v0.2.0 — old enough to predate packages/mcp-server, and the build then
            # fails with "lstat typescript-sdk-src/packages: no such file or directory".
            # `gh release list` is reverse-chronological and includes pre-releases.
            sdk_ref="$(gh release list --repo open-mrp/typescript-sdk --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if [ -z "$sdk_ref" ]; then
            echo "could not resolve a typescript-sdk ref" >&2
            exit 1
          fi
          echo "sdk_ref=${sdk_ref}" >> "$GITHUB_OUTPUT"
          echo "MCP build context: open-mrp/typescript-sdk@${sdk_ref}"

      - name: Checkout typescript-sdk (MCP build context)
        uses: actions/checkout@v5
        with:
          repository: open-mrp/typescript-sdk
          # Pinned to a resolved typescript-sdk release tag, never a raw
          # caller-supplied ref. CROSS_REPO_PAT is a read-scoped cross-repo
          # token, available here because this job runs in the `production`
          # environment.
          ref: ${{ steps.tag.outputs.sdk_ref }}
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: typescript-sdk-src
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_MCP_ECR_PUSH }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push MCP Server image
        uses: docker/build-push-action@v7
        with:
          # The generated Dockerfile builds the whole pnpm workspace; context is
          # the typescript-sdk repo root, Dockerfile is the generated one.
          context: typescript-sdk-src
          file: typescript-sdk-src/packages/mcp-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/augno/mcp-server:${{ steps.tag.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/augno/mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy MCP Server via open-mrp/infra
        run: ./scripts/dispatch-infra-deploy.sh
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          DEPLOY_SERVICES: ""
          MCP_IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
