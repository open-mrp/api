<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Limit Alert</title>
</head>
<body style="margin: 0; padding: 0; width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <table role="presentation" cellPadding="0" cellSpacing="0" width="100%" bgcolor="#F4F5F7" style="width: 100%; background-color: #F4F5F7; padding-top: 24px; padding-bottom: 24px;">
        <tbody>
            <tr>
                <td>
                    <table role="presentation" cellPadding="0" cellSpacing="0" style="width: 100%; max-width: 600px; margin-left: auto; margin-right: auto; background-color: #FFFFFF; border-radius: 12px; border: 1px solid #E5E7EB; border-top: 4px solid #DC2626;" width="100%" bgcolor="#FFFFFF">
                        <tbody>
                            <tr>
                                <td style="padding: 24px 24px 0 24px; text-align: center; background-color: #FFFFFF;">
                                    <img src="https://augno-public-images.s3.us-east-2.amazonaws.com/dark-logo.png" alt="Augno" style="height: 40px; width: auto;">
                                </td>
                            </tr>
                            <tr>
                                <td style="background-color: #FFFFFF; padding: 24px;">
                                    <h1 style="margin: 0; margin-bottom: 8px; font-size: 22px; line-height: 28px; font-weight: 700; color: #0F172A; text-align: center;">Registration Limit Reached</h1>
                                    <p style="margin: 0; margin-bottom: 16px; font-size: 14px; line-height: 20px; color: #475569; text-align: center;">A user attempted to register but the plan's registration limit has been reached.</p>

                                    <table role="presentation" cellPadding="0" cellSpacing="0" style="width: 100%; margin-top: 16px;">
                                        <tbody>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #0F172A;">
                                                    <strong>Email:</strong> {{.Email}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #0F172A;">
                                                    <strong>Plan:</strong> {{.PlanCode}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #0F172A;">
                                                    <strong>Account Name:</strong> {{.AccountName}}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #0F172A;">
                                                    <strong>Public Limit:</strong> {{.PublicLimit}}
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            <tr>
                                <td style="height: 1px; background-color: #E5E7EB;"></td>
                            </tr>
                            <tr>
                                <td style="background-color: #FFFFFF; padding: 16px; text-align: center; color: #6B7280; font-size: 12px;">
                                    <div>
                                        <div style="margin-top: 8px; font-size: 12px; color: #9CA3AF;">
                                            This is an internal notification from Augno.
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
