name: Release Check

# Opt-in validation for a release PR before it is merged. This is not a required
# check and never runs on ordinary pushes or PRs — it exists so a release can be
# vetted (e2e, etc.) on demand once all its features have landed, without burning
# CI minutes on every intermediate commit while the release PR accumulates changes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to validate.
        required: false
        default: release-please--branches--main
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Release E2E
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'release:validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run E2E suite
        run: make e2e

      - name: Tear down E2E stack
        if: always()
        run: make e2e-down
