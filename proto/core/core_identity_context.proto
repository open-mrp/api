}
message SearchProductsResponse {
  repeated ProductInfo products = 1;
}
message ListProductsRequest {
  string account_id = 1;
}
message ListProductsResponse {
  repeated ProductInfo products = 1;
}
message GetCustomerByEmailRequest {
  string owner_account_id = 1;
