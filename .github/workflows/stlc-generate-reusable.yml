name: Generate SDKs (reusable)

'on':
  workflow_call:
    inputs:
      api_version:
        description: Deployed API release tag (e.g. v0.17.10)
        required: true
        type: string
      push_branch:
        description: Branch on each SDK repo to push SDK updates (typically main)
        required: false
        type: string
        default: main
      openapi_specs_source:
        description: "s3 — download specs from release S3 buckets; generate — run make openapi-stainless-quiet in this job (manual)"
        required: false
        type: string
        default: generate
      open_pr:
        description: Open a PR from push_branch into pr_base_branch instead of pushing directly (manual runs only)
        required: false
        type: boolean
        default: false
      pr_base_branch:
        description: Base branch for SDK pull requests when open_pr is true
        required: false
        type: string
        default: main
      commit_message:
        description: Optional override for the stlc git commit message
        required: false
        type: string
        default: ""
      openapi_internal_gate:
        description: >-
          Release path only. Set to true or false from publish-openapi-specs (compare before S3 upload). Empty = derive in this workflow.
        required: false
        type: string
      openapi_public_gate:
        description: >-
          Release path only. Set to true or false from publish-openapi-specs (compare before S3 upload). Empty = derive in this workflow.
        required: false
        type: string
    outputs:
      internal_spec_changed_flag:
        description: Whether internal_openapi_spec.json changed vs baseline (true always when openapi_specs_source is generate)
        value: ${{ jobs.spec-changes.outputs.internal }}
      public_spec_changed_flag:
        description: Whether public_openapi_spec.json changed vs baseline (true always when openapi_specs_source is generate)
        value: ${{ jobs.spec-changes.outputs.public }}
    secrets:
      STLC_READ_TOKEN:
        required: true
      SDK_WRITE_TOKEN:
        required: true

permissions:
  contents: read

env:
  STLC_GITHUB_ORG: sdk-gen

jobs:
  spec-changes:
    name: Resolve OpenAPI spec changed flags
    runs-on: ubuntu-latest
    outputs:
      internal: ${{ steps.resolve.outputs.internal }}
      public: ${{ steps.resolve.outputs.public }}
    steps:
      - name: Resolve from caller or default to regenerated
        id: resolve
        env:
          INT_FLAG: ${{ inputs.openapi_internal_gate }}
          PUB_FLAG: ${{ inputs.openapi_public_gate }}
          OPENAPI_SPECS_SOURCE: ${{ inputs.openapi_specs_source }}
        run: |
          if [ -n "$INT_FLAG" ] && [ -n "$PUB_FLAG" ]; then
            echo "internal=$INT_FLAG" >> "$GITHUB_OUTPUT"
            echo "public=$PUB_FLAG" >> "$GITHUB_OUTPUT"
            echo "Release path: flags from publish-openapi-specs (pre-upload vs S3 baseline)."
            exit 0
          fi
          if [ "$OPENAPI_SPECS_SOURCE" != "s3" ]; then
            echo "internal=true" >> "$GITHUB_OUTPUT"
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "Manual or generate path: assuming both specs changed."
            exit 0
          fi
          echo "internal=true" >> "$GITHUB_OUTPUT"
          echo "public=true" >> "$GITHUB_OUTPUT"
          echo "S3 specs source without caller flags; assuming both changed."

  fetch-openapi-specs-s3:
    name: Fetch OpenAPI specs from S3
    needs: spec-changes
    if: inputs.openapi_specs_source == 's3' && (needs.spec-changes.outputs.internal == 'true' || needs.spec-changes.outputs.public == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_OPENAPI_READER }}
          aws-region: us-east-2

      - name: Download OpenAPI specs and Stainless configs from S3
        env:
          PUBLIC_SPEC_BUCKET: ${{ vars.PUBLIC_SPEC_BUCKET }}
          INTERNAL_SPEC_BUCKET: ${{ vars.INTERNAL_SPEC_BUCKET }}
        run: |
          mkdir -p specs
          ./scripts/fetch-openapi-spec-s3.sh internal specs/internal_openapi_spec.json current
          ./scripts/fetch-openapi-spec-s3.sh public specs/public_openapi_spec.json current
          ./scripts/fetch-openapi-spec-s3.sh internal stainless/internal/stainless.yml current stainless
          ./scripts/fetch-openapi-spec-s3.sh public stainless/public/stainless.yml current stainless

      - name: Upload OpenAPI specs and Stainless configs
        uses: actions/upload-artifact@v4
        with:
          name: openapi-stainless-inputs
          path: |
            specs/internal_openapi_spec.json
            specs/public_openapi_spec.json
            stainless/internal/stainless.yml
            stainless/public/stainless.yml
          if-no-files-found: error

  generate:
    name: Generate ${{ matrix.sdk }}
    needs: [spec-changes, fetch-openapi-specs-s3]
    if: |
      always() &&
      needs.spec-changes.result == 'success' &&
      (inputs.openapi_specs_source != 's3' || (needs.spec-changes.outputs.internal != 'true' && needs.spec-changes.outputs.public != 'true') || needs.fetch-openapi-specs-s3.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: internal
            workspace: stainless/internal
            targets: typescript
            # release-please, not changesets: the v0.23.2 regen dropped internal-sdk's
            # Changesets tooling (@changesets/cli + scripts/release + the Changesets
            # Release workflow were removed). It now releases via release-please (a
            # committed release.yml in Augno/internal-sdk), publishing to GitHub
            # Packages, driven by the conventional "fix(sdk): sync ..." commit produced
            # below; the "Add changeset" steps no longer apply.
            release: release-please
            pr_repo: Augno/internal-sdk
            package_name: "@augno/internal-sdk"
            spec_changed: ${{ needs.spec-changes.outputs.internal }}
          - sdk: public
            workspace: stainless/public
            targets: typescript
            # release-please, not changesets: the public TS SDK was migrated off
            # Changesets (the .changeset dir + Release workflow were removed) to
            # release-please in the v0.23.2 regen. Like python/go, it derives its
            # bump from the conventional "fix(sdk): sync with deployed API vX.Y.Z"
            # commit produced below.
            release: release-please
            pr_repo: Augno/typescript-sdk
            package_name: "@augno/sdk"
            spec_changed: ${{ needs.spec-changes.outputs.public }}
          - sdk: public-go
            workspace: stainless/public
            targets: go
            release: release-please
            pr_repo: augno/augno-go
            package_name: augno
            spec_changed: ${{ needs.spec-changes.outputs.public }}
    steps:
      - name: Skip SDK generation (OpenAPI spec unchanged)
        if: matrix.spec_changed != 'true'
        run: |
          echo "Skipping ${{ matrix.sdk }} SDK: OpenAPI spec matches S3 openapi.json recorded before upload in this release."

      - name: Checkout repository
        if: matrix.spec_changed == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download OpenAPI specs and Stainless configs
        if: matrix.spec_changed == 'true' && inputs.openapi_specs_source == 's3'
        uses: actions/download-artifact@v4
        with:
          name: openapi-stainless-inputs

      - name: Set up Go
        if: matrix.spec_changed == 'true' && inputs.openapi_specs_source == 'generate'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Generate OpenAPI specifications and Stainless configs
        if: matrix.spec_changed == 'true' && inputs.openapi_specs_source == 'generate'
        run: make openapi-stainless-quiet

      - name: Setup stlc
        if: matrix.spec_changed == 'true'
        uses: ./.github/actions/setup-stlc
        with:
          github-org: ${{ env.STLC_GITHUB_ORG }}
          stlc-read-token: ${{ secrets.STLC_READ_TOKEN }}

      - name: Configure auth for stlc to push to SDK repos
        if: matrix.spec_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}
        run: |
          git config --global user.name "stlc-bot"
          git config --global user.email "stlc-bot@users.noreply.github.com"
          gh auth setup-git

      - name: Determine SDK bump level from API version
        if: matrix.spec_changed == 'true'
        id: bump
        env:
          API_VERSION: ${{ inputs.api_version }}
        run: |
          set -euo pipefail
          ver="${API_VERSION#v}"
          IFS='.' read -r _ minor patch <<<"$ver"
          patch="${patch%%[-+]*}"
          # release-please semver bumps zero out lower components: a major release
          # is always X.0.0 and a minor always X.Y.0, so the tag shape encodes the bump.
          if [ "$minor" = "0" ] && [ "$patch" = "0" ]; then
            bump=major
          elif [ "$patch" = "0" ]; then
            bump=minor
          else
            bump=patch
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "API ${API_VERSION} -> SDK bump: ${bump}"

      - name: Generate SDK and push
        if: matrix.spec_changed == 'true'
        id: build
        env:
          API_VERSION: ${{ inputs.api_version }}
          BUMP: ${{ steps.bump.outputs.bump }}
          BRANCH: ${{ inputs.push_branch }}
          COMMIT_MSG: ${{ inputs.commit_message }}
          TARGETS: ${{ matrix.targets }}
          GH_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}
          # The public TS target also generates the MCP server (options.mcp_server),
          # which loads a second plugin (stlc-mcp) alongside stlc-typescript. Both
          # plugins must share one codegen.lib.mjs instance; without
          # --preserve-symlinks each symlinked plugin resolves its own copy and stlc
          # fails with "the `stlc-mcp` plugin is missing". Scoped to the public leg so
          # internal/python/go resolution is unchanged.
          NODE_OPTIONS: ${{ matrix.sdk == 'public' && '--preserve-symlinks' || '' }}
        run: |
          echo "Building ${{ matrix.workspace }} (${TARGETS}) to branch: $BRANCH (API ${API_VERSION})"
          if [ -n "$COMMIT_MSG" ]; then
            commit_message="$COMMIT_MSG"
          else
            case "$BUMP" in
              major) commit_message="feat(sdk)!: sync with deployed API ${API_VERSION}" ;;
              minor) commit_message="feat(sdk): sync with deployed API ${API_VERSION}" ;;
              *) commit_message="fix(sdk): sync with deployed API ${API_VERSION}" ;;
            esac
          fi
          commit_args=(--commit "$commit_message")
          env -u CI -u GITHUB_ACTIONS stlc build \
            --workspace "${{ matrix.workspace }}" \
            --branch "$BRANCH" \
            --output "/tmp/sdk-output/${{ matrix.sdk }}" \
            --push \
            --targets "$TARGETS" \
            "${commit_args[@]}"

      # All SDK targets now release via release-please (python, go, public TS, and
      # internal TS): each derives its bump from the conventional-commit sync
      # message produced by "Generate SDK and push" above, so no explicit
      # .changeset/*.md is added. (Internal-sdk publishes to GitHub Packages rather
      # than npmjs, but still via release-please — see its committed release.yml.)

      - name: Open pull request on SDK repo
        if: matrix.spec_changed == 'true' && success() && inputs.open_pr
        env:
          GH_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}
          REPO: ${{ matrix.pr_repo }}
          BRANCH: ${{ inputs.push_branch }}
          BASE: ${{ inputs.pr_base_branch }}
          TAG: ${{ inputs.api_version }}
          BUMP: ${{ steps.bump.outputs.bump }}
          OPENAPI_SPECS_SOURCE: ${{ inputs.openapi_specs_source }}
        run: |
          set -euo pipefail
          repo="$REPO"
          branch="$BRANCH"
          base="$BASE"
          tag="$TAG"

          branch_pattern='^[A-Za-z0-9._/-]+$'
          tag_pattern='^v[0-9A-Za-z._-]+$'
          if ! [[ "$branch" =~ $branch_pattern ]]; then
            echo "Invalid push_branch: $branch" >&2
            exit 1
          fi
          if ! [[ "$base" =~ $branch_pattern ]]; then
            echo "Invalid pr_base_branch: $base" >&2
            exit 1
          fi
          if ! [[ "$tag" =~ $tag_pattern ]]; then
            echo "Invalid api_version: $tag" >&2
            exit 1
          fi

          open_count=$(gh pr list --repo "$repo" --head "$branch" --state open --json number -q 'length')
          if [ "${open_count:-0}" -gt 0 ]; then
            echo "An open PR already exists for $repo from head $branch; skipping create."
            exit 0
          fi
          body_file="$(mktemp)"
          {
            echo "Automated SDK sync from [Augno/api](https://github.com/Augno/api) release **${tag}**."
            echo ""
            if [ "$OPENAPI_SPECS_SOURCE" = "s3" ]; then
              echo "OpenAPI specs were downloaded from the release S3 buckets (\`augno-*-openapi-specs/openapi.json\`)."
            else
              echo "OpenAPI specs and Stainless configs were generated in this job with \`make openapi-stainless-quiet\`."
            fi
            echo ""
            echo "Review and merge this PR. The SDK repo's release-please workflow will open a **release: <version>** PR when needed; merge that PR to publish."
            echo ""
            echo "Release automation pushes directly to \`${branch}\` instead; use \`open_pr\` only for manual workflow_dispatch runs."
          } > "$body_file"
          case "$BUMP" in
            major) pr_title="feat(sdk)!: sync with deployed API ${tag}" ;;
            minor) pr_title="feat(sdk): sync with deployed API ${tag}" ;;
            *) pr_title="fix(sdk): sync with deployed API ${tag}" ;;
          esac
          set +e
          gh pr create --repo "$repo" --base "$base" --head "$branch" \
            --title "$pr_title" \
            --body-file "$body_file" >pr_create.log 2>&1
          pr_rc=$?
          set -e
          if [ "$pr_rc" -eq 0 ]; then
            cat pr_create.log
            rm -f "$body_file" pr_create.log
            exit 0
          fi
          err=$(cat pr_create.log)
          rm -f pr_create.log "$body_file"
          if echo "$err" | grep -qi 'no commits between'; then
            echo "Skipping PR: $repo has no commits between $base and $branch (SDK already matches release)."
            exit 0
          fi
          echo "$err" >&2
          exit 1

      - name: Print STLC failure report
        if: matrix.spec_changed == 'true' && failure() && steps.build.outcome == 'failure'
        uses: ./.github/actions/stlc-failure-report
        with:
          workspace: ${{ matrix.workspace }}
