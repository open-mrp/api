syntax = "proto3";

// CoreService message types (imported by core.proto).
package core;

import "google/protobuf/timestamp.proto";
import "core/core_patch.proto";
import "core/core_identity_context.proto";
import "core/core_items.proto";
import "core/core_fuzzy_identifiers.proto";
import "core/core_async.proto";
option go_package = "shared/proto/core;core";

message CreateConsumptionRequest {
  string production_step_id = 1;
  string item_id = 2;
  string quantity_value = 3;
  string quantity_unit_id = 4;
  string waste_quantity_value = 5;
  string waste_quantity_unit_id = 6;
  optional string instructions = 7;
  repeated string includes = 8;
}
message CreateConsumptionResponse {
  ConsumptionInfo consumption = 1;
}
message UpdateConsumptionRequest {
  string production_step_id = 1;
  string id = 2;
  optional string item_id = 3;
  optional string quantity_value = 4;
  optional string quantity_unit_id = 5;
  optional string waste_quantity_value = 6;
  optional string waste_quantity_unit_id = 7;
  optional string instructions = 8;
  repeated string includes = 9;
}
message UpdateConsumptionResponse {
  ConsumptionInfo consumption = 1;
}
message DeleteConsumptionRequest {
  string production_step_id = 1;
  string id = 2;
}
message DeleteConsumptionResponse {
  ConsumptionInfo consumption = 1;
}
message ListDeliveriesRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
  optional string status = 4;
  repeated string item_ids = 5;
  repeated string supplier_ids = 6;
  optional google.protobuf.Timestamp start_date = 7;
  optional google.protobuf.Timestamp end_date = 8;
  repeated string includes = 9;
}
message ListDeliveriesResponse {
  repeated DeliverySummaryInfo deliveries = 1;
  PageInfo page_info = 2;
}
message GetDeliveryRequest {
  string id = 1;
}
message GetDeliveryResponse {
  DeliveryInfo delivery = 1;
}
message DeliverySummaryInfo {
  string id = 1;
  string number = 2;
  string purchase_order_id = 3;
  string purchase_order_number = 4;
  string status = 5;
  int32 line_count = 6;
  optional google.protobuf.Timestamp accepted_at = 7;
  optional google.protobuf.Timestamp rejected_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Lines (populated only when the list request includes "lines").
  repeated DeliveryLineInfo lines = 11;
}
message DeliveryInfo {
  string id = 1;
  string number = 2;
  string purchase_order_id = 3;
  string purchase_order_number = 4;
  string status = 5;
  repeated DeliveryLineInfo lines = 6;
  optional google.protobuf.Timestamp accepted_at = 7;
  optional google.protobuf.Timestamp rejected_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
message DeliveryLineInfo {
  string id = 1;
  optional string item_id = 2;
  optional string item_sku = 3;
  optional string item_description = 4;
  string quantity_id = 5;
  string quantity_value = 6;
  string quantity_unit_id = 7;
  string quantity_unit_abbreviation = 8;
  string unit_cost_id = 9;
  string unit_cost_value = 10;
  string unit_cost_numerator_unit_id = 11;
  string unit_cost_denominator_unit_id = 12;
  optional string location_id = 13;
  optional string location_name = 14;
  optional string lot_id = 15;
  optional string lot_number = 16;
  optional google.protobuf.Timestamp accepted_at = 17;
  optional google.protobuf.Timestamp rejected_at = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}
message LightScanningStationInfo {
  string id = 1;
  string name = 2;
  string type = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string operator_requirement = 6;
}
message LightProductionStepInfo {
  string id = 1;
  string name = 2;
  optional string leveling_factor = 3;
  optional string allowances = 4;
  optional google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp updated_at = 6;
}
message ScanningStationInfo {
  string id = 1;
  string name = 2;
  optional string notes = 3;
  string type = 4;
  optional string label_size_code = 5;
  optional string label_type_code = 6;
  string operator_requirement = 7;
  string department_id = 8;
  string department_name = 9;
  optional google.protobuf.Timestamp department_created_at = 13;
  optional google.protobuf.Timestamp department_updated_at = 14;
  repeated LightProductionStepInfo production_steps = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}
message ListScanningStationsRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
  repeated string includes = 4;
}
message ListScanningStationsResponse {
  repeated ScanningStationInfo scanning_stations = 1;
  PageInfo page_info = 2;
}
message ExportScanningStationsRequest {
  optional string query = 1;
}
message ExportScanningStationsResponse {
  JobInfo job = 1;
}
message GetScanningStationRequest {
  string id = 1;
  repeated string includes = 2;
}
message GetScanningStationResponse {
  ScanningStationInfo scanning_station = 1;
}
message CreateScanningStationRequest {
  string name = 1;
  optional string notes = 2;
  string type = 3;
  string operator_requirement = 4;
  string department_id = 5;
  optional string label_size_code = 6;
  optional string label_type_code = 7;
  repeated string includes = 8;
}
message CreateScanningStationResponse {
  ScanningStationInfo scanning_station = 1;
}
message UpdateScanningStationRequest {
  string id = 1;
  optional string name = 2;
  optional StringPatch notes = 3;
  optional StringPatch label_size_code = 4;
  optional StringPatch label_type_code = 5;
  optional string operator_requirement = 6;
  repeated string includes = 7;
}
message UpdateScanningStationResponse {
  ScanningStationInfo scanning_station = 1;
}
message DeleteScanningStationRequest {
  string id = 1;
}
message UpsertScanningStationInput {
  string name = 1;
  optional string notes = 2;
  string type = 3;
  string operator_requirement = 4;
  ObjectIdentifier department = 5;
  optional StringPatch label_size_code = 6;
  optional StringPatch label_type_code = 7;
}
message BulkUpsertScanningStationsRequest {
  repeated UpsertScanningStationInput scanning_stations = 1;
}
message BulkUpsertScanningStationsResponse {
  JobInfo job = 1;
}
message ConnectProductionStepsByScanningStationRequest {
  string id = 1;
  string name = 2;
}
message BatchGetScanningStationsByIDsRequest {
  repeated string ids = 1;
}
message BatchGetScanningStationsByIDsResponse {
  repeated ScanningStationInfo scanning_stations = 1;
}
message LocationChildInfo {
  string id = 1;
  string name = 2;
  string type_code = 3;
}
message LocationInfo {
  string id = 1;
  string name = 2;
  string type_code = 3;
  reserved 4;
  optional string parent_id = 5;
  optional string parent_name = 6;
  repeated LocationChildInfo children = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional string parent_type_code = 10;
}
message LocationTypeInfo {
  string id = 1;
  string code = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}
message ListLocationsRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
  repeated string includes = 4;
}
message ListLocationsResponse {
  repeated LocationInfo locations = 1;
  PageInfo page_info = 2;
}
message ExportLocationsRequest {
  optional string query = 1;
}
message ExportLocationsResponse {
  JobInfo job = 1;
}
message GetLocationRequest {
  string id = 1;
  repeated string includes = 2;
}
message GetLocationResponse {
  LocationInfo location = 1;
}
message CreateLocationRequest {
  string name = 1;
  string type_code = 2;
  optional string parent_id = 3;
  repeated string child_ids = 4;
  repeated string includes = 5;
}
message CreateLocationResponse {
  LocationInfo location = 1;
}
message UpdateLocationRequest {
  string id = 1;
  optional string name = 2;
  optional string type_code = 3;
  optional StringPatch parent_id = 4;
  optional StringListPatch child_ids = 6;
  repeated string includes = 7;
}
message UpdateLocationResponse {
  LocationInfo location = 1;
}
message DeleteLocationRequest {
  string id = 1;
}
message ListLocationTypesRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
}
message ListLocationTypesResponse {
  repeated LocationTypeInfo location_types = 1;
  PageInfo page_info = 2;
}
message GetLocationTypeRequest {
  string identifier = 1;
}
message GetLocationTypeResponse {
  LocationTypeInfo location_type = 1;
}
// Batched read for the api-gateway resourcekit resolver.
message BatchGetLocationsByIDsRequest {
  repeated string ids = 1;
}
message BatchGetLocationsByIDsResponse {
  repeated LocationInfo locations = 1;
}
message BulkUpsertLocationInput {
  string name = 1;
  string type_code = 2;
  ObjectIdentifier parent = 3;
  repeated ObjectIdentifier children = 4;
}
message BulkUpsertLocationsRequest {
  repeated BulkUpsertLocationInput locations = 1;
}
message BulkUpsertLocationsResponse {
  JobInfo job = 1;
}
message SupplierSummaryProto {
  string id = 1;
  string name = 2;
  string number = 3;
  int64 material_count = 4;
  google.protobuf.Timestamp created_at = 5;
}
message SupplierProto {
  string id = 1;
  string name = 2;
  string number = 3;
  optional string note = 4;
  optional CustomerAddressProto bill_to_address = 5;
  optional CustomerAddressProto ship_to_address = 6;
  int64 material_count = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
message CreateSupplierAddressInput {
  string name = 1;
  optional string phone = 2;
  optional string email = 3;
  bool is_drop_ship = 4;
  optional string street_line_1 = 5;
  optional string street_line_2 = 6;
  optional string locality = 7;
  optional string state = 8;
  optional string postal_code = 9;
  string country = 10;
}
message ListSuppliersRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
  optional google.protobuf.Timestamp start_date = 4;
  optional google.protobuf.Timestamp end_date = 5;
  repeated string item_ids = 6;
  repeated string includes = 7;
}
message ListSuppliersResponse {
  repeated SupplierSummaryProto suppliers = 1;
  PageInfo page_info = 2;
}
message GetSupplierRequest {
  string id = 1;
  repeated string includes = 2;
}
message GetSupplierResponse {
  SupplierProto supplier = 1;
}
message CreateSupplierRequest {
  string name = 1;
  string number = 2;
  optional string note = 3;
  optional CreateSupplierAddressInput bill_to_address = 4;
  optional CreateSupplierAddressInput ship_to_address = 5;
  repeated string includes = 6;
}
message CreateSupplierResponse {
  SupplierProto supplier = 1;
}
message UpdateSupplierRequest {
  string id = 1;
  optional string name = 2;
  optional string number = 3;
  optional string note = 4;
  bool update_note = 5;
  optional string bill_to_address_id = 6;
  optional string ship_to_address_id = 7;
  repeated string includes = 8;
}
message UpdateSupplierResponse {
  SupplierProto supplier = 1;
}
message DeleteSupplierRequest {
  string id = 1;
}
message DeleteSupplierResponse {
  SupplierProto supplier = 1;
}
message BulkDeleteSuppliersRequest {
  repeated string supplier_ids = 1;
}
message SysPropertyInfo {
  string id = 1;
  string type_id = 2;
  string type_code = 3;
  string type_name = 4;
  int32 value = 5;
  string account_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}
message ListSysPropertiesRequest {
  optional string cursor = 1;
  int32 limit = 2;
  optional string query = 3;
}
message ListSysPropertiesResponse {
  repeated SysPropertyInfo sys_properties = 1;
  PageInfo page_info = 2;
}
message GetSysPropertyRequest {
  string id = 1;
}
message GetSysPropertyResponse {
  SysPropertyInfo sys_property = 1;
}
message UpdateSysPropertyRequest {
  string id = 1;
  optional int32 value = 2;
}
message UpdateSysPropertyResponse {
  SysPropertyInfo sys_property = 1;
}
message GetLatestSysPropertyValueRequest {
  string type_code = 1;
}
message GetLatestSysPropertyValueResponse {
  int32 value = 1;
}
// Batched read for the api-gateway resourcekit resolver.
message BatchGetSysPropertiesByIDsRequest {
  repeated string ids = 1;
}
message BatchGetSysPropertiesByIDsResponse {
  repeated SysPropertyInfo sys_properties = 1;
}
message TenancyRoleProto {
  string id = 1;
  string name = 2;
  string role_type_code = 3;
  repeated string permissions = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
message TenancyAccountPlanLimitProto {
  string key = 1;
  // Absent means unlimited.
  optional int32 value = 2;
}
message TenancyAccountPlanProto {
  string type_id = 1;
  string name = 2;
  string plan_type_code = 3;
  int32 version = 4;
  double price_per_seat = 5;
  optional double price_per_month = 6;
  optional int32 seat_minimum = 7;
  repeated TenancyAccountPlanLimitProto limits = 8;
  map<string, bool> features = 9;
}
message TenancyCurrentAccountProto {
  string id = 1;
  optional string slug = 2;
  string name = 3;
  string type = 4;
  string onboarding_status = 5;
  string plan_code = 6;
  optional TenancyRoleProto role = 7;
  optional string internal_stripe_customer_id = 8;
  optional TenancyAccountPlanProto account_plan = 9;
  string account_user_id = 10;
}
message TenancyAccountSummaryProto {
  string id = 1;
  string name = 2;
}
message TenancyOtherAccountProto {
  string id = 1;
  string name = 2;
  string type = 3;
}
message TenancyPendingRegistrationProto {
  string session_id = 1;
  string plan_code = 2;
  string step = 3;
  google.protobuf.Timestamp created_at = 4;
}
message GetTenancyRequest {
  string user_id = 1;
  optional string target_account_id = 2;
}
message SwitchTenancyAccountRequest {
  string user_id = 1;
  string account_id = 2;
}
message GetTenancyResponse {
  bool has_tenancy = 1;
  optional TenancyCurrentAccountProto current_account = 2;
  optional TenancyAccountSummaryProto owner_account = 3;
  repeated TenancyAccountSummaryProto sandboxes = 4;
  repeated TenancyOtherAccountProto other_accounts = 5;
  optional TenancyPendingRegistrationProto pending_registration = 6;
}
message GetCurrentUserRequest {
  string user_id = 1;
  optional string target_account_id = 2;
}
